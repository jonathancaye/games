<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa de Jogos</title>
<meta name="description" content="Pequenos jogos de mesa para jogar no navegador, sozinho ou com a turma.">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0e1615; --bg-2:#131f1d; --surface:#17231f; --line:#273935; --fg:#eaf2ef; --muted:#93a8a3;
  --teal:#2bc2b3; --orange:#ff9348; --teal-soft:rgba(43,194,179,.14); --orange-soft:rgba(255,147,72,.14);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{
  color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;min-height:100vh;
  background:
    radial-gradient(60% 50% at 0% 0%,rgba(43,194,179,.12),transparent 70%),
    radial-gradient(50% 45% at 100% 10%,rgba(255,147,72,.10),transparent 70%),
    var(--bg);
  padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
a{color:inherit}

/* topo */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,8vw,64px);letter-spacing:-.035em;line-height:.95;margin:.15em 0 0}
h1 span{color:var(--orange)}
.lead{margin:12px 0 0;color:var(--muted);max-width:44ch}
.count{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em;text-align:right}
.count small{display:block;font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* filtros (pills) */
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pills{display:inline-flex;flex-wrap:wrap;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.pills button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:8px 16px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.pills button:hover{color:var(--fg)}
.pills button[aria-pressed="true"]{background:var(--teal);color:#06201d}
.search{flex:0 1 240px;min-width:0;appearance:none;background:var(--bg-2);border:1px solid var(--line);color:var(--fg);font:500 15px var(--f-body);padding:10px 16px;border-radius:999px}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--teal);outline-offset:1px}

/* grade de jogos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.game{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  text-decoration:none;transition:transform .2s cubic-bezier(.3,1.4,.5,1),border-color .2s,box-shadow .2s}
a.game:hover,a.game:focus-visible{transform:translateY(-4px);border-color:var(--accent,var(--teal));box-shadow:0 16px 40px rgba(0,0,0,.35)}
a.game:focus-visible{outline:3px solid var(--accent,var(--teal));outline-offset:3px}
.art{aspect-ratio:16/9;position:relative;overflow:hidden;display:grid;place-items:center}
.info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.015em;line-height:1.1}
.info p{margin:0;color:var(--muted);font-size:14px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);color:var(--muted)}
.tag.cat{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.selo{position:absolute;left:14px;top:14px;z-index:2;font-size:12px;font-weight:800;background:linear-gradient(135deg,#f2c14e,#d99a1f);color:#2a1e04;padding:6px 12px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.play{position:absolute;right:14px;top:14px;z-index:2;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:999px;backdrop-filter:blur(4px);opacity:0;transform:translateY(-4px);transition:.2s}
a.game:hover .play,a.game:focus-visible .play{opacity:1;transform:none}
@media (hover:none){.play{opacity:1;transform:none}}

/* arte: Dados 6×6 */
.art.dados{background:linear-gradient(135deg,#123532,#172221)}
.dados .board{position:absolute;inset:12% 26%;display:grid;grid-template:repeat(6,1fr)/repeat(6,1fr);gap:4%;transform:rotate(-8deg)}
.dados .board i{border-radius:22%;background:rgba(255,255,255,.06)}
.dados .board i.t{background:var(--teal)} .dados .board i.o{background:var(--orange)}
.dados .die{position:absolute;width:21%;aspect-ratio:1;background:#eef4f3;border-radius:20%;box-shadow:0 6px 16px rgba(0,0,0,.45);
  display:grid;grid-template:repeat(3,minmax(0,1fr))/repeat(3,minmax(0,1fr));gap:clamp(3px,.7vw,7px);padding:clamp(9px,1.6vw,15px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.dados .die b{display:block;border-radius:50%;background:#14211f;visibility:hidden;min-width:0;min-height:0}
.dados .die b.on{visibility:visible}
.dados .d1{left:7%;bottom:10%;transform:rotate(-14deg)}
.dados .d2{right:7%;top:10%;transform:rotate(12deg)}
a.game:hover .dados .d1{transform:rotate(-200deg) translate(-6%,-6%)}
a.game:hover .dados .d2{transform:rotate(190deg)}

/* arte: Fodinha */
.art.fod{background:radial-gradient(80% 90% at 50% 100%,#3a1f4f,#1c1430 60%,#120e1f)}
.fod .fan{position:absolute;left:50%;bottom:16%;width:0;height:0}
.fod .c{position:absolute;left:0;bottom:0;width:clamp(48px,11vw,66px);aspect-ratio:5/7;margin-left:calc(clamp(48px,11vw,66px) / -2);background:#fbf7ec;border-radius:6px;
  box-shadow:0 4px 12px rgba(0,0,0,.45);transform-origin:50% 150%;transform:rotate(var(--r));display:grid;place-items:center;
  font:700 clamp(15px,3.4vw,21px)/1 var(--f-display);color:#1d1a16;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.fod .c.r{color:#c0392b}
.fod .c i{position:absolute;top:6%;left:9%;font-style:normal;font-size:.62em}
a.game:hover .fod .c{transform:rotate(calc(var(--r) * 1.35))}
.fod .bet{position:absolute;right:9%;top:13%;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#cdb8ee}
.fod .bet b{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#ff9348;color:#1c1430;font:800 22px var(--f-display);
  box-shadow:inset 0 0 0 4px #1c1430,inset 0 0 0 6px rgba(255,255,255,.55),0 4px 10px rgba(0,0,0,.4)}
.fod .ext{position:absolute;left:12px;top:12px;font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:#cdb8ee;
  border:1px solid rgba(205,184,238,.4);padding:4px 9px;border-radius:999px}

/* arte: Dice Wars */
.art.dw{background:radial-gradient(90% 90% at 50% 35%,#16303a,#0d1a20)}
.dw svg{position:absolute;inset:6% 4%;width:92%;height:88%;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.dw .stk{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
a.game:hover .dw .stk.a{transform:translate(0,-6px)}
a.game:hover .dw svg{transform:scale(1.04)}

/* arte: Scoundrel */
.art.scd{background:radial-gradient(85% 90% at 50% 100%,#3a1820,#1d1219 60%,#120c12)}
.scd .row{position:absolute;left:50%;top:44%;display:flex;gap:clamp(5px,1.4vw,9px);translate:-50% -50%}
.scd .k{width:clamp(40px,9vw,56px);aspect-ratio:5/7;background:#fbf7ec;border-radius:5px;box-shadow:0 4px 12px rgba(0,0,0,.5);position:relative;overflow:hidden;
  display:grid;place-items:center;padding-bottom:22%;font:800 clamp(14px,3.2vw,20px)/1 var(--f-display);color:#1d1a16;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.scd .k.r{color:#c8102e}
.scd .k u{position:absolute;left:0;right:0;bottom:0;height:22%;text-decoration:none;font:700 clamp(6px,1.3vw,8px)/1 var(--f-body);letter-spacing:.06em;color:#fff;display:grid;place-items:center}
.scd .k.m u{background:#334155} .scd .k.w u{background:#0f8f82} .scd .k.p u{background:#e11d48}
.scd .k:nth-child(odd){transform:translateY(4px)}
a.game:hover .scd .k:nth-child(2){transform:translateY(-10px) rotate(-4deg)}
.scd .hp{position:absolute;left:14%;right:14%;bottom:13%;height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.scd .hp i{display:block;height:100%;width:70%;background:linear-gradient(90deg,#0f8f82,#2bc2b3);border-radius:999px;transition:width .5s}
a.game:hover .scd .hp i{width:45%;background:linear-gradient(90deg,#c2410c,#ff9348)}

/* arte: Asfalto Turbo */
.art.atb{background:radial-gradient(90% 100% at 50% 40%,#3f8a4c,#2b6639 70%,#21522e)}
.atb svg{position:absolute;inset:0;width:100%;height:100%}
.atb .ln{transition:stroke-dashoffset .9s linear}
a.game:hover .atb .ln{stroke-dashoffset:-54}
.atb .me{transition:transform .6s cubic-bezier(.3,1.2,.5,1)}
a.game:hover .atb .me{transform:translate(2px,-28px) rotate(-22deg)}

/* arte: Arrancada 402 */
.art.arr{background:linear-gradient(180deg,#2a1640 0%,#6b2f5e 38%,#e0664f 62%,#ffb168 70%,#9a5844 71%,#4c2a2c 100%)}
.arr svg{position:absolute;inset:0;width:100%;height:100%}
.arr .c1,.arr .c2{transition:transform .7s cubic-bezier(.3,1.2,.5,1)}
a.game:hover .arr .c1{transform:translate(0,-16px) scale(.9)}
a.game:hover .arr .c2{transform:translate(0,-8px) scale(.95)}
.arr .tl{transition:fill .2s .15s}
a.game:hover .arr .tl{fill:#3ddc84}

/* arte: Náufragos */
.art.nfg{background:#0d3a40}
.art.grp{background:linear-gradient(180deg,#56b7ee 0%,#cdeefd 52%,#e4d7b9 52%)}
.art.grp .wh{transform-origin:150px 66px;animation:grpw 2.4s linear infinite}
@keyframes grpw{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.art.grp .wh{animation:none}}
.nfg svg{position:absolute;inset:0;width:100%;height:100%}
.nfg .m{transition:transform .6s cubic-bezier(.3,1.2,.5,1)}
a.game:hover .nfg .m{transform:translate(0,12.5px)}

/* em breve */
.game.soon{border-style:dashed;background:transparent}
.art.soon{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.025) 0 10px,transparent 10px 20px)}
.art.soon span{font-family:var(--f-display);font-weight:800;font-size:56px;color:var(--line)}

.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:13px;text-align:center;border-top:1px solid var(--line);padding-top:20px}

@media (max-width:520px){.count{display:none}.search{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <div class="eyebrow">Jogos rápidos · direto no navegador</div>
      <h1>Mesa de <span>Jogos</span></h1>
      <p class="lead">Escolha um jogo, junte a turma em volta do celular e bora. Nada para instalar.</p>
    </div>
    <div class="count" id="count">0<small>jogos</small></div>
  </header>

  <div class="bar">
    <div class="pills" role="group" aria-label="Filtrar por categoria" id="filters"></div>
    <input class="search" id="q" type="search" placeholder="Buscar jogo…" aria-label="Buscar jogo">
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>
  <p class="empty" id="empty" hidden>Nenhum jogo encontrado.</p>

  <footer>Feito para jogar junto. Novos jogos aparecem aqui.</footer>
</div>

<script>
/* =====================================================================
   CATÁLOGO DE JOGOS
   Para adicionar um jogo novo:
   1. crie a pasta jogos/<nome-do-jogo>/ com um index.html dentro;
   2. acrescente um item aqui embaixo (art pode ser "dados", "fod", "dw", "scd", "atb", "arr", "nfg", "grp" ou "soon";
      para arte nova, crie uma função em ARTS).
   ===================================================================== */
const GAMES = [
  {
    title: "Jogo dos Dados 6×6",
    url: "jogos/dados-6x6/",
    desc: "Role 2d6, marque a casa no tabuleiro e feche 3 trincas em linha antes dos outros.",
    category: "Dados",
    players: "1–3 jogadores",
    time: "10 min",
    extra: ["Contra o bot"],
    accent: "#2bc2b3",
    art: "dados"
  },
  {
    title: "Fodinha",
    url: "https://fodinha.cayzzo.com.br",
    external: true,
    desc: "Cada um aposta quantas rodadas vai fazer e precisa acertar na mosca. Errou, acumula erro. Online, com amigos ou contra bots.",
    category: "Cartas",
    players: "2–6 jogadores",
    time: "20 min",
    extra: ["Online", "Contra bots", "Ranking"],
    accent: "#a78bf0",
    art: "fod"
  },
  {
    title: "Dice Wars",
    url: "jogos/dice-wars/",
    desc: "Conquiste o mapa de territórios no braço dos dados. Ataque vizinhos, junte territórios conectados e ganhe reforços.",
    category: "Dados",
    players: "1 jogador vs 1–7 CPUs",
    time: "15 min",
    extra: ["Estratégia", "Contra o bot"],
    accent: "#e8833a",
    art: "dw"
  },
  {
    title: "Scoundrel",
    url: "jogos/scoundrel/",
    desc: "Desça a masmorra com um baralho: enfrente monstros, troque de arma e beba poções na hora certa. Clássico ou Sem fim, andar por andar.",
    category: "Cartas",
    players: "1 jogador",
    time: "10 min",
    extra: ["Solo", "Roguelike", "Modo sem fim"],
    accent: "#e4485d",
    art: "scd"
  },
  {
    title: "Asfalto Turbo",
    url: "jogos/asfalto-turbo/",
    desc: "Corrida na estrada vista de cima: desvie do trânsito, derrape nas curvas e vá o mais longe possível antes de acabar a gasolina.",
    category: "Arcade",
    players: "1 jogador",
    time: "5 min",
    extra: ["Solo", "Corrida", "Recorde"],
    accent: "#ff9348",
    art: "atb"
  },
  {
    title: "Arrancada 402",
    url: "jogos/arrancada-402/",
    desc: "Arrancada de 402 m com um botão só: largue no verde, troque a marcha na hora certa e use o prêmio para comprar carros e fazer upgrades.",
    category: "Arcade",
    players: "1 jogador",
    time: "5 min",
    extra: ["Solo", "Corrida", "Garagem"],
    accent: "#2dd4bf",
    art: "arr"
  },
  {
    title: "Náufragos",
    url: "jogos/naufragos/",
    desc: "Puzzle tático por tiques: junte madeira, construa a jangada e fuja da ilha sem cair no campo de visão dos piratas.",
    category: "Puzzle",
    players: "1 jogador",
    time: "10 min",
    extra: ["Solo", "Furtividade", "Fases"],
    accent: "#2bc2b3",
    art: "nfg"
  },
  {
    title: "Garapeiro",
    url: "jogos/garapeiro/",
    desc: "Monte sua barraca de caldo de cana: compre insumos, acerte receita e preço conforme o tempo e faça o maior caixa em 30 dias.",
    category: "Gestão",
    players: "1 jogador",
    time: "15 min",
    extra: ["Solo", "Tycoon", "Recorde"],
    accent: "#e8772e",
    art: "grp"
  },
  {
    title: "Em breve",
    desc: "O próximo jogo da mesa está sendo preparado.",
    category: null,
    soon: true,
    art: "soon"
  }
];

/* ---------- artes dos cards ---------- */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const die=(v,cls)=>`<div class="die ${cls}">${Array.from({length:9},(_,i)=>`<b class="${PIPS[v].includes(i)?"on":""}"></b>`).join("")}</div>`;
const ARTS = {
  dados(){
    const t=[0,7,14,21,9,27],o=[5,10,15,30,33];
    const cells=Array.from({length:36},(_,i)=>`<i class="${t.includes(i)?"t":o.includes(i)?"o":""}"></i>`).join("");
    return `<div class="board">${cells}</div>${die(3,"d1")}${die(5,"d2")}`;
  },
  fod(){
    const cs=[["7","♣",0,-26],["Q","♥",1,-13],["A","♠",0,0],["3","♦",1,13],["K","♣",0,26]];
    return `<span class="ext">↗ Site externo</span><div class="fan">${cs.map(([r,su,red,a])=>`<div class="c${red?" r":""}" style="--r:${a}deg"><i>${r}</i>${su}</div>`).join("")}</div><div class="bet"><b>2</b>Faço</div>`;
  },
  dw(){
    const C={t:"#2bb3a3",o:"#e8833a",v:"#8b6bd8",g:"#d6b23e"};
    const map=["..tttooo..","..ttttooo.",".vvttgoooo",".vvvtggoo.","vvvvgggg..",".vvv.ggg.."];
    const R=10,S=Math.sqrt(3)*R;let hex="";
    map.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch===".")return;const x=c*S+(r%2?S/2:0)+S,y=r*R*1.5+R+14;
      const pts=[0,1,2,3,4,5].map(k=>{const a=(60*k-30)*Math.PI/180;return `${(x+R*Math.cos(a)).toFixed(1)},${(y+R*Math.sin(a)).toFixed(1)}`}).join(" ");
      hex+=`<polygon points="${pts}" fill="${C[ch]}" stroke="#0b1519" stroke-width="1.6"/>`;}));
    const cube=(x,y,c)=>`<path d="M${x-7} ${y}L${x} ${y+4}L${x} ${y+11}L${x-7} ${y+7}Z" fill="${c}" stroke="#0b1519" stroke-width=".8"/><path d="M${x} ${y+4}L${x+7} ${y}L${x+7} ${y+7}L${x} ${y+11}Z" fill="${c}" stroke="#0b1519" stroke-width=".8" style="filter:brightness(.7)"/><path d="M${x} ${y-4}L${x+7} ${y}L${x} ${y+4}L${x-7} ${y}Z" fill="#fff" fill-opacity=".45" stroke="#0b1519" stroke-width=".8"/><circle cx="${x}" cy="${y}" r="1.2" fill="#fff"/>`;
    const stk=(x,y,n,c,cls)=>`<g class="stk ${cls}">${Array.from({length:n},(_,k)=>cube(x,y-k*7,c)).join("")}</g>`;
    return `<svg viewBox="0 0 200 110" preserveAspectRatio="xMidYMid meet">${hex}${stk(88,30,4,C.t,"a")}${stk(150,40,3,C.o,"")}${stk(44,74,2,C.v,"")}${stk(118,72,3,C.g,"")}</svg>`;
  },
  scd(){
    const cs=[["K","♠","m","MONSTRO"],["7","♦","w","ARMA"],["5","♥","p","POÇÃO"],["9","♣","m","MONSTRO"]];
    return `<div class="row">${cs.map(([r,s,t,l])=>`<div class="k ${t}${t!=="m"?" r":""}">${r}${s}<u>${l}</u></div>`).join("")}</div><div class="hp"><i></i></div>`;
  },
  atb(){
    const car=(x,y,c,r,me)=>`<g transform="translate(${x} ${y})"><g class="${me?"me":""}"><g transform="rotate(${r})"><rect x="-6.5" y="-11" width="13" height="22" rx="3.5" fill="rgba(0,0,0,.35)" transform="translate(2 2)"/><rect x="-6.5" y="-11" width="13" height="22" rx="3.5" fill="${c}"/>${me?'<rect x="-2.2" y="-11" width="1.5" height="22" fill="#ff9348"/><rect x=".7" y="-11" width="1.5" height="22" fill="#ff9348"/>':""}<rect x="-5" y="-6" width="10" height="3.5" rx="1" fill="#15222a"/><rect x="-4.5" y="3" width="9" height="2.5" rx="1" fill="#15222a"/></g></g></g>`;
    const road="M70 -10 C 70 40, 130 60, 128 122";
    return `<svg viewBox="0 0 200 112" preserveAspectRatio="xMidYMid slice"><path d="${road}" stroke="#ff9348" stroke-width="82" fill="none" stroke-dasharray="7 7"/><path d="${road}" stroke="#f2f4f5" stroke-width="82" fill="none" stroke-dasharray="7 7" stroke-dashoffset="7"/><path d="${road}" stroke="#3c434b" stroke-width="72" fill="none"/><path class="ln" d="${road}" stroke="#eef2f3" stroke-width="2" fill="none" stroke-dasharray="9 9"/><path class="sk" d="M86 104 C 88 96, 92 90, 97 84" stroke="rgba(10,10,12,.45)" stroke-width="2.5" fill="none"/>${car(118,30,"#5b8def",-22)}${car(80,56,"#f2c94c",-28)}${car(104,86,"#2bc2b3",-12,1)}</svg>`;
  },
  arr(){
    const car=(x,col,cls)=>`<g class="${cls}" style="transform-origin:${x}px 96px"><rect x="${x-17}" y="92" width="34" height="6" rx="2" fill="rgba(20,8,20,.5)"/><rect x="${x-15}" y="78" width="30" height="16" rx="3" fill="${col}"/><rect x="${x-11}" y="70" width="22" height="10" rx="3" fill="${col}" opacity=".85"/><rect x="${x-9}" y="72" width="18" height="6" rx="1.5" fill="#1c2233"/><rect x="${x-13}" y="83" width="7" height="3" rx="1" fill="#ff3048"/><rect x="${x+6}" y="83" width="7" height="3" rx="1" fill="#ff3048"/><rect x="${x-5}" y="88" width="10" height="3" fill="#efeee6"/><rect x="${x-16}" y="91" width="5" height="6" rx="1" fill="#111"/><rect x="${x+11}" y="91" width="5" height="6" rx="1" fill="#111"/></g>`;
    return `<svg viewBox="0 0 200 112" preserveAspectRatio="xMidYMid slice"><circle cx="140" cy="76" r="12" fill="#ffe2a6"/><path d="M0 80 L30 70 L52 76 L80 66 L110 76 L150 68 L176 75 L200 70 L200 80Z" fill="#3e2140"/><path d="M92 79 L108 79 L170 112 L30 112Z" fill="#423b48"/><path d="M99.4 79 L100.6 79 L101.5 112 L98.5 112Z" fill="#f2c14e"/><rect x="96" y="40" width="8" height="26" rx="2" fill="#140c18"/><circle cx="100" cy="45" r="2.2" fill="#ffb020"/><circle cx="100" cy="52" r="2.2" fill="#ffb020"/><circle class="tl" cx="100" cy="59" r="2.2" fill="#22332a"/><rect x="99.3" y="66" width="1.4" height="13" fill="#140c18"/>${car(72,"#f2c94c","c1")}${car(128,"#2dd4bf","c2")}</svg>`;
  },
  nfg(){
    const map=["~~~~~~~~~~~~~~~~","~~~..,,.T..~~~~~","~~.T.,,..O..T.~~","~~..w.....,,..~~","~~.T..O...,,.~~~","~~~~...R...~~~~~"];
    const C={".":"#cfae74",",":"#3f7d3c",T:"#3a7136",O:"#cfae74",w:"#cfae74",R:"#cfae74"};
    const s=12.5;let t="";
    map.forEach((row,y)=>[...row].forEach((c,x)=>{if(c==="~")return;const X=x*s,Y=y*s+18;
      t+=`<rect x="${X}" y="${Y}" width="${s}" height="${s}" fill="${C[c]}"/>`;
      if(c==="T")t+=`<circle cx="${X+6.2}" cy="${Y+5.6}" r="4.6" fill="#245a2d"/><circle cx="${X+5}" cy="${Y+4.6}" r="2.6" fill="#3a8743"/>`;
      if(c==="O")t+=`<path d="M${X+2} ${Y+9.5}L${X+3.4} ${Y+4.4}L${X+6.4} ${Y+2.4}L${X+9.6} ${Y+4}L${X+10.8} ${Y+9.2}Z" fill="#8a948f"/>`;
      if(c==="w")t+=`<rect x="${X+2.4}" y="${Y+5.6}" width="8" height="2.6" rx="1.3" fill="#9a6232"/><rect x="${X+3.2}" y="${Y+3.2}" width="7" height="2.6" rx="1.3" fill="#ad7140"/>`;
      if(c==="R")t+=`<rect x="${X+1.5}" y="${Y+2}" width="9.5" height="8.5" rx="1" fill="none" stroke="#2bc2b3" stroke-width="1"/>`;}));
    const vis=[8,9,10].map(x=>`<rect x="${x*s+.6}" y="${3*s+18.6}" width="${s-1.2}" height="${s-1.2}" rx="1.5" fill="rgba(240,82,95,${x===10?.18:.42})" stroke="#f0525f" stroke-width=".5"/>`).join("");
    const guard=`<g transform="translate(${11*s} ${3*s+18})"><path d="M0 6.2L3.2 3.6V8.8Z" fill="#ffd7c2"/><circle cx="6.2" cy="6.2" r="4.4" fill="#f0525f" stroke="#3a0c12" stroke-width=".8"/></g>`;
    const me=`<g transform="translate(${6*s} ${2*s+18})"><g class="m"><circle cx="6.2" cy="6.2" r="4.6" fill="#2bc2b3" stroke="#06201d" stroke-width=".8"/><text x="6.2" y="8.1" text-anchor="middle" font-size="5.6" font-weight="800" fill="#06201d" font-family="Figtree,sans-serif">M</text></g></g>`;
    return `<svg viewBox="0 0 200 112" preserveAspectRatio="xMidYMid slice">${t}${vis}${guard}${me}</svg>`;
  },
  grp(){
    const stripes=Array.from({length:8},(_,i)=>`<rect x="${44+i*14}" y="16" width="14.5" height="13" fill="${i%2?"#f2c230":"#2f7d4a"}"/><circle cx="${51+i*14}" cy="29" r="7" fill="${i%2?"#f2c230":"#2f7d4a"}"/>`).join("");
    const sp=[0,60,120].map(a=>`<line x1="${150+11*Math.cos(a*Math.PI/180)}" y1="${66+11*Math.sin(a*Math.PI/180)}" x2="${150-11*Math.cos(a*Math.PI/180)}" y2="${66-11*Math.sin(a*Math.PI/180)}"/>`).join("");
    return `<svg viewBox="0 0 200 112" preserveAspectRatio="xMidYMid slice"><circle cx="170" cy="14" r="9" fill="#fff2a8"/>
      <rect x="47" y="28" width="3" height="50" fill="#7a5230"/><rect x="150" y="28" width="3" height="50" fill="#7a5230"/>
      <rect x="40" y="4" width="120" height="12" rx="3" fill="#1f5e3a"/><text x="100" y="13.3" text-anchor="middle" font-size="8" font-weight="900" fill="#fff" font-family="system-ui,sans-serif">GARAPA</text>${stripes}
      <circle cx="92" cy="58" r="5" fill="#c98e62"/><path d="M87 54a5 5 0 0 1 10 0z" fill="#2f7d4a"/><rect x="87" y="63" width="10" height="12" rx="3" fill="#f4f1ea"/>
      <rect x="64" y="58" width="11" height="17" rx="2" fill="rgba(210,235,245,.7)" stroke="#7896a0"/><rect x="65.5" y="65" width="8" height="9" fill="#c4cc55"/>
      <rect x="118" y="60" width="22" height="15" rx="2" fill="#8f9aa0"/>
      <g class="wh" stroke="#5f6a70" stroke-width="2" fill="none"><circle cx="150" cy="66" r="11" stroke-width="3"/>${sp}</g>
      <rect x="40" y="74" width="120" height="6" rx="2" fill="#e9d3a6"/><rect x="42" y="80" width="116" height="22" rx="3" fill="#b97a45"/>
      <g stroke="#6fae3c" stroke-width="3.5"><line x1="34" y1="102" x2="40" y2="66"/><line x1="38" y1="102" x2="44" y2="68"/></g>
      <circle cx="60" cy="104" r="5" fill="#333"/><circle cx="140" cy="104" r="5" fill="#333"/></svg>`;
  },
  soon(){return `<span>?</span>`;}
};

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hexSoft=h=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},.16)`;};
let filter="Todos";

/* selo do Náufragos: gravado pelo jogo (mesmo site) ao fazer a fuga perfeita na fase secreta */
const mestre=(()=>{try{return localStorage.getItem("naufragos.mestre")==="1";}catch(e){return false;}})();
function card(g){
  const tags=g.soon?"":`<div class="tags"><span class="tag cat">${esc(g.category)}</span><span class="tag">${esc(g.players)}</span><span class="tag">${esc(g.time)}</span>${(g.extra||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`;
  const inner=`<div class="art ${g.art}" aria-hidden="true">${ARTS[g.art]?ARTS[g.art]():""}</div>
    ${g.soon?"":`<span class="play">${g.external?"Abrir ↗":"Jogar →"}</span>`}
    ${g.art==="nfg"&&mestre?`<span class="selo">★ Mestre da Fuga</span>`:""}
    <div class="info"><h2>${esc(g.title)}</h2><p>${esc(g.desc)}</p>${tags}</div>`;
  const style=g.accent?` style="--accent:${g.accent};--accent-soft:${hexSoft(g.accent)}"`:"";
  return g.soon?`<div class="game soon">${inner}</div>`:`<a class="game" href="${g.url}"${g.external?' target="_blank" rel="noopener"':""}${style}>${inner}</a>`;
}

function render(){
  const q=$("q").value.trim().toLowerCase();
  const list=GAMES.filter(g=>{
    if(g.soon)return filter==="Todos"&&!q;
    if(filter!=="Todos"&&g.category!==filter)return false;
    return !q||[g.title,g.desc,g.category,...(g.extra||[])].join(" ").toLowerCase().includes(q);
  });
  $("grid").innerHTML=list.map(card).join("");
  $("empty").hidden=list.length>0;
}

function renderFilters(){
  const cats=["Todos",...new Set(GAMES.filter(g=>!g.soon).map(g=>g.category))];
  $("filters").innerHTML=cats.map(c=>`<button type="button" data-c="${esc(c)}" aria-pressed="${c===filter}">${esc(c)}</button>`).join("");
}
$("filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.c;renderFilters();render();});
$("q").addEventListener("input",render);

const n=GAMES.filter(g=>!g.soon).length;
$("count").innerHTML=`${n}<small>${n===1?"jogo":"jogos"}</small>`;
renderFilters();render();
</script>
</body>
</html>
