<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f4c4f">
<title>Fisgada</title>
<style>
:root{--bg:#eef5f2;--card:#fff;--ink:#17312f;--muted:#5f7774;--teal:#14919b;--teal-d:#0f4c4f;--teal-l:#c2e6e1;--orange:#f08a24;--orange-l:#fde8d3;--red:#d2453a;--line:#d3e3df;--gold:#e7b416}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a3436;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:6px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--teal-d);color:#fff;font-weight:700;font-size:13px}
.top a{color:#fff;text-decoration:none;font-size:13px;padding:2px 4px}
.grow{flex:1}
.chip{background:rgba(255,255,255,.14);padding:5px 9px;border-radius:999px;white-space:nowrap}
.chip.or{background:var(--orange)}
.panel{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.btn{border:0;border-radius:12px;font-weight:800;font-size:15px;padding:12px 14px;background:var(--teal);color:#fff;font-family:inherit;cursor:pointer}
.btn.or{background:var(--orange)}
.btn.ghost{background:var(--teal-l);color:var(--teal-d);box-shadow:inset 0 0 0 1.5px rgba(20,145,155,.35)}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.35}
.btns{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.btns .btn{flex:1}
.muted{color:var(--muted)}
h2{margin:0 0 4px;font-size:20px}
/* título */
#title{background:linear-gradient(180deg,#0f4c4f 0%,#14919b 55%,#7fd0c6 100%);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px}
#title .logo{font-size:54px;font-weight:900;letter-spacing:-1px;line-height:1}
#title .logo span{color:var(--orange)}
#title .sub{opacity:.85;margin:8px 0 26px;font-weight:600}
#title .btn{width:240px;margin:5px 0}
#title .rec{margin-top:16px;font-size:13px;opacity:.85}
#title .back{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;color:#fff;text-decoration:none;font-size:13px;font-weight:700;opacity:.9}
#titleCv{width:240px;height:120px;margin-bottom:10px}
/* manhã */
.wxbig{display:flex;gap:14px;align-items:center}
.wxbig .ic{font-size:52px;line-height:1}
.wxbig b{font-size:19px}
.tip{margin-top:10px;background:var(--orange-l);color:#8a4a0c;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}
.envs{display:flex;gap:4px;background:var(--teal-l);padding:4px;border-radius:999px;margin-top:4px}
.envs span{flex:1;text-align:center;padding:8px 0;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--muted)}
.envs span.on{background:var(--teal);color:#fff}
.small{font-size:12px}
.eq{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px;font-size:13px}
.eq div{background:var(--bg);border-radius:10px;padding:7px 9px}
.eq b{display:block;font-size:14px}
.eq div{display:flex;flex-direction:column;gap:4px}
.eq .lvl{margin-left:0}
.baitrow{margin-top:8px;background:var(--bg);border-radius:10px;padding:7px 9px;font-size:13px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}
.bgrid span{display:flex;justify-content:space-between}
.baitrow small{display:block;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
/* pesca */
.hud{display:flex;align-items:center;gap:5px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--teal-d);color:#fff;font-weight:700;font-size:12.5px}
.hud .chip{padding:5px 8px}
.hud button{background:none;border:0;color:#fff;font-size:18px;padding:0 4px;font-family:inherit}
.mapwrap{position:relative;flex:1;min-height:200px;background:#7bb661;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#sonarBox{position:absolute;top:8px;right:8px;background:#06222b;border:2px solid #0b3b47;border-radius:10px;padding:3px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#sonar{display:block;width:124px;height:86px;border-radius:6px}
#sonarBox .lb{color:#7fe3d6;font-size:9.5px;font-weight:800;letter-spacing:.8px;padding:1px 3px 2px;display:flex;justify-content:space-between}
.spotlbl{position:absolute;top:8px;left:8px;background:rgba(10,52,54,.82);color:#fff;border-radius:10px;padding:6px 9px;font-size:11.5px;max-width:52%}
.spotlbl b{display:block;font-size:13px}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(10,52,54,.9);color:#fff;font-weight:700;font-size:13px;padding:8px 12px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
.ctrl{display:flex;gap:10px;padding:10px 10px 4px;background:var(--bg);border-top:1px solid var(--line)}
.dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:3px;flex:none}
.dpad button{border:0;border-radius:10px;background:var(--teal-l);box-shadow:inset 0 0 0 1.5px rgba(20,145,155,.3);color:var(--teal-d);font-size:18px;font-weight:900;font-family:inherit}
.dpad button:disabled{opacity:.3}
.dpad .c{background:transparent;font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;font-weight:700}
.rcol{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.baits{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.baits button{border:2px solid transparent;border-radius:10px;background:var(--card);padding:5px 6px;font-family:inherit;font-size:12px;font-weight:700;color:var(--ink);text-align:left;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.baits button i{font-style:normal;font-size:15px}
.baits button small{margin-left:auto;color:var(--muted);font-weight:700}
.baits button.on{border-color:var(--orange);background:var(--orange-l)}
.baits button:disabled{opacity:.4}
#castBtn{flex:1;min-height:46px;font-size:17px}
#castBtn.bite{background:var(--orange);animation:pulse .35s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
.foot{display:flex;align-items:center;justify-content:space-between;padding:4px 12px calc(8px + env(safe-area-inset-bottom));font-size:12px;color:var(--muted);background:var(--bg)}
.foot button{background:none;border:0;color:var(--teal-d);font-weight:800;font-size:12.5px;font-family:inherit;padding:4px 0}
/* briga */
.ov{position:absolute;inset:0;background:rgba(6,34,43,.55);display:none;align-items:center;justify-content:center;z-index:5;padding:14px}
.ov.on{display:flex}
.fightCard{background:var(--card);border-radius:18px;width:100%;max-width:420px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#fightCv{width:100%;height:min(330px,46vh);display:block;border-radius:12px;background:#0d5a6b}
.bar{height:14px;border-radius:999px;background:#e5eeec;position:relative;overflow:hidden;margin-top:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.tens{background:linear-gradient(90deg,#c9ecd9 0 60%,#fbe9b8 60% 85%,#f6c9c4 85% 100%)}
.tens i{background:none;border-right:4px solid var(--ink);border-radius:0}
.lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:8px}
#fightOv{padding:8px;background:rgba(6,34,43,.35)}
#fightOv .fightCard{height:100%;display:flex;flex-direction:column;padding:8px}
#fightOv #fightCv{flex:1;height:auto;min-height:0}
#castBtn{touch-action:none}
#castBtn.hold{background:var(--orange)}
#castBtn.hold.down{background:#c86a10}
#fightMsg{text-align:center;font-weight:800;font-size:14px;min-height:20px;margin-top:6px}
#fightMsg.run{color:var(--red)}
/* captura */
.catchCard{background:var(--card);border-radius:18px;width:100%;max-width:360px;padding:16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#catchCv{width:100%;height:130px;display:block}
.catchCard h3{margin:4px 0 2px;font-size:22px}
.flags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.flag{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--teal-l);color:var(--teal-d)}
.flag.gold{background:#fff1bf;color:#8a6300}
.flag.or{background:var(--orange-l);color:#a14f08}
.big{font-size:26px;font-weight:900}
/* listas */
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px}
.row .tx{flex:1;min-width:0}
.row .tx b{font-size:14.5px}
.row .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.row canvas{width:64px;height:34px;flex:none}
.row .ic{font-size:24px;width:34px;text-align:center;flex:none}
.sect{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 2px 6px}
.sumline{display:flex;justify-content:space-between;font-weight:700;padding:4px 2px}
.lvl{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.lvl i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--orange)}
</style>
</head>
<body>
<div id="app">

<!-- TÍTULO -->
<section class="screen on" id="title">
  <a class="back" href="../../">← Mesa de Jogos</a>
  <canvas id="titleCv"></canvas>
  <div class="logo">Fisg<span>ada</span></div>
  <div class="sub">Temporada de pesca · 30 dias</div>
  <button class="btn or" id="btnCont" style="display:none">Continuar</button>
  <button class="btn" id="btnNew">Nova temporada</button>
  <div class="rec" id="recTxt"></div>
</section>

<!-- MANHÃ -->
<section class="screen" id="morning">
  <div class="top"><a href="#" data-go="title">☰</a><span class="grow" id="mTitle">Dia 1</span><span class="chip" id="mMoney"></span></div>
  <div class="panel">
    <div class="card">
      <div class="wxbig"><div class="ic" id="mWxIc"></div><div><div class="muted small">Previsão de hoje</div><b id="mWxName"></b><div class="muted small" id="mWxDesc"></div></div></div>
      <div class="tip" id="mTip"></div>
    </div>
    <div class="card">
      <b>Onde pescar</b>
      <div class="envs" id="mEnvs"></div>
      <div class="muted small" style="margin-top:8px" id="mEnvNote"></div>
    </div>
    <div class="card" id="mTour" style="display:none"></div>
    <div class="card">
      <b>Seu equipamento</b>
      <div class="eq" id="mEq"></div>
      <div class="baitrow" id="mBaits"></div>
    </div>
  </div>
  <div class="btns"><button class="btn ghost" data-go="shop">Loja</button><button class="btn ghost" data-go="album">Álbum</button><button class="btn or" id="btnFish">Pescar 🎣</button></div>
</section>

<!-- PESCA -->
<section class="screen" id="fish">
  <div class="hud">
    <button id="hudMenu">☰</button>
    <span class="chip" id="hDay"></span>
    <span class="chip" id="hClock"></span>
    <span class="grow"></span>
    <span class="chip" id="hWx"></span>
    <span class="chip or" id="hMoney"></span>
  </div>
  <div class="mapwrap" id="mapwrap">
    <canvas id="map"></canvas>
    <div class="spotlbl" id="spotLbl"></div>
    <div id="sonarBox"><div class="lb"><span>SONAR</span><span id="sonarLv"></span></div><canvas id="sonar"></canvas></div>
    <div id="toast"></div>
    <div class="ov" id="fightOv">
      <div class="fightCard">
        <canvas id="fightCv"></canvas>
        <div id="fightMsg"></div>
      </div>
    </div>
  </div>
  <div class="ctrl">
    <div class="dpad">
      <span></span><button data-mv="u">▲</button><span></span>
      <button data-mv="l">◀</button><span class="c" id="moveCost"></span><button data-mv="r">▶</button>
      <span></span><button data-mv="d">▼</button><span></span>
    </div>
    <div class="rcol">
      <div class="baits" id="baits"></div>
      <button class="btn" id="castBtn">Lançar</button>
    </div>
  </div>
  <div class="foot"><span id="fCatch">Nenhum peixe ainda</span><button id="btnEnd">Encerrar o dia ›</button></div>


  <div class="ov" id="catchOv">
    <div class="catchCard">
      <canvas id="catchCv"></canvas>
      <h3 id="cName"></h3>
      <div class="muted" id="cInfo"></div>
      <div class="flags" id="cFlags"></div>
      <div class="big" id="cVal"></div>
      <button class="btn" style="width:100%;margin-top:12px" id="cOk">Continuar</button>
    </div>
  </div>
</section>

<!-- FIM DO DIA -->
<section class="screen" id="night">
  <div class="top"><span class="grow" id="nTitle"></span><span class="chip" id="nMoney"></span></div>
  <div class="panel" id="nBody"></div>
  <div class="btns"><button class="btn ghost" data-go="shop">Loja</button><button class="btn ghost" data-go="album">Álbum</button><button class="btn or" id="btnNext">Próximo dia</button></div>
</section>

<!-- LOJA -->
<section class="screen" id="shop">
  <div class="top"><a href="#" id="shopBack">← Voltar</a><span class="grow">Loja</span><span class="chip or" id="sMoney"></span></div>
  <div class="panel" id="sBody"></div>
</section>

<!-- ÁLBUM -->
<section class="screen" id="album">
  <div class="top"><a href="#" id="albBack">← Voltar</a><span class="grow">Álbum de espécies</span><span class="chip" id="aCount"></span></div>
  <div class="panel" id="aBody"></div>
</section>

<!-- FIM DE TEMPORADA -->
<section class="screen" id="season">
  <div class="top"><span class="grow">Fim da temporada</span></div>
  <div class="panel" id="seBody"></div>
  <div class="btns"><button class="btn ghost" id="btnNewSeason">Nova temporada</button><button class="btn or" id="btnEndless">Modo Sem fim</button></div>
</section>

</div>
<script>
"use strict";
/* ================= dados ================= */
const SAVE="fisgada.save", BEST="fisgada.best";
const SEASON_DAYS=30, DAY_MIN=720;
const BANDS=["Amanhecer","Manhã","Meio-dia","Tarde","Entardecer"];
const BAITS={
  minhoca:{nome:"Minhoca",ic:"🪱",pack:10,preco:10,natural:true},
  massa:{nome:"Massa",ic:"🌽",pack:10,preco:8,natural:true},
  vivo:{nome:"Isca viva",ic:"🐟",pack:10,preco:20,natural:true},
  camarao:{nome:"Camarão",ic:"🦐",pack:10,preco:15,natural:true},
  sardinha:{nome:"Sardinha",ic:"🐠",pack:10,preco:12,natural:true},
  art:{nome:"Artificial",ic:"🪝",preco:200,natural:false}
};
const WX={
  sol:{nome:"Sol",ic:"☀️",p:25,g:1,desc:"Céu limpo e água clara."},
  forte:{nome:"Sol forte",ic:"🔆",p:15,g:.9,desc:"Calor e pouca nuvem. No meio-dia os peixes vão para o fundo."},
  nublado:{nome:"Nublado",ic:"☁️",p:22,g:1.15,desc:"Céu fechado, luz baixa. Dia de mordida boa."},
  garoa:{nome:"Garoa",ic:"🌦️",p:15,g:1.1,desc:"Chuva fina e água calma."},
  chuva:{nome:"Chuva forte",ic:"🌧️",p:8,g:.85,desc:"Água turva: isca natural rende mais que artificial."},
  fria:{nome:"Frente fria",ic:"🥶",p:7,g:.6,desc:"Queda de temperatura. A maioria dos peixes fica parada."},
  vento:{nome:"Vento",ic:"💨",p:8,g:.9,desc:"Água encrespada: as margens abrigadas rendem mais."}
};
/* mv: [estilo de movimento na briga, dificuldade] · art: aparência no desenho */
const SPECIES={
  /* ---------- LAGO ---------- */
  lambari:{env:"lago",nome:"Lambari",avg:.05,min:.02,max:.13,kg:40,rar:"Comum",col:"#d8e2e4",mv:["suave",.5],
    bait:{minhoca:.8,massa:1},wx:{fria:.7},
    art:{h:.32,back:"#7f969c",body:"#d4dde0",belly:"#f3f6f6",tail:"#e8b923",fin:"#e8b923",mark:"lambari"},
    hint:"Pequeno e esfomeado. Vai em qualquer isca miúda."},
  tilapia:{env:"lago",nome:"Tilápia",avg:.8,min:.3,max:2.8,kg:10,rar:"Comum",col:"#7fb2ff",mv:["misto",.8],
    bait:{minhoca:.7,massa:1,art:.05},wx:{sol:1.3,forte:1.1,garoa:.9,chuva:.7,fria:.5},tm:[.9,1.1,1.2,1,1],
    art:{h:.46,back:"#596a66",body:"#93a29d",belly:"#d9dfdc",tail:"#8d9a96",fin:"#7d8a86",mark:"bars6"},
    hint:"Gosta de sol e de massa. As maiores ficam no fundo."},
  traira:{env:"lago",nome:"Traíra",avg:1.2,min:.4,max:4,kg:12,rar:"Incomum",col:"#c58a4a",mv:["afunda",1.05],
    bait:{minhoca:.3,vivo:1,art:.7},wx:{sol:.8,forte:.6,nublado:1.4,garoa:1.3,chuva:1.1,fria:.6,vento:.9},tm:[1.6,1,.6,1,1.6],
    art:{h:.26,back:"#3b3022",body:"#6e5c3f",belly:"#b9a682",tail:"#5a4a32",fin:"#5a4a32",mark:"spots",roundTail:true},
    hint:"Predadora de tocaia. Ataca isca viva no amanhecer e no entardecer."},
  tucunare:{env:"lago",nome:"Tucunaré",avg:1.6,min:.6,max:5.5,kg:22,rar:"Raro",col:"#f5d33b",mv:["dardo",1.35],calor:true,
    bait:{minhoca:.1,vivo:.8,art:1},wx:{sol:1.3,forte:1.5,nublado:.8,garoa:.6,chuva:.5,fria:.3,vento:.8},tm:[1.4,1.3,.8,1,1.1],
    art:{h:.36,back:"#5e7a2e",body:"#c9c24a",belly:"#efe7a6",tail:"#a9a33c",fin:"#9a8f2e",mark:"tucuna",redEye:true,tallFin:true},
    hint:"Ama calor e isca artificial. Fica perto de pedras e galhos."},
  acu:{env:"lago",nome:"Tucunaré-açu dourado",avg:8,min:6,max:11,kg:35,rar:"Lendário",col:"#ffcf3a",mv:["dardo",1.9],
    legend:{spot:5,bait:"art",wx:["forte"],band:[0],ch:.14},
    art:{h:.37,back:"#b37a12",body:"#f2c94c",belly:"#fff2b8",tail:"#e8b028",fin:"#d69a1e",mark:"tucuna",redEye:true,tallFin:true,glow:true},
    hint:"Dizem que aparece nas pedras, num amanhecer de sol forte, atrás de isca que brilha…"},
  /* ---------- RIO ---------- */
  piau:{env:"rio",nome:"Piau",avg:.6,min:.2,max:2,kg:14,rar:"Comum",col:"#cfd8c8",mv:["misto",.8],
    bait:{massa:1,minhoca:.8},wx:{nublado:1.2,garoa:1.1,forte:.8,fria:.6},tm:[1.1,1,.9,1,1.1],
    art:{h:.3,back:"#6f7f74",body:"#b9c4bc",belly:"#eef1ee",tail:"#9aa79d",fin:"#8d998f",mark:"dots3"},
    hint:"Cardume do remanso. Massa e milho funcionam bem."},
  pacu:{env:"rio",nome:"Pacu",avg:2.5,min:.8,max:8,kg:10,rar:"Incomum",col:"#e08a3c",mv:["misto",1],calor:true,
    bait:{massa:1,minhoca:.3},wx:{sol:1.3,forte:1.4,nublado:.9,garoa:.8,chuva:.7,fria:.4},tm:[.9,1.1,1.3,1.1,.9],
    art:{h:.6,back:"#3d4a4f",body:"#6f7c80",belly:"#e08a3c",tail:"#4a585c",fin:"#4a585c"},
    hint:"Redondo e forte. Gosta de calor e de massa nas águas calmas."},
  matrinxa:{env:"rio",nome:"Matrinxã",avg:1.5,min:.5,max:4,kg:14,rar:"Incomum",col:"#c2ccd0",mv:["dardo",1.15],
    bait:{massa:.9,art:.7,vivo:.3,minhoca:.4},wx:{sol:1.2,forte:1.1,chuva:.8,fria:.5},tm:[1.2,1.2,.9,1,1.1],

const $=s=>document.querySelector(s);
const rnd=Math.random;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const band=t=>t<120?0:t<300?1:t<480?2:t<600?3:4;
const hhmm=t=>{const m=Math.round(360+Math.min(t,DAY_MIN));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};

const brl=v=>"R$ "+Math.round(v).toLocaleString("pt-BR");
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const bf=(d,b)=>(d.bait&&d.bait[b])||0;
const wf=(d,w)=>d.wx&&d.wx[w]!=null?d.wx[w]:1;

let S=null;
function newSeason(){
  S={v:2,mode:"temporada",day:0,money:30,bait:{minhoca:20,massa:10,vivo:0,camarao:0,sardinha:0},art:false,rod:1,motor:1,sonar:1,
     album:{},earned:0,legends:0,caught:0,phase:"morning",wx:"sol",t:0,env:"lago",spot:3,today:[],stock:null,stockEnv:null,lastRegen:0,cur:"minhoca",tourPts:0,tour:null,tourLog:[]};
  startDay();
}
function rollWx(){
  if(S.day===1)return"sol";
  let r=rnd()*100;for(const k in WX){r-=WX[k].p;if(r<=0)return k}return"sol";
}
function startDay(){
  S.day++;S.wx=rollWx();S.t=0;S.today=[];S.lastRegen=0;S.phase="morning";
  const T=S.mode==="temporada"&&TOURS[S.day];
  S.tour=T?{day:S.day,riv:T.riv.map(([a,b])=>+(a+rnd()*(b-a)).toFixed(2))}:null;
  if(T)S.env=T.env;
  if(!envOpen(S.env))S.env="lago";
  prepEnv();
  save();
}
function prepEnv(){
  const E=ENVS[S.env];S.spot=E.start;S.stock=genStock();S.stockEnv=S.env;
  if(!E.baits.includes(S.cur)||!hasBait(S.cur))S.cur=E.baits.find(k=>hasBait(k))||E.baits[0];
}
function mkFish(sp,spot){
  const d=SPECIES[sp];let w=d.avg*Math.exp(gauss()*.38);
  if(spot&&spot.big)w*=1.25;
  w=clamp(w,d.min,d.max);
  return{sp,w:+w.toFixed(3),d:.3+rnd()*.62,sx:rnd(),vx:(rnd()<.5?-1:1)*(.015+rnd()*.04)};
}
function genStock(){
  return SP().map(sp=>{const a=[];for(const k in sp.hab){const n=Math.floor(sp.hab[k]*(.5+rnd()*.9)+rnd());for(let i=0;i<n;i++)a.push(mkFish(k,sp))}
    return a.sort(()=>rnd()-.5).slice(0,9)});
}
function regen(){
  while(S.t-S.lastRegen>=90){
    S.lastRegen+=90;
    SP().forEach((sp,i)=>{
      if(rnd()<.55&&S.stock[i].length<9){
        const ks=Object.keys(sp.hab),tot=ks.reduce((s,k)=>s+sp.hab[k],0);let r=rnd()*tot;
        for(const k of ks){r-=sp.hab[k];if(r<=0){S.stock[i].push(mkFish(k,sp));break}}
      }
    });
  }
}

}

function smoothPath(pts,W,H){
  const p=new Path2D(),n=pts.length,P=i=>pts[(i+n)%n],mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];

const boat={x:.5,y:.5,ang:-Math.PI/2,moving:false};
let act=null,anim=null,castInfo=null,biteTimer=null,lastMoveFrom=null;
function busy(){return act!==null}
function syncBoat(){if(!act){boat.x=SP()[S.spot].x;boat.y=SP()[S.spot].y}}
function runTimed(min,ms,onStep,onDone){anim={t0:performance.now(),ms,from:S.t,to:S.t+min,onStep,onDone}}
function stepAnim(now){
  if(!anim)return;
  const k=clamp((now-anim.t0)/anim.ms,0,1);
  S.t=lerp(anim.from,anim.to,k);
  anim.onStep&&anim.onStep(k);
  renderHud();
  if(k>=1){const d=anim.onDone;anim=null;d&&d()}
}
function neighbor(dir){
  const c=SP()[S.spot],tr=c.r+(dir==="d"?1:dir==="u"?-1:0),tc=c.c+(dir==="r"?1:dir==="l"?-1:0);
  return SP().findIndex(s=>s.r===tr&&s.c===tc);
}
function move(dir){
  if(busy()||S.t>=DAY_MIN)return;
  const j=neighbor(dir);if(j<0)return;
  const a=SP()[S.spot],b=SP()[j];
  act="move";boat.moving=true;boat.ang=Math.atan2((b.y-a.y)*MH,(b.x-a.x)*MW);
  runTimed(MOTOR[S.motor-1].min,800,k=>{const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;boat.x=lerp(a.x,b.x,e);boat.y=lerp(a.y,b.y,e)},()=>{
    S.spot=j;boat.moving=false;act=null;toast(b.nome);afterAction();
  });
  renderFishUI();
}
document.querySelectorAll("[data-mv]").forEach(b=>b.addEventListener("click",()=>move(b.dataset.mv)));

function hasBait(k){return k==="art"?S.art:S.bait[k]>0}
function chooseBite(){
  const sp=SP()[S.spot],tb=band(S.t),bait=S.cur;
  for(const k of envSpecies(S.env)){const d=SPECIES[k],L=d.legend;
    if(L&&L.spot===S.spot&&L.bait===bait&&L.wx.includes(S.wx)&&(!L.band||L.band.includes(tb))&&rnd()<L.ch)
      return{f:{sp:k,w:+clamp(d.avg*Math.exp(gauss()*.15),d.min,d.max).toFixed(2),legend:true},wait:8+rnd()*15}}
  const list=[];let tot=0;
  for(const f of S.stock[S.spot]){
    const d=SPECIES[f.sp];let a=bf(d,bait);
    if(S.wx==="chuva")a*=bait==="art"?.6:1.1;
    let m=a*wf(d,S.wx)*tmf(d,tb);
    if(S.wx==="vento")m*=sp.abrigo?1.15:sp.aberto?.75:1;
    if(S.wx==="forte"&&tb===2&&!d.calor)m*=.7;
    if(m>0){list.push([f,m]);tot+=m}
  }
  tot*=WX[S.wx].g;
  const p=1-Math.exp(-.33*tot);
  if(rnd()>p||!list.length)return{f:null,wait:30};
  let r=rnd()*list.reduce((s,x)=>s+x[1],0);
  for(const[f,m]of list){r-=m;if(r<=0)return{f,wait:5+rnd()*25}}
  return{f:list[0][0],wait:10};
}
function cast(){
  if(act==="bite"){hook();return}
  if(busy()||S.t>=DAY_MIN)return;
  if(!hasBait(S.cur)){toast("Sem essa isca. Escolha outra ou compre na loja.");return}
  if(BAITS[S.cur].natural)S.bait[S.cur]--;
  const res=chooseBite();
  // ponto do lançamento
  let fx=boat.x,fy=boat.y;
  for(let i=0;i<20;i++){const a=rnd()*6.28,d=38+rnd()*22,x=boat.x+Math.cos(a)*d/MW,y=boat.y+Math.sin(a)*d/MH;
    if(inWater(x*MW,y*MH)){fx=x;fy=y;break}}
  castInfo={x:fx,y:fy,t0:performance.now(),res,bite:false};
  act="wait";renderFishUI();
  const ms=1100+Math.min(res.wait,30)/30*1700;
  runTimed(res.wait,ms,null,()=>{
    if(res.f){
      act="bite";castInfo.bite=true;castInfo.tb=performance.now();renderFishUI();
      if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
      biteTimer=setTimeout(()=>{if(act==="bite"){act=null;castInfo=null;toast("Escapou na fisgada… a isca foi junto.");afterAction()}},1000+ (S.rod-1)*120);
    }else{
      act=null;castInfo=null;toast("Nada mordeu. Tente outro ponto ou outra isca.");afterAction();
    }
  });
}

/* ================= briga (zona verde) ================= */
const fCv=$("#fightCv"),fctx=fCv.getContext("2d");
let F=null,holding=false;
function startFight(f){
  const d=SPECIES[f.sp],m={tipo:d.mv[0],dif:d.mv[1]};
  const size=Math.min(f.w/d.avg,2.2);
  F={f,tipo:m.tipo,dif:m.dif*(.85+.25*size),zh:ROD[S.rod-1].zona,z:.03,vz:0,fy:.15,ty:.35,tt:.6,c:.35,t:0,perfect:true,over:false,inZone:true,burst:0};
  F.base=clamp(Math.log2(f.w/.05+1)/Math.log2(9/.05+1),.08,1);F.pull=F.base*.6;F.vf=0;
  $("#fightMsg").className="";$("#fightMsg").textContent="Mantenha o peixe dentro da zona verde";
  $("#fightOv").classList.add("on");renderFishUI();
  const r=fCv.getBoundingClientRect();fCv.width=r.width*DPR;fCv.height=r.height*DPR;
}
function newTarget(){
  const d=F.dif,y=F.fy;let ty,tt;
  if(F.tipo==="suave"){ty=y+(rnd()*2-1)*.3;tt=1.4+rnd()*1.4}
  else if(F.tipo==="misto"){ty=y+(rnd()*2-1)*.5;tt=.8+rnd()*1.3}
  else if(F.tipo==="afunda"){ // afunda devagar, às vezes dá um puxão para cima
    if(rnd()<.35){ty=y+.35+rnd()*.3;tt=.45+rnd()*.4;F.burst=.35}else{ty=y-.15-rnd()*.25;tt=1+rnd()*1.2}}
  else{ // dardo: saltos grandes e rápidos
    ty=rnd()<.5?rnd()*.35:.65+rnd()*.35;if(rnd()<.3)ty=y+(rnd()*2-1)*.2;tt=.5+rnd()*.9;F.burst=.25}
  F.ty=clamp(ty,.04,.96);F.tt=tt/Math.sqrt(d);
}
function stepFight(dt){
  if(!F||F.over)return;
  F.t+=dt;
  // zona verde: segurar sobe, soltar cai
  F.vz+=(holding?2.6:-2.3)*dt;F.vz*=Math.pow(.4,dt);F.vz=clamp(F.vz,-1.2,1.2); // amortecida: menos "pulo"
  F.z+=F.vz*dt;
  if(F.z<0){F.z=0;F.vz=-F.vz*.3;if(Math.abs(F.vz)<.05)F.vz=0}
  if(F.z>1-F.zh){F.z=1-F.zh;F.vz=0}
  // peixe
  const prevY=F.fy;
  F.tt-=dt;if(F.tt<=0)newTarget();
  const sp=(1+F.dif*.95)*(F.burst>0?1.9:1);F.burst=Math.max(0,F.burst-dt);
  F.fy+=(F.ty-F.fy)*Math.min(1,sp*dt);
  F.fy+=Math.sin(F.t*9)*.0015*F.dif;
  F.fy=clamp(F.fy,.02,.98);
  // puxada: peso do peixe + quanto ele está se mexendo agora
  F.vf=(F.fy-prevY)/Math.max(dt,1e-3);
  const pt=clamp(F.base*(.55+.45*Math.min(1,Math.abs(F.vf)/1.5))+(F.burst>0?.15:0),0,1);
  F.pull+=(pt-F.pull)*Math.min(1,6*dt);
  F.vz-=F.pull*.25*dt; // peixe pesado puxa a zona para baixo
  // medidor
  const inZ=F.fy>=F.z&&F.fy<=F.z+F.zh;F.inZone=inZ;
  const grace=F.t<.8;
  if(inZ)F.c+=.28*dt;else if(!grace){F.c-=(.12+.05*F.dif)*dt;F.perfect=false}
  const m=$("#fightMsg");
  if(grace&&!inZ){m.className="";m.textContent="Segure para subir a zona!"}
  else if(F.burst>0&&!inZ){m.className="run";m.textContent="⚡ O peixe disparou!"}
  else if(!inZ){m.className="run";m.textContent="Fora da zona! Acompanhe o peixe"}
  else{m.className="";m.textContent=F.c>.85?"Quase lá!":"Isso, mantenha na zona"}
  if(F.c>=1)endFight("win");else if(F.c<=0)endFight("lost");
}
function drawFight(now){
  if(!F)return;
  const W=fCv.width/DPR,H=fCv.height/DPR,g=fctx;g.setTransform(DPR,0,0,DPR,0,0);
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#1c8f9e");bg.addColorStop(1,"#063a4c");g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle="rgba(255,255,255,.05)";for(let i=0;i<4;i++){const x=W*(.1+i*.27)+Math.sin(now/1500+i)*12;g.beginPath();g.moveTo(x,0);g.lineTo(x+40,H);g.lineTo(x+10,H);g.closePath();g.fill()}

  const tw=64,tx=W/2-49,ty=46,th=H-58;

  g.fillStyle="#0b4c5c";rr(g,tx,ty,tw,th,9);g.fill();
  // zona verde

  g.save();g.translate(shk,0);
  g.fillStyle=F.inZone?"rgba(110,230,140,.75)":"rgba(110,230,140,.4)";rr(g,tx+3,zTop,tw-6,zH,7);g.fill();
  g.strokeStyle=F.inZone?"#c8ffd6":"rgba(200,255,214,.5)";g.lineWidth=2;rr(g,tx+3,zTop,tw-6,zH,7);g.stroke();
  g.restore();
  // peixe
  const fy=Y(F.fy),fx=tx+tw/2+(F.burst>0?Math.sin(now/25)*3:0);
  // linha até o peixe
  g.strokeStyle=`hsla(${Math.round(120-120*F.pull)},90%,80%,.8)`;g.lineWidth=1+F.pull*1.8;
  g.beginPath();g.moveTo(tx+tw/2,ty);g.quadraticCurveTo(tx+tw/2+(1-F.pull)*10,(ty+fy)/2,fx,fy);g.stroke();
  const fs=.6+F.base*.95;
  g.save();g.translate(fx,fy);g.scale(fs,fs);g.rotate(Math.max(-.6,Math.min(.6,-F.vf*.25)));
  const col=F.f.legend?"#ffcf3a":"#0a1f28";
  g.fillStyle=col;g.beginPath();g.ellipse(2,0,15,8,0,0,7);g.fill();
  g.beginPath();g.moveTo(-10,0);g.lineTo(-20,-8);g.lineTo(-20,8);g.closePath();g.fill();
  g.fillStyle="#fff";g.beginPath();g.arc(9,-2,2.4,0,7);g.fill();
  g.restore();
  // medidor
  const mx=tx+tw+18,mw=16;
  g.fillStyle="rgba(4,26,36,.55)";rr(g,mx-3,ty-4,mw+6,th+8,9);g.fill();
  g.fillStyle="#0b4c5c";rr(g,mx,ty,mw,th,6);g.fill();
  const c=clamp(F.c,0,1),hue=Math.round(c*120);
  g.fillStyle=`hsl(${hue},75%,52%)`;rr(g,mx,ty+th*(1-c),mw,th*c,6);g.fill();
  // rótulos
  g.fillStyle="rgba(255,255,255,.75)";g.font="800 9.5px system-ui";
  g.save();g.translate(mx+mw+12,ty+th/2);g.rotate(-Math.PI/2);g.textAlign="center";g.fillText("CAPTURA",0,0);g.restore();
  g.textAlign="left";g.font="700 11px system-ui";
  if(F.perfect)g.fillText("✦ perfeita",mx+mw+20,ty+12);
  // escala de peso (1 a 4) no topo
  const lvl=F.base<.3?1:F.base<.58?2:F.base<.8?3:4,word=["Leve","Médio","Pesado","Muito pesado"][lvl-1];
  const cols=["#7fe3a0","#f5d33b","#f39a3b","#e5533d"];
  const pw=26,ph=10,gap=5,totW=4*pw+3*gap,px0=W/2-totW/2,py=12;
  g.font="800 10px system-ui";g.textAlign="right";g.fillStyle="rgba(255,255,255,.7)";g.fillText("PESO",px0-8,py+9);
  for(let i=0;i<4;i++){g.fillStyle=i<lvl?cols[lvl-1]:"rgba(255,255,255,.15)";rr(g,px0+i*(pw+gap),py,pw,ph,4);g.fill()}
  g.textAlign="left";g.fillStyle="#fff";g.font="800 12px system-ui";g.fillText(word,px0+totW+8,py+9.5);
  g.textAlign="left";
}
function rr(g,x,y,w,h,r){r=Math.min(r,h/2,w/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function endFight(kind){
  F.over=true;holding=false;$("#castBtn").classList.remove("down");
  const mins=Math.round(3+F.t*.8);
  setTimeout(()=>{
    $("#fightOv").classList.remove("on");
    const f=F.f,perfect=F.perfect;F=null;castInfo=null;
    S.t+=mins;
    if(kind==="win"){showCatch(f,perfect)}
    else{act=null;toast("O peixe se soltou do anzol…");afterAction()}
  },kind==="win"?150:350);
}
const hb=$("#castBtn");
const hDown=e=>{e.preventDefault();if(F&&!F.over){holding=true;hb.classList.add("down")}};
const hUp=()=>{holding=false;hb.classList.remove("down")};
window.addEventListener("pointerup",hUp);window.addEventListener("pointercancel",hUp);
hb.addEventListener("contextmenu",e=>e.preventDefault());
$("#fightOv").addEventListener("pointerdown",hDown); // segurar em qualquer ponto da briga também funciona

/* ================= captura ================= */
function fishValue(f){return Math.max(1,Math.round(f.w*SPECIES[f.sp].kg))}
function showCatch(f,perfect){
  const d=SPECIES[f.sp],a=S.album[f.sp];let v=d.release?0:fishValue(f);if(perfect)v=Math.round(v*1.25);
  const flags=[];if(perfect&&!d.release)flags.push(["Captura perfeita · +25%",""]);
  if(d.release)flags.push(["Espécie protegida · devolvido à água","or"]);
  if(!a)flags.push(["Nova espécie!","or"]);
  else if(f.w>a.best)flags.push(["Novo recorde!","gold"]);
  if(d.legend)flags.push(["Lendário","gold"]);
  S.album[f.sp]={n:(a?a.n:0)+1,best:Math.max(a?a.best:0,f.w)};
  S.money+=v;S.earned+=v;S.caught++;if(d.legend)S.legends++;
  S.today.push({sp:f.sp,w:f.w,v});
  if(!f.legend){const arr=S.stock[S.spot],i=arr.indexOf(f);if(i>=0)arr.splice(i,1)}
  save();
  $("#cName").textContent=d.nome;
  $("#cInfo").textContent=`${fmtW(f.w)} · ${d.rar}`;
  $("#cFlags").innerHTML=flags.map(([t,c])=>`<span class="flag ${c}">${t}</span>`).join("");
  $("#cVal").textContent=d.release?"Solto de volta 💙":"+ "+brl(v);
  $("#catchOv").classList.add("on");
  const c=$("#catchCv"),r=c.getBoundingClientRect();c.width=r.width*DPR;c.height=r.height*DPR;
  const g=c.getContext("2d");g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,r.width,r.height);
  drawFish(g,f.sp,r.width/2,r.height/2,Math.min(r.width*.8,60+Math.log2(f.w/.05+1)*22));
}
$("#cOk").onclick=()=>{$("#catchOv").classList.remove("on");act=null;afterAction()};

/* ================= desenho dos peixes ================= */
function drawFish(g,sp,x,y,L,mystery){
  const A=SPECIES[sp].art;
  const P=mystery?{...A,back:"#b9c7c4",body:"#b9c7c4",belly:"#c9d4d1",tail:"#b9c7c4",fin:"#b9c7c4"}:A;
  if(A.bill)L*=.78;
  g.save();g.translate(x-(A.bill?L*.12:0),y);
  if(A.glow){const gl=g.createRadialGradient(0,0,4,0,0,L*.7);gl.addColorStop(0,"rgba(255,215,90,.5)");gl.addColorStop(1,"rgba(255,215,90,0)");g.fillStyle=gl;g.beginPath();g.arc(0,0,L*.7,0,7);g.fill()}
  const hh=L*P.h/2;
  // cauda
  g.fillStyle=P.tail;g.beginPath();
  if(P.roundTail){g.ellipse(-L*.5,0,L*.12,hh*.85,0,0,7)}
  else{g.moveTo(-L*.4,0);g.lineTo(-L*.6,-hh*1.05);g.quadraticCurveTo(-L*.52,0,-L*.6,hh*1.05);g.closePath()}
  g.fill();
  // bico do marlim
  if(P.bill){g.fillStyle=P.back;g.beginPath();g.moveTo(L*.38,-hh*.25);g.lineTo(L*.85,-hh*.05);g.lineTo(L*.38,hh*.1);g.closePath();g.fill()}
  // nadadeira dorsal
  g.fillStyle=P.fin;g.beginPath();g.moveTo(-L*.25,-hh*.8);
  g.quadraticCurveTo(-L*.02,-hh*(P.tallFin?1.8:1.45),L*.18,-hh*.85);g.closePath();g.fill();
  // corpo
  const bg=g.createLinearGradient(0,-hh,0,hh);bg.addColorStop(0,P.back);bg.addColorStop(.45,P.body);bg.addColorStop(1,P.belly);
  g.fillStyle=bg;g.beginPath();g.ellipse(0,0,L*.45,hh,0,0,7);g.fill();
  if(!mystery&&A.mark){
    g.save();g.beginPath();g.ellipse(0,0,L*.45,hh,0,0,7);g.clip();
    const m=A.mark;
    if(m==="bars6"){g.fillStyle="rgba(40,55,50,.22)";for(let i=0;i<6;i++)g.fillRect(-L*.28+i*L*.1,-hh,L*.035,hh*2)}
    if(m==="tucuna"){g.fillStyle=A.glow?"rgba(120,70,0,.35)":"rgba(30,40,20,.55)";for(let i=0;i<3;i++){g.beginPath();g.ellipse(-L*.15+i*L*.15,-hh*.15,L*.035,hh*.85,0,0,7);g.fill()}}
    if(m==="spots"){g.fillStyle="rgba(25,20,12,.5)";for(let i=0;i<16;i++){g.beginPath();g.arc(-L*.35+(i*37%70)/100*L,-hh*.55+(i*53%100)/100*hh*1.1,L*.022,0,7);g.fill()}}
    if(m==="lambari"){g.fillStyle="#222";g.beginPath();g.ellipse(L*.12,-hh*.1,L*.03,hh*.25,0,0,7);g.fill();g.fillStyle="rgba(255,255,255,.5)";g.fillRect(-L*.4,-hh*.05,L*.8,hh*.15)}
    if(m==="dots3"){g.fillStyle="#1d2420";for(let i=0;i<3;i++){g.beginPath();g.arc(-L*.22+i*L*.17,0,L*.03,0,7);g.fill()}}
    if(m==="shoulder"){g.fillStyle="#1d2420";g.beginPath();g.ellipse(L*.16,-hh*.1,L*.035,hh*.3,0,0,7);g.fill()}
    if(m==="lines"){g.strokeStyle="rgba(120,60,0,.35)";g.lineWidth=1;for(let i=0;i<5;i++){g.beginPath();g.moveTo(-L*.45,-hh*.6+i*hh*.3);g.lineTo(L*.45,-hh*.6+i*hh*.3);g.stroke()}}
    if(m==="redscales"){g.fillStyle="rgba(190,50,40,.6)";for(let i=0;i<14;i++){g.beginPath();g.arc(-L*.42+(i%5)*L*.06,-hh*.6+Math.floor(i/5)*hh*.5,L*.025,0,7);g.fill()}}
    if(m==="stripes"){g.strokeStyle="rgba(40,55,70,.25)";g.lineWidth=1.4;for(let i=0;i<4;i++){g.beginPath();g.moveTo(-L*.45,-hh*.5+i*hh*.28);g.lineTo(L*.45,-hh*.5+i*hh*.28);g.stroke()}}
    if(m==="line"){g.strokeStyle="#222";g.lineWidth=Math.max(1,L*.012);g.beginPath();g.moveTo(-L*.45,-hh*.05);g.quadraticCurveTo(0,-hh*.25,L*.38,-hh*.15);g.stroke()}
    if(m==="mottle"){g.fillStyle="rgba(25,22,12,.4)";for(let i=0;i<22;i++){g.beginPath();g.ellipse(-L*.4+(i*41%80)/100*L,-hh*.7+(i*29%100)/100*hh*1.4,L*.04,L*.025,i,0,7);g.fill()}}
    if(m==="oblique"){g.strokeStyle="rgba(60,50,35,.3)";g.lineWidth=1.3;for(let i=0;i<8;i++){g.beginPath();g.moveTo(-L*.4+i*L*.1,-hh);g.lineTo(-L*.5+i*L*.1,hh*.2);g.stroke()}}
    if(m==="pale"){g.fillStyle="rgba(255,230,190,.45)";for(let i=0;i<16;i++){g.beginPath();g.arc(-L*.35+(i*37%70)/100*L,-hh*.55+(i*53%100)/100*hh*1.1,L*.02,0,7);g.fill()}}
    if(m==="lightbars"){g.fillStyle="rgba(200,225,255,.35)";for(let i=0;i<8;i++)g.fillRect(-L*.32+i*L*.08,-hh,L*.02,hh*1.2)}
    g.restore();
    if(m==="tucuna"){g.fillStyle="#f08a24";g.beginPath();g.arc(-L*.42,-hh*.1,L*.055,0,7);g.fill();g.fillStyle="#111";g.beginPath();g.arc(-L*.42,-hh*.1,L*.032,0,7);g.fill()}
    if(m==="lambari"){g.fillStyle="#d8402e";g.beginPath();g.arc(-L*.52,0,L*.03,0,7);g.fill()}
  }
  if(!mystery&&A.barbels){g.strokeStyle="#3a4144";g.lineWidth=1.2;for(const s of[-1,1]){g.beginPath();g.moveTo(L*.42,hh*.1);g.quadraticCurveTo(L*.55,hh*(.3+s*.2),L*.6,hh*(.55+s*.25));g.stroke()}}
  // nadadeira peitoral
  g.fillStyle="rgba(0,0,0,.15)";g.beginPath();g.ellipse(L*.12,hh*.35,L*.08,hh*.18,.5,0,7);g.fill();
  if(!mystery){
    g.fillStyle="#fff";g.beginPath();g.arc(L*.3,-hh*.2,L*.045,0,7);g.fill();
    g.fillStyle=A.redEye?"#c0281c":"#111";g.beginPath();g.arc(L*.31,-hh*.2,L*.025,0,7);g.fill();
    g.strokeStyle="rgba(0,0,0,.4)";g.lineWidth=1.2;g.beginPath();g.moveTo(L*.45,hh*.08);g.lineTo(L*.38,hh*.12);g.stroke();
  }else{g.fillStyle="#8a9a97";g.font=`900 ${Math.max(10,hh*1.1)}px system-ui`;g.textAlign="center";g.textBaseline="middle";g.fillText("?",0,1)}
  g.restore();
}
function fishThumb(sp,known){
  const c=document.createElement("canvas");c.width=64*DPR;c.height=34*DPR;
  const g=c.getContext("2d");g.scale(DPR,DPR);drawFish(g,sp,32,17,48,!known);return c;
}

/* ================= fim do dia ================= */
function tourResult(){
  const T=TOURS[S.tour.day];
  const mine=T.tipo==="total"?S.today.reduce((s,c)=>s+c.w,0):Math.max(0,...S.today.filter(c=>c.sp===T.sp).map(c=>c.w));
  const table=[{nome:"Você",w:mine,me:true},...RIVALS.map((n,i)=>({nome:n,w:S.tour.riv[i]}))].sort((a,b)=>b.w-a.w);
  const pos=table.findIndex(x=>x.me)+1;
  return{T,mine,table,pos};
}
function endDay(){
  act=null;anim=null;castInfo=null;
  if(S.tour&&!S.tour.done){
    const r=tourResult();S.tour.done=true;S.tour.pos=r.pos;
    if(r.pos<=3){S.money+=r.T.premio[r.pos-1];S.tourPts=(S.tourPts||0)+r.T.pts[r.pos-1]}
    S.tourLog=S.tourLog||[];S.tourLog.push({nome:r.T.nome,pos:r.pos});
  }
  S.phase="night";save();show("night");
}
function renderNight(){
  $("#nTitle").textContent=`Fim do dia ${S.day}`;
  $("#nMoney").textContent=brl(S.money);
  const tot=S.today.reduce((s,c)=>s+c.v,0);
  const by={};S.today.forEach(c=>{by[c.sp]=by[c.sp]||{n:0,w:0,v:0,best:0};by[c.sp].n++;by[c.sp].w+=c.w;by[c.sp].v+=c.v;by[c.sp].best=Math.max(by[c.sp].best,c.w)});
  const b=$("#nBody");b.innerHTML="";
  const head=document.createElement("div");head.className="card";
  head.innerHTML=`<div class="muted small">${WX[S.wx].ic} ${WX[S.wx].nome}</div><h2>${S.today.length?`${S.today.length} peixe${S.today.length>1?"s":""} hoje`:"Dia sem peixe"}</h2>
    <div class="sumline"><span>Vendido no mercado</span><span>${brl(tot)}</span></div>
    <div class="sumline muted"><span>Saldo</span><span>${brl(S.money)}</span></div>`;
  b.appendChild(head);
  if(S.tour){
    const r=tourResult(),medal=["🥇","🥈","🥉","4º"];
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<div class="muted small">🏆 ${r.T.nome} · ${r.T.tipo==="total"?"peso total":"maior "+SPECIES[r.T.sp].nome.toLowerCase()}</div>
      <h2>${r.pos<=3?`${medal[r.pos-1]} ${r.pos}º lugar!`:"Fora do pódio"}</h2>
      ${r.table.map((x,i)=>`<div class="sumline" style="${x.me?"color:var(--orange)":""}"><span>${medal[i]} ${x.nome}</span><span>${x.w?fmtW(x.w):"—"}</span></div>`).join("")}
      ${r.pos<=3?`<div class="sumline muted small"><span>Prêmio</span><span>${brl(r.T.premio[r.pos-1])} · +${r.T.pts[r.pos-1]} pts</span></div>`:""}`;
    b.appendChild(c);
  }
  if(S.today.length){
    const s=document.createElement("div");s.className="sect";s.textContent="Capturas";b.appendChild(s);
    for(const k of Object.keys(by)){const r=document.createElement("div");r.className="row";r.appendChild(fishThumb(k,true));
      r.insertAdjacentHTML("beforeend",`<div class="tx"><b>${SPECIES[k].nome} × ${by[k].n}</b><small>Maior: ${fmtW(by[k].best)}</small></div><b>${brl(by[k].v)}</b>`);b.appendChild(r)}
  }
  const last=S.mode==="temporada"&&S.day>=SEASON_DAYS;
  const left=SEASON_DAYS-S.day;
  b.insertAdjacentHTML("beforeend",`<div class="muted small" style="text-align:center;margin-top:10px">${S.mode==="semfim"?"Modo Sem fim":last?"Último dia da temporada!":`Faltam ${left} dia${left>1?"s":""} na temporada`}</div>`);
  $("#btnNext").textContent=last?"Ver resultado":"Próximo dia";
}
$("#btnNext").onclick=()=>{
  if(S.mode==="temporada"&&S.day>=SEASON_DAYS){S.phase="season";save();show("season");renderSeason();return}
  startDay();show("morning");
};

/* ================= loja ================= */
function renderShop(){
  $("#sMoney").textContent=brl(S.money);
  const b=$("#sBody");
  const row=(ic,title,sub,price,id,dis,lbl)=>`<div class="row"><div class="ic">${ic}</div><div class="tx"><b>${title}</b><small>${sub}</small></div><button class="btn sm ${dis?"":"or"}" data-buy="${id}" ${dis?"disabled":""}>${lbl||brl(price)}</button></div>`;
  let h=`<div class="sect">Iscas</div>`;
  const uses=k=>ENV_ORDER.filter(e=>ENVS[e].baits.includes(k)).map(e=>ENVS[e].nome).join(", ");
  for(const k of["minhoca","massa","vivo","camarao","sardinha"]){const x=BAITS[k];h+=row(x.ic,`${x.nome} (${x.pack} un.)`,`Você tem ${S.bait[k]} · ${uses(k)}`,x.preco,"b_"+k,S.money<x.preco)}
  h+=row(BAITS.art.ic,"Isca artificial",S.art?"Já é sua — não acaba":"Permanente. Ótima para predadores",BAITS.art.preco,"art",S.art||S.money<BAITS.art.preco,S.art?"✓":null);
  h+=`<div class="sect">Equipamento</div>`;
  const up=(ic,nome,lv,arr,id,desc)=>{const max=lv>=arr.length,next=arr[lv];return row(ic,`${nome} · nível ${lv}`,max?"Nível máximo":desc(lv+1),max?0:next.preco,id,max||S.money<next.preco,max?"Máx.":null)};
  h+=up("🎣","Vara",S.rod,ROD,"rod",n=>`Nível ${n}: zona verde ${Math.round((ROD[n-1].zona/ROD[S.rod-1].zona-1)*100)}% maior`);
  h+=up("⚙️","Motor",S.motor,MOTOR,"motor",n=>`Nível ${n}: ${MOTOR[n-1].min} min para mudar de ponto (hoje ${MOTOR[S.motor-1].min})`);
  h+=up("📡","Sonar",S.sonar,SONAR,"sonar",n=>`Nível ${n}: ${SONAR[n-1].d.toLowerCase()}`);
  b.innerHTML=h;
  b.querySelectorAll("[data-buy]").forEach(btn=>btn.onclick=()=>buy(btn.dataset.buy));
}
function buy(id){
  if(id.startsWith("b_")){const k=id.slice(2),x=BAITS[k];if(S.money<x.preco)return;S.money-=x.preco;S.bait[k]+=x.pack}
  else if(id==="art"){if(S.art||S.money<BAITS.art.preco)return;S.money-=BAITS.art.preco;S.art=true}
  else{const arr={rod:ROD,motor:MOTOR,sonar:SONAR}[id],lv=S[id];if(lv>=arr.length||S.money<arr[lv].preco)return;S.money-=arr[lv].preco;S[id]++}
  save();renderShop();
}

/* ================= álbum ================= */
function renderAlbum(){
  const all=Object.keys(SPECIES),known=all.filter(k=>S.album[k]).length;
  $("#aCount").textContent=`${known}/${all.length}`;
  const b=$("#aBody");b.innerHTML=`<div class="muted small" style="padding:0 2px">A raridade indica com que frequência a espécie aparece: Comum, Incomum, Raro e Lendário.</div>`;
  for(const e of ENV_ORDER){
  const E=ENVS[e];b.insertAdjacentHTML("beforeend",`<div class="sect">${E.ic} ${E.nome}${envOpen(e)?"":` · abre no dia ${E.dia}`}</div>`);
  for(const k of envSpecies(e)){
    const d=SPECIES[k],a=S.album[k],r=document.createElement("div");r.className="row";
    r.appendChild(fishThumb(k,!!a));
    r.insertAdjacentHTML("beforeend",a?`<div class="tx"><b>${d.nome}</b><small>${d.rar} · ${a.n} capturado${a.n>1?"s":""} · recorde ${fmtW(a.best)}</small><small>${d.hint}</small></div>`
      :`<div class="tx"><b>???</b><small>${d.rar}</small><small>${envOpen(e)?d.hint:"Ambiente ainda fechado."}</small></div>`);
    b.appendChild(r);
  }}
}

/* ================= temporada ================= */
function seasonScore(){
  const sp=Object.keys(S.album).length;
  return{sp,score:Math.round(S.earned+150*sp+500*S.legends+(S.tourPts||0))};
}
function renderSeason(){
  const{sp,score}=seasonScore(),best=getBest(),isBest=!best||score>best.score;
  if(isBest&&S.mode==="temporada"&&!S.scored){setBest({score,date:Date.now()});}
  if(!S.scored){S.scored=true;save()}
  $("#seBody").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">🏆</div><h2>Temporada encerrada</h2>
    <div class="big" style="color:var(--orange)">${score.toLocaleString("pt-BR")} pts</div>
    <div class="muted small">${isBest?"Novo recorde de temporada!":`Recorde: ${best.score.toLocaleString("pt-BR")} pts`}</div></div>
    <div class="card"><div class="sumline"><span>Ganhos no mercado</span><span>${brl(S.earned)}</span></div>
    <div class="sumline"><span>Espécies no álbum (${sp} × 150)</span><span>${sp*150}</span></div>
    <div class="sumline"><span>Lendários (${S.legends} × 500)</span><span>${S.legends*500}</span></div>
    <div class="sumline"><span>Torneios</span><span>${S.tourPts||0}</span></div>
    ${(S.tourLog||[]).map(t=>`<div class="sumline small muted"><span>${t.nome}</span><span>${t.pos}º lugar</span></div>`).join("")}
    <div class="sumline muted"><span>Peixes capturados</span><span>${S.caught}</span></div></div>
    <div class="muted small" style="text-align:center">No modo Sem fim você continua com seu equipamento e dinheiro, sem limite de dias.</div>`;
}
$("#btnNewSeason").onclick=()=>{newSeason();show("morning")};
$("#btnEndless").onclick=()=>{S.mode="semfim";startDay();show("morning")};

/* ================= arte do título ================= */
function drawTitleArt(){
  const c=$("#titleCv");c.width=240*DPR;c.height=120*DPR;const g=c.getContext("2d");g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,240,120);
  g.strokeStyle="rgba(255,255,255,.8)";g.lineWidth=1.5;g.beginPath();g.moveTo(40,0);g.quadraticCurveTo(70,40,120,52);g.stroke();
  g.strokeStyle="#fff";g.lineWidth=2;g.beginPath();g.arc(121,58,6,-Math.PI/2,Math.PI*.8);g.stroke();
  drawFish(g,"tucunare",132,88,110);
}

/* ================= teclado ================= */
document.addEventListener("keydown",e=>{
  if(!$("#fish").classList.contains("on"))return;
  if(e.code==="Space"){e.preventDefault();if(F&&!F.over){holding=true;hb.classList.add("down")}else if(!$("#catchOv").classList.contains("on"))cast();else $("#cOk").click()}
  const m={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r"}[e.code];if(m){e.preventDefault();move(m)}
});
document.addEventListener("keyup",e=>{if(e.code==="Space")hUp()});

/* ================= loop ================= */
let lastT=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(S&&$("#fish").classList.contains("on")){
    stepAnim(now);
    if(F){stepFight(dt);drawFight(now)}
    drawMap(now,dt);drawSonar(now,dt);
  }
  requestAnimationFrame(loop);
}
DPR=Math.min(window.devicePixelRatio||1,2);
renderTitle();
requestAnimationFrame(loop);
</script>
