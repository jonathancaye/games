<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0a10">
<title>Arrancada 402</title>
<link rel="icon" href="../../favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: tela única — cabeçalho, conteúdo da aba, navegação inferior; corrida em tela cheia por cima. Cenas: oficina com prato giratório e pista no deserto ao pôr do sol */
:root{
  --bg:#0b0a10; --panel:#15131c; --panel2:#1e1b28; --line:#2c2838;
  --fg:#f1ecf2; --mut:#9a92a6; --teal:#2dd4bf; --orange:#ff8a3d;
  --red:#ff4d5e; --green:#3ddc84; --amber:#ffc23d; --paper:#f3efe4; --ink:#1d1d1d;
  --f-disp:'Russo One','Arial Black',Impact,sans-serif;
  --f-body:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.back{color:var(--fg);text-decoration:none;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap;background:var(--panel)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
.brand{font-family:var(--f-disp);font-size:18px;letter-spacing:.02em;flex:1;line-height:1;min-width:0;white-space:nowrap;overflow:hidden}
@media (max-width:380px){.back .tx{display:none}}
@media (max-width:420px){.brand{font-size:14px}.brand span{margin-left:4px}.cash{font-size:16px;padding:5px 8px}.top{gap:7px}}
.top>*{flex-shrink:0}.top>.brand{flex-shrink:1}
.brand span{color:var(--orange);margin-left:6px}
.cash{font-family:var(--f-mono);font-size:19px;color:var(--teal);background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.icon{width:34px;height:34px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:15px}
.icon.off{color:var(--mut);text-decoration:line-through}
#main{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding-bottom:8px;display:flex;flex-direction:column;gap:10px}
#nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:8px 10px}
#nav button{padding:10px 4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
#nav button.on{background:var(--teal);color:#06231f;border-color:var(--teal)}
#nav button.go.on{background:var(--orange);border-color:var(--orange);color:#2a1100}
h3{font-family:var(--f-disp);font-weight:400;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:4px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.hero{position:relative;overflow:hidden}
.hero canvas{display:block;width:100%;height:178px}
.hero .nm{position:absolute;left:12px;top:10px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.hero .nm b{font-family:var(--f-disp);font-weight:400;font-size:22px;display:block;line-height:1.1}
.hero .nm small{color:#c9c2d3;font-size:12px;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpis div{padding:7px 8px;min-width:0}
.kpis small,.lbl{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis b{font-family:var(--f-mono);font-size:17px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.bars{padding:10px 12px;display:grid;gap:7px}
.bar{display:grid;grid-template-columns:86px 1fr 66px;align-items:center;gap:8px;font-size:12.5px}
.bar .tr{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--orange));border-radius:99px}
.bar span:last-child{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.owned{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;display:flex;align-items:center;gap:7px}
.chip i{width:10px;height:10px;border-radius:50%}
.chip.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.row{display:flex;gap:8px;align-items:center}
.btn{padding:11px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:13.5px;letter-spacing:.03em}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#2a1100}
.btn.tl{background:var(--teal);border-color:var(--teal);color:#06231f}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.38;cursor:default}
.list{display:grid;gap:6px}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 12px}
.it b{font-size:15px}
.it .sub{grid-column:1;font-size:12px;color:var(--mut)}
.it .act{grid-row:1/3;grid-column:2}
.shop{display:grid;grid-template-columns:112px 1fr;gap:10px;padding:8px;align-items:center}
.shop canvas{width:112px;height:72px;border-radius:8px;display:block}
.shop .tx{min-width:0;display:grid;gap:3px}
.shop .tx b{font-size:15px}
.shop .tx .sub{font-size:12px;color:var(--mut);line-height:1.35}
.shop .tx .btn{justify-self:start;padding:7px 12px;margin-top:3px}
.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.pips i{width:14px;height:5px;border-radius:2px;background:var(--panel2);border:1px solid var(--line)}
.pips i.f{background:var(--teal);border-color:var(--teal)}
.it.lock{opacity:.45}
.it.cur{border-color:var(--orange)}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--mut);margin-left:6px;vertical-align:2px}
.tag.w{background:rgba(61,220,132,.15);color:var(--green)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-mono);font-size:14px}
.pill.on{background:var(--teal);color:#06231f;border-color:var(--teal)}
.pill:disabled{opacity:.35}
.note{font-size:12px;color:var(--mut);line-height:1.45}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px}
.seg button{padding:8px 6px;border-radius:999px;display:grid;gap:1px;line-height:1.15;color:var(--mut)}
.seg button b{font-size:14px;color:var(--fg)}
.seg button small{font-size:11px}
.seg button.on{background:var(--teal);color:#06231f}
.seg button.on b{color:#06231f}
.intro{margin:0 2px}
.mode-card{padding:12px;display:grid;gap:11px}
.mode-card .lbl{margin-bottom:5px}
.mycar{display:flex;align-items:baseline;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.mycar .lbl{margin:0}
.mycar b{flex:1;font-size:15px}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--panel2);border-radius:10px;padding:9px 11px}
.odds b{font-family:var(--f-mono);font-size:18px;font-weight:400}
.odds div:only-child{grid-column:1/-1}.odds div:only-child b{font-family:var(--f-body);font-size:14px;font-weight:600}
.pos{color:var(--green)}.neg{color:var(--red)}.mid{color:var(--amber)}
.btn.big{padding:14px;font-size:15px}
.mode-card .note{margin:0}
.next{border-color:var(--orange)}
.vs{display:flex;gap:10px;align-items:flex-start}
.vs>div:first-child{flex:1;min-width:0;display:grid;gap:2px}
.nm{font-family:var(--f-disp);font-weight:400;font-size:20px;line-height:1.1}
.vs .sub{font-size:12px;color:var(--mut)}
.prize{text-align:right}.prize b{font-family:var(--f-mono);font-size:20px;font-weight:400}
.cmp{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;background:var(--panel2);border-radius:10px;padding:9px 11px}
.cmp b{font-size:15px;font-weight:600}.cmp b.mono{font-size:17px;font-weight:400}
.rung .ico{width:40px;text-align:center;color:var(--mut);font-size:14px}
.rung.cur .ico{color:var(--orange)}
.champ{border-color:var(--green)}

#race{position:fixed;inset:0;background:#120c18;z-index:20;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.rhud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.lane{font-family:var(--f-mono);font-size:18px;line-height:1.05;font-variant-numeric:tabular-nums}
.lane b{display:block;font-family:var(--f-body);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#d8cfe0;font-weight:600}
.lane.r{text-align:right}
.lane.r span{color:var(--teal)}
.lane.l span{color:var(--orange)}
.prog{position:relative;height:6px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:12px}
.prog::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:rgba(255,255,255,.4)}
.prog i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;margin-left:-7px;border:2px solid #120c18}
#pY{background:var(--teal)} #pR{background:var(--orange)}
#quit{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);color:#d8cfe0;font-size:15px}
#shift{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);height:84px;border-radius:18px;font-family:var(--f-disp);font-size:28px;letter-spacing:.06em;background:var(--panel2);color:var(--mut);border:2px solid var(--line);max-width:520px;margin:0 auto;touch-action:manipulation}
#shift.arm{background:#3a1d0a;border-color:var(--orange);color:var(--orange)}
#shift.go{background:var(--green);border-color:var(--green);color:#03240f}
#shift.sh{background:var(--teal);border-color:var(--teal);color:#06231f}
#shift.hot{background:var(--orange);border-color:var(--orange);color:#2a1100}
#shift:active{transform:scale(.985)}

#slip{position:fixed;inset:0;z-index:30;background:rgba(10,6,14,.8);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.paper{background:var(--paper);color:var(--ink);font-family:var(--f-mono);width:100%;max-width:360px;padding:16px 16px 14px;border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:100%;overflow:auto;-webkit-mask:radial-gradient(circle 5px at 50% 0,transparent 98%,#000) top/14px 100% repeat-x}
.paper h2{font-family:var(--f-disp);font-weight:400;font-size:20px;text-align:center;margin:4px 0 2px;letter-spacing:.04em}
.paper .c{text-align:center;font-size:12px;opacity:.7}
.paper table{color:inherit;font:inherit;width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;font-variant-numeric:tabular-nums}
.paper th,.paper td{padding:3px 2px;text-align:right}
.paper th:first-child,.paper td:first-child{text-align:left}
.paper thead th{border-bottom:1px dashed #555;font-weight:400;font-size:12px}
.paper tr.et td{font-size:17px;border-top:1px dashed #555;padding-top:6px}
.paper td.w{font-weight:700}
.verdict{text-align:center;font-family:var(--f-disp);font-size:24px;margin:8px 0 2px}
.verdict.win{color:#0f7a4a}.verdict.lose{color:#b3203a}
.shs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0}
.shs span{font-size:11px;padding:2px 6px;border:1px solid #777;border-radius:3px}
.shs .p{background:#1d1d1d;color:var(--paper)}
.paper .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.paper .btn{font-family:var(--f-body);background:#e2ddcf;border-color:#bfb8a6;color:var(--ink)}
.paper .btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a href="../../" class="back" aria-label="Voltar para a lista de jogos">←<span class="tx"> Jogos</span></a>
    <div class="brand">ARRANCADA<span>402</span></div>
    <div class="cash" id="cash">$0</div>
    <button class="icon" id="mute" aria-label="Som">♪</button>
  </header>
  <main id="main"></main>
  <nav id="nav">
    <button data-t="garagem">Garagem</button>
    <button data-t="oficina">Oficina</button>
    <button data-t="loja">Loja</button>
    <button data-t="pista" class="go">Pista</button>
  </nav>
</div>

<div id="race" hidden>
  <canvas id="cv"></canvas>
  <div class="rhud">
    <div class="lane l"><b id="hRivN">Rival</b><span id="hRivT">0.000</span></div>
    <div class="prog"><i id="pR" style="left:0"></i><i id="pY" style="left:0"></i></div>
    <div class="lane r"><b>Você</b><span id="hYouT">0.000</span></div>
  </div>
  <button id="quit" aria-label="Abandonar">✕</button>
  <button id="shift">AGUARDE</button>
</div>
<div id="slip" hidden></div>

<script>
// PHYS-START
const CARS=[
 {id:'pardal', name:'Pardal 1.6', cls:'Hatch',              price:3000,   hp:115, kg:1080, gears:5, vmax:190, red:6800, col:[48,92,55],  cda:.68},
 {id:'gaivota',name:'Gaivota GTi',cls:'Compacto esportivo', price:12000,  hp:195, kg:1220, gears:6, vmax:230, red:7200, col:[205,80,52], cda:.64},
 {id:'trovao', name:'Trovão V8',  cls:'Muscle car',         price:30000,  hp:390, kg:1650, gears:6, vmax:265, red:6500, col:[355,78,46], cda:.72},
 {id:'kami',   name:'Kami RZ',    cls:'Turbo japonês',      price:48000,  hp:340, kg:1300, gears:6, vmax:275, red:8000, col:[0,0,90],    cda:.62},
 {id:'falco',  name:'Falco S',    cls:'Superesportivo',     price:95000,  hp:570, kg:1480, gears:7, vmax:320, red:8500, col:[24,96,55],  cda:.6},
 {id:'vulcao', name:'Vulcão X',   cls:'Hipercarro',         price:210000, hp:960, kg:1560, gears:7, vmax:380, red:9000, col:[272,62,52], cda:.58},
];
const CAR=Object.fromEntries(CARS.map(c=>[c.id,c]));
const NCH=[0,1,1,2,2,3];
const UPG=[
 {k:'motor', n:'Motor',          e:L=>`+${L*7}% potência`},
 {k:'turbo', n:'Turbo',          e:L=>L?`+${L*5}% em alta rotação`:'aspirado'},
 {k:'cambio',n:'Câmbio',         e:L=>`troca em ${Math.round((0.5-0.07*L)*1000)} ms`},
 {k:'pneus', n:'Pneus',          e:L=>`aderência ${(1+0.1*L).toFixed(1)} g`},
 {k:'peso',  n:'Alívio de peso', e:L=>L?`−${(L*3.5).toFixed(1)}% de peso`:'peso de fábrica'},
 {k:'nitro', n:'Nitro',          e:L=>L?`${NCH[L]} carga${NCH[L]>1?'s':''} · +${Math.round((0.12+0.04*L)*100)}%`:'sem kit'},
];
const MARKS=[20,100,200,300,402]; // parciais em metros
const FIN=402;
function tq(x){return 0.62+0.38*Math.sin(Math.min(x,1)*Math.PI*0.85)}
let CN=0;for(let x=0.01;x<=1.0001;x+=0.01)CN=Math.max(CN,tq(x)*x);
function sm(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)}
function lvAll(l){return {motor:l,turbo:l,cambio:l,pneus:l,peso:l,nitro:l}}
function spec(m,lv){
  const L=k=>lv[k]||0, n=m.gears, a=Math.pow(0.30,1/(n-1)), vt=m.vmax/3.6*(1+0.025*L('motor')+0.02*L('turbo')), tops=[];
  for(let i=0;i<n;i++)tops.push(vt*Math.pow(a,n-1-i));
  return {Pw:m.hp*745.7*(1+0.07*L('motor')), mass:m.kg*(1-0.035*L('peso'))+80, mu:1+0.1*L('pneus'),
    shiftT:0.5-0.07*L('cambio'), turbo:0.05*L('turbo'), nitroCh:NCH[L('nitro')], nitroB:0.12+0.04*L('nitro'),
    tops, n, cda:m.cda, red:m.red, hp:Math.round(m.hp*(1+0.07*L('motor')))};
}
function racer(sp){return {sp,z:0,v:0,g:0,shT:0,launched:false,perfT:0,nitroT:0,ch:sp.nitroCh,t:0,fin:null,splits:[],x:0.3,top:0,spin:false,shifts:[],limT:0,flame:0,react:0,lp:false}}
function launch(r,react){r.launched=true;r.react=react;r.lp=react<0.1;if(r.lp)r.perfT=0.8}
function shift(r){
  if(!r.launched||r.fin!=null||r.shT>0||r.g>=r.sp.n-1)return null;
  const x=r.v/r.sp.tops[r.g];let q;
  if(x>=0.975||r.limT>0.15)q='tarde';else if(x>=0.9)q='perfeita';else if(x>=0.82)q='boa';else q='cedo';
  r.shT=r.sp.shiftT;r.limT=0;r.flame=Math.max(r.flame,0.3);
  let n=false;
  if(q==='perfeita'){r.perfT=0.7;if(r.ch>0){r.ch--;r.nitroT=1.5;r.flame=1.5;n=true}}
  r.shifts.push(q);return {q,n};
}
function step(r,dt){
  if(!r.launched)return;
  const s=r.sp;
  if(r.fin!=null){r.v=Math.max(0,r.v-9*dt);r.z+=r.v*dt;r.x=Math.max(0.18,r.x-dt*0.8);r.flame=Math.max(0,r.flame-dt);r.spin=false;return}
  let F=0;
  if(r.shT>0){
    r.shT-=dt;const k=1-Math.max(0,r.shT)/s.shiftT;
    r.x=(r.v/s.tops[r.g])*(1-k)+(r.v/s.tops[r.g+1])*k;
    if(r.shT<=0){r.shT=0;r.g++}
    r.spin=false;
  }else{
    const top=s.tops[r.g];let x=r.v/top;const xe=Math.max(x,r.g===0?0.34:0.12);
    if(x>=1){F=0;r.limT+=dt;x=1}
    else{F=s.Pw*tq(xe)*(1+s.turbo*sm(0.35,0.75,xe))/(top*CN);if(r.perfT>0)F*=1.06;if(r.nitroT>0)F*=1+s.nitroB}
    r.x=x;
    const cap=s.mu*s.mass*9.81*(r.lp&&r.t<1.2?1.05:1);
    r.spin=F>cap*0.97&&r.v<30;if(F>cap)F=cap;
  }
  r.perfT=Math.max(0,r.perfT-dt);r.nitroT=Math.max(0,r.nitroT-dt);r.flame=Math.max(0,r.flame-dt);
  const drag=0.6*s.cda*r.v*r.v+(r.v>0.1?0.013*s.mass*9.81:0);
  r.v=Math.max(0,r.v+(F-drag)/s.mass*dt);
  r.z+=r.v*dt;r.t+=dt;r.top=Math.max(r.top,r.v);
  while(r.splits.length<MARKS.length&&r.z>=MARKS[r.splits.length])r.splits.push({t:r.t,v:r.v});
  if(r.z>=FIN)r.fin=r.t;
}
function estimate(sp){

}

/* ---------- oficina (prato giratório) ---------- */
let gRaf=0,gSize='';
function startGarage(){if(!gRaf)gRaf=requestAnimationFrame(garageLoop)}
function garageLoop(t){
  const cv=$('#pv');if(!cv||!$('#race').hidden){gRaf=0;return}
  const dpr=Math.min(2,devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  drawGarage(c,W,H,rm?2.4:t/1000*.35+2.2);
  gRaf=rm?0:requestAnimationFrame(garageLoop);
}
function drawGarage(c,W,H,yaw){
  const F=Math.min(H*1.95,W*0.9),P=mkProj(W,H,0,-7.4,2.2,F,H*0.24);P.light=[.25,.9,-.35];P.amb=.45;P.shadow=[0,0];P.shadowCol='rgba(0,0,0,.5)';
  c.fillStyle='#0d0e13';c.fillRect(0,0,W,H);
  // parede do fundo com chapa canelada
  poly(c,P,[[-12,0,7],[12,0,7],[12,6,7],[-12,6,7]],'#1f2430');
  c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=1;
  for(let x=-12;x<=12;x+=.4){const a=P(x,0,7),b=P(x,6,7);if(a&&b){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()}}
  poly(c,P,[[-12,0,7],[12,0,7],[12,.9,7],[-12,.9,7]],'#2a2f3a');
  // portas laterais
  poly(c,P,[[-7,0,-6],[-7,0,7],[-7,6,7],[-7,6,-6]],'#161a22');poly(c,P,[[7,0,-6],[7,0,7],[7,6,7],[7,6,-6]],'#161a22');
  // piso epóxi com juntas
  poly(c,P,[[-7,0,-6],[7,0,-6],[7,0,7],[-7,0,7]],'#2b2d33');
  c.strokeStyle='rgba(0,0,0,.28)';
  for(let z=-6;z<=7;z+=1.6){const a=P(-7,0,z),b=P(7,0,z);if(a&&b){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()}}
  for(let x=-7;x<=7;x+=1.6){const a=P(x,0,-3.5),b=P(x,0,7);if(a&&b){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()}}
  // faixas amarelas da vaga
  for(const x of[-3.4,3.4])poly(c,P,[[x-.08,.002,-3.5],[x+.08,.002,-3.5],[x+.08,.002,6.9],[x-.08,.002,6.9]],'#c9a227');
  // painel de ferramentas
  poly(c,P,[[-6.2,1.3,6.98],[-3.6,1.3,6.98],[-3.6,2.9,6.98],[-6.2,2.9,6.98]],'#2f3442');
  c.strokeStyle='#8a92a3';c.lineWidth=2;
  for(let i=0;i<7;i++){const x=-5.95+i*.36,a=P(x,1.55,6.96),b=P(x,2.3+(i%3)*.15,6.96);if(a&&b){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();c.beginPath();c.arc(b[0],b[1],2.2,0,7);c.stroke()}}
  // bancada e gaveteiro
  poly(c,P,[[3.6,0,6.9],[6.4,0,6.9],[6.4,1,6.9],[3.6,1,6.9]],'#3a2c24');poly(c,P,[[3.5,1,6.2],[6.5,1,6.2],[6.5,1,6.95],[3.5,1,6.95]],'#6b5141');poly(c,P,[[3.5,.9,6.2],[6.5,.9,6.2],[6.5,1,6.2],[3.5,1,6.2]],'#4f3c30');
  poly(c,P,[[2.4,0,6.3],[3.2,0,6.3],[3.2,1.25,6.3],[2.4,1.25,6.3]],'#b3262e');
  for(let i=1;i<5;i++)poly(c,P,[[2.45,i*.25,6.29],[3.15,i*.25,6.29],[3.15,i*.25+.02,6.29],[2.45,i*.25+.02,6.29]],'#5c1217');
  // pilha de pneus
  for(let i=0;i<4;i++){const p=P(-5.6,.13+i*.26,5.7);if(p){c.fillStyle=i%2?'#111':'#171717';c.beginPath();c.ellipse(p[0],p[1],.42*p[2],.16*p[2],0,0,7);c.fill();c.fillStyle='#050505';c.beginPath();c.ellipse(p[0],p[1]-p[2]*.03,.2*p[2],.07*p[2],0,0,7);c.fill()}}
  // letreiro neon
  const ns=P(3.2,2.6,6.95);if(ns){c.save();c.font=`${ns[2]*.62}px 'Russo One',Impact,sans-serif`;c.textAlign='center';c.shadowColor='#ff8a3d';c.shadowBlur=14;c.fillStyle='#ffb37a';c.fillText('OFICINA 402',ns[0],ns[1]);c.restore()}
  // luminárias
  for(const z of[1.5,4.5]){const a=P(-1.6,4.3,z),b=P(1.6,4.3,z);if(a&&b){c.fillStyle='#eaf6ff';c.fillRect(a[0],a[1]-2,b[0]-a[0],4)}}
  const lg=c.createRadialGradient(W/2,H*.82,0,W/2,H*.82,W*.55);lg.addColorStop(0,'rgba(220,240,255,.16)');lg.addColorStop(1,'rgba(220,240,255,0)');c.fillStyle=lg;c.fillRect(0,0,W,H);
  // prato giratório
  const ring=[];for(let i=0;i<40;i++){const a=i/40*Math.PI*2;ring.push([Math.cos(a)*3.1,.012,Math.sin(a)*3.1])}
  poly(c,P,ring,'#1b1d23');
  c.strokeStyle='rgba(45,212,191,.75)';c.lineWidth=2;c.beginPath();ring.forEach((p,i)=>{const q=P(...p);if(q)i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])});c.closePath();c.stroke();
  c.strokeStyle='rgba(255,255,255,.06)';c.lineWidth=1;
  for(let k=0;k<8;k++){const a=k/8*Math.PI*2+yaw,p=P(Math.cos(a)*3,.013,Math.sin(a)*3),q=P(0,.013,0);if(p&&q){c.beginPath();c.moveTo(q[0],q[1]);c.lineTo(p[0],p[1]);c.stroke()}}
  const m=CAR[cur().m];
  drawCar(c,P,m.id,0,0,yaw,m.col,{});
}
function drawThumb(cv,id){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a2235');g.addColorStop(.55,'#1b1724');g.addColorStop(1,'#120f18');c.fillStyle=g;c.fillRect(0,0,W,H);
  const P=mkProj(W,H,0,-6.6,1.9,H*1.62,H*.3);P.light=[-.5,.8,-.4];P.amb=.5;P.shadow=[0,0];P.shadowCol='rgba(0,0,0,.45)';
  const p=P(0,0,0);if(p){const r=c.createRadialGradient(p[0],p[1],0,p[0],p[1],W*.5);r.addColorStop(0,'rgba(255,138,61,.22)');r.addColorStop(1,'rgba(255,138,61,0)');c.fillStyle=r;c.fillRect(0,0,W,H)}
  drawCar(c,P,id,0,0,Math.PI+0.72,CAR[id].col,{});
}

$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;sellArm=false;render()});
$('#mute').addEventListener('click',()=>{S.mute=!S.mute;save();render()});
$('#main').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='sel'){S.active=+b.dataset.i;sellArm=false}
  else if(a==='goTrack'){tab='pista'}
  else if(a==='sell'){if(!sellArm){sellArm=true}else{S.cash+=sellVal(cur());S.owned.splice(S.active,1);S.active=0;sellArm=false}}
  else if(a==='up'){const o=cur(),m=CAR[o.m],L=o.lv[b.dataset.k],c=upgCost(m,L);if(L<5&&S.cash>=c){S.cash-=c;o.spent+=c;o.lv[b.dataset.k]=L+1}}
  else if(a==='buy'){const m=CAR[b.dataset.id];if(S.cash>=m.price&&!S.owned.some(o=>o.m===m.id)){S.cash-=m.price;S.owned.push({m:m.id,lv:lvAll(0),spent:0,best:null,km:0});S.active=S.owned.length-1;tab='garagem'}}
  else if(a==='bet'){S.bet=+b.dataset.b}
  else if(a==='mode'){S.mode=b.dataset.m}
  else if(a==='racha'){startRacha();return}
  else if(a==='rival'){startRival(+b.dataset.i);return}
  save();render();
});

/* ---------- som ---------- */
let AC=null,eng=null;
function audioInit(){
  if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();
    const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
    o1.type='sawtooth';o2.type='square';f.type='lowpass';f.Q.value=4;g.gain.value=0;
    o1.connect(f);o2.connect(f);f.connect(g);g.connect(AC.destination);o1.start();o2.start();eng={o1,o2,f,g};
  }catch(e){AC=null}
}
function engSet(x,on,red){
  if(!eng)return;const t=AC.currentTime,fr=(red/60/2)*(0.12+x*0.88);
  eng.o1.frequency.setTargetAtTime(fr,t,0.015);eng.o2.frequency.setTargetAtTime(fr*0.5,t,0.015);
  eng.f.frequency.setTargetAtTime(300+x*1800,t,0.04);eng.g.gain.setTargetAtTime(on&&!S.mute?0.035+x*0.05:0,t,0.04);
}
function beep(fq,d=0.12){if(!AC||S.mute)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=fq;o.type='square';g.gain.value=0.05;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.setTargetAtTime(0,t+d*0.6,0.02);o.start(t);o.stop(t+d+0.1)}

/* ---------- corrida ---------- */
const NAMES=['Pedrinho Ronco','Gabi Escape','Tuca Giro','Nando Pistão','Mari Embreagem','Juca Corte','Cris Rodão','Léo Blow-off'];
let R=null,raf=0;
const cv=$('#cv'),cx=cv.getContext('2d');
let W=0,H=0,DPR=1,sky=null;
function size(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);sky=null}
function startRival(i){const r=RIVALS[i];startRace({name:r.n,m:r.m,lv:lvAll(r.l),sk:r.sk,col:r.col,mode:'rival',idx:i,prize:i<S.rival?r.p*0.3:r.p})}
function startRacha(){
  const o=cur(),lv={};for(const u of UPG)lv[u.k]=Math.max(0,Math.min(5,o.lv[u.k]+Math.floor(Math.random()*3)-1));
  const bet=Math.min(S.bet,S.cash);S.cash-=bet;save();
  startRace({name:NAMES[Math.random()*NAMES.length|0],m:o.m,lv,sk:0.5+Math.random()*0.38,col:[Math.random()*360|0,60+Math.random()*30|0,40+Math.random()*20|0],mode:'racha',bet});
}
function startRace(opp){
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  const o=cur();
  const me=racer(spec(CAR[o.m],o.lv)),ai=racer(spec(CAR[opp.m],opp.lv));
  const sk=opp.sk;ai.ai={react:0.13+(1-sk)*0.32+Math.random()*0.06,sx:aiTarget(sk),sk};
  R={me,ai,opp,car:CAR[o.m],ocar:CAR[opp.m],phase:'stage',clock:0,green:null,foul:false,msgs:[],smoke:[],done:0,shake:0};
  $('#hRivN').textContent=opp.name;$('#race').hidden=false;$('#slip').hidden=true;size();
  setBtn('AGUARDE','');
  cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop);
}
function aiTarget(sk){return Math.min(0.99,0.955-(1-sk)*0.16+(Math.random()-0.5)*0.07*(1.2-sk))}

  if(ph==='go'&&!R.me.launched){launch(R.me,R.clock-R.green);msg(R.me.lp?'LARGADA PERFEITA':'REAÇÃO '+R.me.react.toFixed(3),R.me.lp?'#3ddc84':'#ffffff',1);return}

let last=0;
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();if(R)raf=requestAnimationFrame(loop)}
const TREE=[0.9,1.4,1.9];
function update(dt){
  const r=R;r.clock+=dt;
  if(r.phase==='stage'&&r.clock>=0.9){r.phase='tree';r.greenAt=2.4+Math.random()*0.35;setBtn('LARGAR','arm')}
  if(r.phase==='tree'){
    for(let i=0;i<3;i++){if(!r['b'+i]&&r.clock>=TREE[i]){r['b'+i]=1;beep(660,0.1)}}
    if(r.clock>=r.greenAt){r.phase='go';r.green=r.clock;beep(1320,0.25);setBtn('LARGAR!','go')}
  }
  const sub=Math.ceil(dt*240),h=dt/sub;
  for(let i=0;i<sub;i++){
    if(r.phase==='go'||r.phase==='end'&&!r.foul){
      const a=r.ai;
      if(!a.launched&&r.clock-r.green>=a.ai.react)launch(a,a.ai.react);
      if(a.launched&&a.fin==null&&a.shT<=0&&a.g<a.sp.n-1&&a.v/a.sp.tops[a.g]>=a.ai.sx){shift(a);a.ai.sx=aiTarget(a.ai.sk)}
      step(a,h);step(r.me,h);
    }
  }
  const me=r.me;
  if(me.launched&&me.fin==null&&!r.foul){
    if(me.g>=me.sp.n-1)setBtn('ÚLTIMA','');
    else if(me.shT>0)setBtn('TROCANDO','');
    else{const x=me.v/me.sp.tops[me.g];setBtn('TROCAR ▲',x>=0.9?'hot':'sh')}
  }else if(me.fin!=null)setBtn('CHEGADA','');
  if(r.phase==='go'&&me.fin!=null&&r.ai.fin!=null){r.phase='end';r.done=1.4}
  if(r.phase==='go'&&me.launched&&r.clock-r.green>45){r.phase='end';r.done=0.5}
  if(r.phase==='end'){r.done-=dt;if(r.done<=0&&!r.shown){r.shown=1;showSlip()}}
  for(const c of[me,r.ai]){if(c.launched&&(c.spin||(c.t<0.5&&c.v<12))&&Math.random()<0.9){const L=geo(c===me?r.car.id:r.ocar.id).len;for(const sd of[-.8,.8])r.smoke.push({x:(c===me?1.9:-1.9)+sd+(Math.random()-.5)*.3,y:.2,z:c.z-L+.9,vx:(Math.random()-.5)*1.2,vy:.6+Math.random()*.6,r:.4,l:1.2,a:.5})}}
  for(const p of r.smoke){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*1.6;p.l-=dt;p.a=Math.max(0,p.l/1.2*.5)}
  r.smoke=r.smoke.filter(p=>p.l>0).slice(-140);
  for(const m of r.msgs)m.a+=dt;r.msgs=r.msgs.filter(m=>m.a<m.d);
  r.shake=Math.max(0,r.shake-dt);
  const x=me.launched?me.x:(r.phase==='stage'?0.2:0.32+0.18*(0.5+0.5*Math.sin(r.clock*9)));
  engSet(x,true,me.sp.red);
  const tm=c=>c.fin!=null?c.fin.toFixed(3):c.launched?c.t.toFixed(3):'0.000';
  $('#hYouT').textContent=r.foul?'FOUL':tm(me);$('#hRivT').textContent=tm(r.ai);
  $('#pY').style.left=Math.min(100,me.z/FIN*100)+'%';$('#pR').style.left=Math.min(100,r.ai.z/FIN*100)+'%';
}

function makeSky(hy){

  g.fillStyle='#ffe2a6';g.beginPath();g.arc(sx,sy,sr,0,7);g.fill();
  g.fillStyle='rgba(212,88,74,.5)';for(let i=0;i<4;i++)g.fillRect(sx-sr,sy-sr*.2+i*sr*.28,sr*2,sr*.07);
  // montanhas em duas camadas
  const mt=(base,amp,col,seed)=>{const r=seeded(seed);g.fillStyle=col;g.beginPath();g.moveTo(0,hy+2);let y=base;for(let x=0;x<=W+20;x+=W/24){y=base-amp*(.3+r()*.7)*(x%(W/6)<W/12?1:.6);g.lineTo(x,y)}g.lineTo(W,hy+2);g.closePath();g.fill()};
  mt(hy-4,H*.07,'#6a3456',5);mt(hy+1,H*.04,'#3e2140',9);

function cactus(c,P,k){

  c.fillStyle='rgba(20,10,22,.78)';c.beginPath();c.roundRect(x0-38*s,y0-14*s,76*s,176*s,10*s);c.fill();
  const L=[[st.stage,'#fff7c0'],[st.amb[0],'#ffb020'],[st.amb[1],'#ffb020'],[st.amb[2],'#ffb020'],[st.green,'#3ddc84'],[st.red,'#ff3344']];
  L.forEach(([on,cl],i)=>{for(const sd of[-1,1]){const x=x0+sd*16*s,y=y0+6*s+i*26*s;c.fillStyle=on?cl:'#2a2230';c.beginPath();c.arc(x,y,9*s,0,7);c.fill();if(on){c.globalAlpha=.3;c.beginPath();c.arc(x,y,15*s,0,7);c.fill();c.globalAlpha=1}}});
}
const env={b:0};
(function(){const d=document.createElement('div');d.style.cssText='position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);visibility:hidden';document.body.appendChild(d);const u=()=>env.b=d.offsetHeight;u();addEventListener('resize',u)})();
function drawTach(c,r){
  const me=r.me,s=Math.min(W,520)/420,cxp=W/2,cyp=H-(env.b+16+84+70*s),rad=62*s;
  const x=me.launched?me.x:(r.phase==='stage'?0.2:0.32+0.18*(0.5+0.5*Math.sin(r.clock*9)));
  const a0=Math.PI*0.8,a1=Math.PI*2.2,ang=v=>a0+(a1-a0)*Math.min(1.02,v);
  c.fillStyle='rgba(20,10,22,.8)';c.beginPath();c.arc(cxp,cyp,rad+16*s,0,7);c.fill();
  c.lineWidth=8*s;c.lineCap='butt';
  c.strokeStyle='#3a2f45';c.beginPath();c.arc(cxp,cyp,rad,a0,a1);c.stroke();
  c.strokeStyle='#ffc23d';c.beginPath();c.arc(cxp,cyp,rad,ang(.82),ang(.9));c.stroke();
  c.strokeStyle='#3ddc84';c.beginPath();c.arc(cxp,cyp,rad,ang(.9),ang(.975));c.stroke();
  c.strokeStyle='#ff4d5e';c.beginPath();c.arc(cxp,cyp,rad,ang(.975),a1);c.stroke();
  const red=me.sp.red;c.fillStyle='#b5a9c2';c.textAlign='center';c.font=`${10*s}px 'Share Tech Mono',monospace`;
  for(let k=0;k<=red/1000;k++){const a=ang(k*1000/red);c.fillText(k,cxp+Math.cos(a)*(rad-17*s),cyp+Math.sin(a)*(rad-17*s)+3*s)}
  const a=ang(x);c.strokeStyle='#ff8a3d';c.lineWidth=3*s;c.lineCap='round';c.beginPath();c.moveTo(cxp,cyp);c.lineTo(cxp+Math.cos(a)*(rad+4*s),cyp+Math.sin(a)*(rad+4*s));c.stroke();
  c.fillStyle='#f1ecf2';c.font=`${30*s}px 'Russo One',Impact,sans-serif`;c.fillText(me.launched?(me.shT>0?'–':me.g+1):'N',cxp,cyp+30*s);
  c.font=`${14*s}px 'Share Tech Mono',monospace`;c.fillStyle='#2dd4bf';c.fillText(Math.round(me.v*3.6)+' km/h',cxp,cyp+50*s);
  const n=9,gx=cxp-(n-1)*9*s;
  for(let i=0;i<n;i++){const th=0.7+i*0.03,on=me.launched&&me.shT<=0&&x>=th,col=i<4?'#3ddc84':i<7?'#ffc23d':'#ff4d5e';
    const blink=x>=0.9&&me.shT<=0&&me.launched&&(performance.now()/90|0)%2;
    c.fillStyle=on?(blink?'#fff':col):'#2a2230';c.beginPath();c.arc(gx+i*18*s,cyp-rad-32*s,5.5*s,0,7);c.fill()}
  c.textAlign='left';c.font=`${11*s}px 'Share Tech Mono',monospace`;c.fillStyle='#d8cfe0';c.fillText(Math.max(0,Math.min(FIN,me.z)).toFixed(0)+' / 402 m',cxp+rad+22*s,cyp+22*s);
  if(me.sp.nitroCh>0){c.font=`${11*s}px 'Chakra Petch',sans-serif`;c.fillStyle=me.ch>0?'#6fb7ff':'#5a5068';c.fillText('NOS '+'●'.repeat(me.ch)+'○'.repeat(me.sp.nitroCh-me.ch),cxp+rad+22*s,cyp+40*s)}
}

function showSlip(){
  const r=R,me=r.me,ai=r.ai;engSet(0,false,7000);
  const yt=me.fin!=null?me.react+me.fin:Infinity,at=ai.fin!=null?ai.react+ai.fin:Infinity;
  const win=!r.foul&&yt<at;
  let pay=0,line='';
  S.races++;
  if(r.opp.mode==='rival'){if(win){pay=r.opp.prize;if(r.opp.idx===S.rival)S.rival++;line=`Prêmio ${fmt(pay)}`}else line='Sem prêmio. Ajuste o carro e tente de novo.'}
  else{if(r.opp.bet){pay=win?r.opp.bet*2:0;line=win?`Você recebeu ${fmt(r.opp.bet*2)} (lucro de ${fmt(r.opp.bet)})`:`Você perdeu a aposta de ${fmt(r.opp.bet)}`}else line='Racha amistoso'}
  S.cash=Math.max(0,S.cash+pay);if(win)S.wins++;
  const o=cur();o.km=(o.km||0)+Math.max(0,me.z)/1000;
  let rec=false;if(!r.foul&&me.fin!=null&&(!o.best||me.fin<o.best)){o.best=me.fin;rec=true}
  if(S.cash<100&&S.owned.length===1&&o.m==='pardal'&&!win)S.cash+=300;
  save();
  const sp=(c,i)=>c.splits[i]?c.splits[i].t.toFixed(3):'—',kmh=(c,i)=>c.splits[i]?Math.round(c.splits[i].v*3.6):'—';
  const rows=[['Reação',me.launched?me.react.toFixed(3):'—',ai.react.toFixed(3)],['20 m',sp(me,0),sp(ai,0)],['100 m',sp(me,1),sp(ai,1)],['200 m',sp(me,2),sp(ai,2)],['  km/h',kmh(me,2),kmh(ai,2)],['300 m',sp(me,3),sp(ai,3)]];
  const now=new Date();
  $('#slip').innerHTML=`<div class="paper">
    <div class="c">PISTA 402 · ${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
    <h2>BOLETIM DE TEMPOS</h2>
    <div class="c">${r.foul?'Faixa 2: LARGADA QUEIMADA':`${CAR[cur().m].name} × ${r.ocar.name}`}</div>
    <table><thead><tr><th></th><th>VOCÊ</th><th>${r.opp.name.toUpperCase().slice(0,12)}</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}
    <tr class="et"><td>402 m</td><td class="${win?'w':''}">${r.foul?'FOUL':me.fin!=null?me.fin.toFixed(3):'—'}</td><td class="${win?'':'w'}">${ai.fin!=null?ai.fin.toFixed(3):'—'}</td></tr>
    <tr><td>km/h final</td><td>${kmh(me,4)}</td><td>${kmh(ai,4)}</td></tr>
    </tbody></table>
    ${me.shifts.length?`<div class="shs">${me.shifts.map((q,i)=>`<span class="${q==='perfeita'?'p':''}">${i+1}→${i+2} ${q}</span>`).join('')}</div>`:''}
    <div class="verdict ${win?'win':'lose'}">${win?'VITÓRIA':'DERROTA'}</div>
    <div class="c">${line}${rec?' · novo recorde do carro':''}</div>
    <div class="acts"><button class="btn" id="sGar">Garagem</button><button class="btn pri" id="sAgain">${r.opp.mode==='rival'&&win&&S.rival<10&&r.opp.idx+1===S.rival?'Próximo rival':'Correr de novo'}</button></div>
  </div>`;
  $('#slip').hidden=false;
  const opp=r.opp;
  $('#sGar').onclick=()=>endRace();
  $('#sAgain').onclick=()=>{$('#slip').hidden=true;if(opp.mode==='rival')startRival(Math.min(9,win&&opp.idx+1===S.rival?S.rival:opp.idx));else startRacha()};
}
function endRace(){cancelAnimationFrame(raf);R=null;engSet(0,false,7000);$('#race').hidden=true;$('#slip').hidden=true;render()}
render();
</script>
