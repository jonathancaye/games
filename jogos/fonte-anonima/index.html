<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f191c">
<title>Fonte Anônima</title>
<style>
:root{--teal:#14b8a6;--teal2:#0d9488;--org:#f97316;--scr:#0f191c;--card:#18252a;--card2:#1f2f35;--line:#26383e;--tx:#e6f0f1;--mut:#8aa1a6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05090a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#phone{position:relative;width:390px;height:min(820px,96vh);background:var(--scr);border-radius:44px;border:10px solid #1c1c1e;box-shadow:0 20px 60px #000a;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:520px){#phone{width:100vw;height:100dvh;border:0;border-radius:0}}
#status{height:calc(32px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 22px 0;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;flex:none;background:#0008;z-index:5}
#screen{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
#homebar{height:calc(22px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#0006}
#homebar div{width:120px;height:5px;border-radius:3px;background:#ffffff99}
/* home */
.home{flex:1;display:flex;flex-direction:column;padding:26px 20px 14px;background:radial-gradient(circle at 20% 10%,#14b8a633,transparent 55%),radial-gradient(circle at 90% 90%,#f9731628,transparent 50%),#0b1517}
.bigt{text-align:center;font-size:62px;font-weight:200;letter-spacing:1px}
.bigd{text-align:center;color:var(--mut);font-size:15px;margin-bottom:34px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;position:relative}
.app .ico{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 12px #0006}
.badge{position:absolute;top:-6px;right:6px;background:var(--org);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.objw{margin-top:auto;background:rgba(14,24,27,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:14px 14px 12px;box-shadow:0 10px 30px #0006}
.objw.in{margin:12px}
.objh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.objh .oi{width:24px;height:24px;border-radius:50%;background:rgba(20,184,166,.18);color:var(--teal);display:flex;align-items:center;justify-content:center;flex:none}
.objh .oi svg{width:14px;height:14px}
.objh .ol{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--teal)}
.objh .oe{margin-left:auto;font-size:11.5px;color:var(--mut)}
.objw.done .objh .oi{background:rgba(249,115,22,.2);color:var(--org)}.objw.done .objh .ol{color:var(--org)}
.objt{font-size:14.5px;line-height:1.42;color:var(--tx)}
.objst{color:var(--org);letter-spacing:2px;font-size:15px;margin-top:2px}
.objseg{display:flex;gap:4px;margin-top:12px}.objseg i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1)}
.objseg i.ok{background:var(--teal)}.objseg i.now{background:var(--org)}
.objbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;background:var(--org);color:#fff;font-weight:700;font-size:15px;border-radius:14px;padding:12px}
.objbtn svg{width:16px;height:16px}
.objlink{display:block;width:100%;text-align:center;margin-top:8px;font-size:13px;color:var(--mut)}
/* top bars */
.tbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.tbar h2{font-size:17px;font-weight:600;flex:1}
.back{font-size:22px;padding:0 4px;color:var(--teal);display:flex}.back svg{width:24px;height:24px}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.sub{font-size:12px;color:var(--mut)}
.scroll{flex:1;overflow-y:auto;min-height:0}
/* chat list */
.cl{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.cl .mid{flex:1;min-width:0}
.cl .nm{font-weight:600;font-size:15px}
.cl .pv{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px;color:var(--mut)}
.ub{background:var(--teal);color:#012;font-weight:700;font-size:11px;border-radius:10px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.typ{color:var(--teal)!important;font-style:italic}
/* chat */
.msgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;background:#0c1416}
.b{max-width:82%;padding:7px 10px 5px;border-radius:12px;font-size:14.5px;line-height:1.38;position:relative;word-wrap:break-word}
.b.them{background:var(--card2);align-self:flex-start;border-top-left-radius:3px}
.b.me{background:#0f5c55;align-self:flex-end;border-top-right-radius:3px}
.b .tm{font-size:10px;color:#ffffff80;text-align:right;margin-top:2px}
.b .who{font-size:12px;font-weight:700;color:var(--org);margin-bottom:2px}
.unr{align-self:stretch;text-align:center;margin:8px -10px;padding:6px 0;background:rgba(255,255,255,.07);color:var(--teal);font-size:12.5px;font-weight:600;letter-spacing:.2px}
.sysm{align-self:center;background:#ffffff12;color:var(--mut);font-size:12px;padding:4px 10px;border-radius:8px;margin:4px 0;text-align:center}
.lnk{background:#0006;border-radius:8px;padding:8px;margin:2px 0 3px;cursor:pointer;border-left:3px solid var(--teal)}
.lnk b{display:block;font-size:13.5px}.lnk span{font-size:11.5px;color:var(--mut)}
.compose{flex:none;background:var(--card);border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid var(--teal);color:var(--tx);border-radius:12px;padding:9px 12px;font-size:14px;background:#14b8a614}
.opt:active{background:#14b8a640}
.cbar{display:flex;gap:8px;align-items:center}
.cbar .ph{flex:1;font-size:13px;color:var(--mut);background:#0005;border-radius:18px;padding:9px 14px}
.clip{width:40px;height:40px;border-radius:50%;background:var(--org);font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.waitb{background:var(--org);color:#fff;border-radius:12px;padding:10px;font-weight:600}
/* keywords */
.k{background:rgba(249,115,22,.2);border-bottom:2px dashed var(--org);cursor:pointer;border-radius:3px;padding:0 2px}
.k.got{background:rgba(20,184,166,.18);border-bottom:2px solid var(--teal)}
.page .k{color:inherit}
/* evidence */
.evc{background:#fff;color:#111;border-radius:10px;overflow:hidden;cursor:pointer;max-width:250px;margin:2px 0 3px}
.evt{background:#222;color:#fff;font-size:11px;padding:5px 8px;font-weight:600}
.evb{max-height:130px;overflow:hidden;position:relative;font-size:12px}
.evb:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,#fff)}
.evfull{background:#fff;color:#111;border-radius:12px;overflow:hidden;max-width:340px;width:100%;font-size:13.5px}
/* browser */
.bbar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.bbar input{flex:1;min-width:0;background:#0007;border:1px solid var(--line);color:var(--tx);border-radius:18px;padding:8px 12px;font-size:14px;outline:none}
.bbar button{font-size:18px;padding:4px 6px;color:var(--teal)}
.page{flex:1;overflow-y:auto;background:#f4f5f6;color:#1a1a1a;position:relative}
.eng{padding:60px 20px;text-align:center}
.eng h1{font-size:40px;font-weight:800;letter-spacing:-1px;color:#0d9488}.eng h1 span{color:var(--org)}
.eng form{margin-top:20px;display:flex;gap:6px}
.eng input{flex:1;min-width:0;border:2px solid #0d9488;border-radius:24px;padding:12px 16px;font-size:15px;outline:none}
.eng button{background:#0d9488;color:#fff;border-radius:24px;padding:0 16px;font-weight:600}
.eng p{font-size:12.5px;color:#666;margin-top:16px;line-height:1.5}
.res{padding:12px 14px}
.res .q{font-size:12px;color:#666;margin-bottom:10px}
.ri{background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:9px;cursor:pointer;box-shadow:0 1px 3px #0001}
.ri .u{font-size:11.5px;color:#0d9488}.ri .ti{font-size:15.5px;color:#1a0dab;margin:2px 0}.ri .sn{font-size:13px;color:#444;line-height:1.4}
.printb{position:absolute;right:14px;bottom:14px;background:var(--org);color:#fff;border-radius:24px;padding:11px 16px;font-weight:700;box-shadow:0 4px 14px #0005;z-index:3}
.printb.done{background:#0d9488}
.pwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .35s}
.flash.on{opacity:.85;transition:none}
/* sites */
.st p{line-height:1.55;margin-bottom:12px;font-size:14.5px}
.st .in{padding:16px}
.vn-h{background:#b91c1c;color:#fff;font-weight:900;letter-spacing:1px;padding:12px 16px;font-size:18px}
.vn-h small{display:block;font-weight:400;font-size:11px;letter-spacing:0;opacity:.85}
.st h1{font-size:21px;line-height:1.25;margin-bottom:6px}
.meta{font-size:12px;color:#777;margin-bottom:14px}
.st a{color:#b91c1c;text-decoration:underline;cursor:pointer}
.rx{background:linear-gradient(160deg,#3b0764,#6d28d9);color:#fff;min-height:100%;padding:40px 22px;text-align:center}
.rx .lg{font-size:38px;font-weight:900;letter-spacing:-2px}
.rx .box{background:#fff2;border-radius:14px;padding:18px;margin:26px 0;line-height:1.5}
.rx .ft{font-size:11.5px;opacity:.8;margin-top:40px}
.ins-h{display:flex;gap:14px;align-items:center;padding:16px;background:#fff;border-bottom:1px solid #ddd}
.ins-av{width:70px;height:70px;border-radius:50%;background:linear-gradient(45deg,#f97316,#db2777);display:flex;align-items:center;justify-content:center;font-size:30px}
.post{background:#fff;margin:10px 0;padding-bottom:10px}
.post .img{height:190px;display:flex;align-items:center;justify-content:center;font-size:60px}
.post .cap{padding:8px 14px;font-size:14px;line-height:1.45}
.post .cm{padding:2px 14px;font-size:12.5px;color:#555}
.gone{background:#fff;margin:10px 0;padding:40px 20px;text-align:center;color:#888;font-size:14px}
.lume{background:#fffbeb}
.lume .hd{background:#f59e0b;color:#fff;padding:26px 18px}
.lume .hd b{font-size:24px}
.team{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:12px;margin-bottom:10px}
.team .av2{width:48px;height:48px;border-radius:50%;background:#fde68a;display:flex;align-items:center;justify-content:center;font-size:22px}
.addc{display:inline-block;margin-top:6px;background:#16a34a;color:#fff;border-radius:16px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.ce{background:#fff;border-radius:10px;padding:14px;margin:12px}
.ce .rw{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:7px 0;font-size:13px}
.ce .rw span:first-child{color:#777;flex:none}.ce .rw span:last-child{text-align:right;font-weight:600}
.ceh{background:#1e3a8a;color:#fff;padding:14px 16px;font-weight:800}
.rv{background:#fff;border-radius:10px;padding:11px 12px;margin:8px 12px;font-size:13.5px;line-height:1.4}
.rv .s{color:#f59e0b}.rv .n{font-weight:700}.rv .d{font-size:11px;color:#999}
/* caderno */
.tabs{display:flex;gap:6px;background:#0005;border-radius:20px;padding:4px;margin:12px}
.tab{flex:1;padding:8px;border-radius:16px;font-size:13.5px;font-weight:600;color:var(--mut)}
.tab.on{background:var(--teal);color:#012}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 12px 16px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:8px 13px;font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:6px}.chip svg{width:13px;height:13px;opacity:.7}
.evg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 12px 16px}
.evg .evc{max-width:none}
.empty{color:var(--mut);font-size:13.5px;padding:10px 16px;line-height:1.5}
.hint{font-size:12px;color:var(--mut);padding:0 16px 8px}
.nt{--amb:#f5b301;display:flex;flex-direction:column;flex:1;min-height:0;background:#0b1214}
.nt-top{display:flex;align-items:center;padding:10px 10px 0;flex:none}
.nt-back{display:flex;align-items:center;gap:2px;color:var(--amb);font-size:16px}.nt-back svg{width:22px;height:22px}
.nt-head{padding:4px 18px 10px;flex:none}.nt-title{font-size:32px;font-weight:800;letter-spacing:-.5px}.nt-sub{color:var(--mut);font-size:13px;margin-top:2px}
.nt-seg{display:flex;background:#1b2528;border-radius:10px;padding:3px;margin:0 16px 4px;flex:none}
.nt-seg button{flex:1;padding:7px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--mut)}
.nt-seg button.on{background:#2c3a3e;color:var(--tx);box-shadow:0 1px 3px #0005}
.nt-sec{font-size:15px;font-weight:700;padding:16px 18px 7px;display:flex;align-items:baseline;gap:8px}.nt-sec small{font-size:12px;font-weight:500;color:var(--mut)}
.nt-card{background:var(--card);border-radius:14px;margin:0 14px;overflow:hidden}
.nt-row{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;position:relative}
.nt-row+.nt-row:before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.nt-row .tx{flex:1;min-width:0}.nt-row .tt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-row .ss{font-size:12.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nt-row .ss b{color:var(--amb);font-weight:600}
.nt-bul{width:9px;height:9px;border-radius:50%;border:2px solid var(--amb);flex:none}
.nt-go{color:var(--mut);display:flex}.nt-go svg{width:16px;height:16px}
.thumb{width:50px;height:50px;border-radius:9px;overflow:hidden;background:#fff;flex:none;position:relative;border:1px solid #ffffff22}
.thumb>div{width:240px;transform:scale(.21);transform-origin:0 0;pointer-events:none}
.nt-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 30px;color:var(--mut);font-size:14px;line-height:1.5}
.nt-empty svg{width:40px;height:40px;color:var(--amb);opacity:.7}
.nt-foot{flex:none;padding:6px 0 4px}.nt-foot .objw{margin:0 12px}
/* blog */
.blogh{background:linear-gradient(135deg,#0d9488,#115e59);padding:22px 16px}
.blogh b{font-size:22px}.blogh div{font-size:12px;opacity:.85}
.bp{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.bp small{display:block;color:var(--mut);font-size:11.5px}
.bigbtn{display:block;width:calc(100% - 24px);margin:12px;background:var(--org);color:#fff;font-weight:700;border-radius:12px;padding:13px;font-size:15px}
.bigbtn.sec{background:var(--card2);border:1px solid var(--teal);color:var(--tx)}
.bigbtn:disabled{opacity:.4}
.claim{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 12px;padding:12px}
.claim p{font-size:14px;line-height:1.4;margin-bottom:8px}
.claim .pick{width:100%;border:1px dashed var(--teal);border-radius:10px;padding:9px;font-size:13px;color:var(--teal)}
.claim .pick.set{border-style:solid;background:#14b8a61a;color:var(--tx)}
/* overlays */
#notif{visibility:hidden;opacity:0;pointer-events:none;position:absolute;top:calc(40px + env(safe-area-inset-top));left:10px;right:10px;background:#1f2f35f2;border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;transform:translateY(calc(-100% - 60px - env(safe-area-inset-top)));transition:transform .3s,opacity .3s,visibility 0s .3s;z-index:20;cursor:pointer;box-shadow:0 8px 20px #0008}
#notif.show{transform:none;visibility:visible;opacity:1;pointer-events:auto;transition:transform .3s,opacity .2s,visibility 0s}
#notif .nb{font-size:13px;line-height:1.3;min-width:0}#notif .nb b{display:block}
#notif .nb span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
#toast{position:absolute;bottom:200px;left:50%;transform:translateX(-50%) translateY(20px);background:#000d;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;z-index:25;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%)}
#sheet{position:absolute;inset:0;background:#0009;z-index:30;display:none;align-items:flex-end}
#sheet.show{display:flex}
#sheet .sh{background:var(--card);width:100%;border-radius:18px 18px 0 0;max-height:75%;overflow-y:auto;padding:14px 12px 24px}
#sheet h3{font-size:15px;margin:0 4px 10px}
.srow{display:flex;gap:8px;margin-bottom:8px}.srow .sitem{margin-bottom:0;flex:1;min-width:0}
.prev{flex:none;width:44px;border-radius:10px;background:var(--card2);color:var(--teal);display:flex;align-items:center;justify-content:center}.prev svg{width:20px;height:20px}
.claim .prow{display:flex;gap:8px}.claim .prow .pick{flex:1;min-width:0}.claim .prow .prev{border:1px solid var(--line)}
.sitem{display:block;width:100%;text-align:left;padding:11px;border-radius:10px;background:var(--card2);margin-bottom:8px;font-size:14px}
#overlay{position:fixed;inset:0;background:#000c;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:380px;width:100%;max-height:92vh;overflow-y:auto;padding:22px}
.modal h1{font-size:28px;letter-spacing:2px;color:var(--teal)}
.modal h1 span{color:var(--org)}
.modal .ep{color:var(--mut);font-size:13px;margin-bottom:16px}
.modal p{font-size:14px;line-height:1.55;margin-bottom:12px}
.modal ul{font-size:13px;line-height:1.5;color:var(--mut);padding-left:18px;margin-bottom:16px}
.modal .bigbtn{width:100%;margin:8px 0 0}
.stars{font-size:34px;text-align:center;margin:8px 0;color:var(--org);letter-spacing:4px}
.sum{font-size:13.5px;line-height:1.5}
.sum .r{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0}
.sum .r span:last-child{font-weight:600}
.bar{height:8px;background:#0006;border-radius:4px;overflow:hidden;width:110px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--org)}
.src{background:#0d1117;color:#c9d1d9;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;padding:14px 12px 80px;white-space:pre-wrap;word-break:break-all;min-height:100%}
.src .k{color:#fbbf24}
.bbar .srcb{border:1px solid var(--teal);border-radius:8px;padding:3px 5px;display:flex}.bbar .srcb svg{width:17px;height:17px}
.bbar .srcb.on{background:var(--teal);color:#012}
.lx{background:linear-gradient(170deg,#064e3b,#059669);color:#fff;min-height:100%;padding:0 0 30px}
.lx .warn{background:#dc2626;color:#fff;font-size:12.5px;padding:9px 14px;font-weight:600}
.lx .in2{padding:30px 22px;text-align:center}
.lx .lg{font-size:40px;font-weight:900;letter-spacing:-2px}
.lx .hero{height:150px;border-radius:14px;margin:20px 0;display:flex;align-items:center;justify-content:center;font-size:54px}
.lx input{width:100%;border:0;border-radius:10px;padding:12px;margin:6px 0;font-size:14px}
.lx .go{width:100%;background:#fbbf24;color:#422006;font-weight:800;border-radius:10px;padding:13px;margin-top:6px}

function schedule(fn,at){S.timers.push({fn,at});}
function checkTimers(){S.timers.sort((a,b)=>a.at-b.at);while(S.timers.length&&S.timers[0].at<=S.t){const tm=S.timers.shift();FN[tm.fn]();}}
function advance(n){S.t+=n;checkTimers();}
function enqueue(items){S.queue.push(...items);save();pump();}
function dayWords(t){const q=dayOf(S.t)===4;return t.replace(/\{amanha\}/g,q?'hoje':'amanhã').replace(/\{Amanha\}/g,q?'Hoje':'Amanhã').replace(/\{cedo\}/g,q?'agora mesmo':'amanhã cedo');}
function runNode(c,id){const n=D[c][id];if(!n)return;if(n.pre)n.pre();const items=[];
  (n.m||[]).forEach(m=>{const o=typeof m==='string'?{t:m}:Object.assign({},m);if(o.t)o.t=dayWords(o.t);if(!o.f)o.f='them';items.push({c,msg:o});});
  if(n.o)items.push({c,opts:{node:id}});if(n.after)items.push({c,after:id});enqueue(items);}
function pump(){if(busy||!S.queue.length)return;busy=true;const it=S.queue[0];let d=0;
  if(it.msg){d=it.msg.f==='sys'?450:(it.msg.ev||it.msg.link)?1300:Math.min(2300,650+(it.msg.t||'').length*20);if(it.msg.f!=='sys'&&!instant){typing=it.c;render();}}
  setTimeout(()=>{S.queue.shift();typing=null;proc(it);busy=false;if(!S.queue.length)instant=false;save();render();pump();},instant?0:d);}
function proc(it){if(it.msg)deliver(it.c,it.msg);if(it.opts)chat(it.c).opts=it.opts;if(it.after)D[it.c][it.after].after();if(it.fn)FN[it.fn]();}
function deliver(c,m){const ch=chat(c);ch.visible=true;m.time=hm(S.t);ch.msgs.push(m);ch.last=++S.seq;
  if(m.ev&&m.f==='them')addEv(m.ev);
  if(m.f==='them'&&!(view.app==='chat'&&view.c===c)){ch.unread++;if(!instant)notify(c,m);}}
function notify(c,m){const n=$('#notif');const txt=m.ev?'📎 '+EV[m.ev].t:m.link?'🔗 '+PAGES[m.link].title:m.contact?'👤 Contato':strip(m.t);
  n.innerHTML=`${avatar(c)}<div class="nb"><b>${CONTACTS[c].name}</b><span>${m.who?m.who+': ':''}${esc(txt)}</span></div>`;
  n.dataset.c=c;n.classList.add('show');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),3200);}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}
function addKw(k){if(!S.kw.includes(k)){S.kw.push(k);(S.kwEp=S.kwEp||{})[k]=S.ep;toast('📝 Anotado no Caderno: '+k);save();render();}else toast('Já anotado: '+k);}
function addEv(id){if(!S.ev.includes(id)){S.ev.push(id);(S.evEp=S.evEp||{})[id]=S.ep;(S.evT=S.evT||{})[id]=DAYS[dayOf(S.t)]+' '+hm(S.t);toast('📎 Prova guardada: '+EV[id].t);
  if(S.ep===2&&(id==='src_lucrix'||id==='whois_lucrix')&&!has('e2_alerta_on')){fl('e2_alerta_on');runNode('anon','e2_alerta');}}}
function busyC(c){return CONTACTS[c].busy&&CONTACTS[c].busy();}
function autoReply(c){enqueue([{c,msg:{f:'them',t:CONTACTS[c].auto}}]);}
function visOpts(c,nid){return D[c][nid].o.map((o,i)=>({o,i})).filter(x=>!x.o.hide||!x.o.hide());}
function choose(i){const c=view.c,ch=chat(c);if(!ch.opts)return;const nid=ch.opts.node,o=D[c][nid].o[i];ch.opts=null;
  if(o.say!==false)deliver(c,{f:'me',t:o.t});advance(2);
  if(busyC(c)){ch.wait={k:'opt',node:nid,i};autoReply(c);}else doOpt(c,o);save();render();}
function doOpt(c,o){if(o.fx)o.fx();if(o.go)runNode(c,o.go);}
function sendEv(id){const c=view.c,ch=chat(c);closeSheet();deliver(c,{f:'me',ev:id});advance(2);

function waitTill(c){const ch=chat(c);S.t=Math.max(S.t,CONTACTS[c].wake());checkTimers();toast(`🌙 Você esperou. ${DAYSF[dayOf(S.t)]}, ${hm(S.t)}`);const w=ch.wait;ch.wait=null;
  if(w){if(w.k==='opt')doOpt(c,D[c][w.node].o[w.i]);else handleEv(c,w.id);}save();render();}

function waitAt(c){const ch=chat(c);if(!ch.waitAt||S.t>=ch.waitAt)return;S.t=ch.waitAt;checkTimers();toast(`🌙 Você esperou. ${DAYSF[dayOf(S.t)]}, ${hm(S.t)}`);save();render();}
function addContact(c){const ch=chat(c);if(ch.visible){openChat(c);return;}ch.visible=true;ch.last=++S.seq;ch.msgs.push({f:'sys',t:CONTACTS[c].saved,time:hm(S.t)});ch.opts={node:'ola'};toast('💬 Contato adicionado ao Papo');save();openChat(c);}
function openChat(c){const ch=chat(c);let mark=null;
  if(ch.unread>0){let n=0;for(let i=ch.msgs.length-1;i>=0;i--){if(ch.msgs[i].f==='them'){n++;if(n===ch.unread){mark={idx:i,n:ch.unread};break;}}}}
  view={app:'chat',c,mark};ch.unread=0;save();render();

  overlay(`<div class="modal"><h1>FONTE <span>ANÔNIMA</span></h1><div class="ep">${sv&&sv.started?`Você parou no Episódio ${sv.ep}`:'Episódio 1 · A Cara do Golpe'}</div>
  <p>Vale Alto, domingo à noite. Você mantém o <b>Vale Alto Agora</b>, um blog de notícias da cidade.</p>
  <p>Há dois dias, o <b>Rendix</b>, o app que pagava 3% ao mês e que meia cidade usava, saiu do ar. Sua mãe tinha dinheiro lá. E a <b>Bia</b>, sua amiga de escola que aparecia nos vídeos do app, acabou de ser presa.</p>
  <ul><li>Tudo acontece no seu celular.</li><li>Toque nos <span class="k">termos em destaque</span> para anotá-los no Caderno.</li><li>Pesquise no Navegador e use 📸 para printar páginas como prova.</li><li>No Papo, use 📎 para mostrar provas às pessoas.</li><li>Cada ação gasta tempo. Algumas provas podem desaparecer.</li></ul>
  ${sv&&sv.started?'<button class="bigbtn" data-continue="1">Continuar</button><button class="bigbtn sec" data-new="1">Novo jogo</button>':'<button class="bigbtn" data-new="1">Começar</button>'}<a href="../../" style="display:block;text-align:center;color:var(--mut);font-size:12.5px;margin-top:14px;text-decoration:none">← Mesa de Jogos</a></div>`);}
function reset(){busy=false;instant=false;typing=null;}
function newGame(){S=NEW();view={app:'home'};reset();closeOverlay();save();render();setTimeout(()=>runNode('mae','start'),1200);}
function cont(){S=migrate(load());view={app:'home'};reset();closeOverlay();if(S.queue.length){instant=true;pump();}render();
  if(S.ep===6&&S.finalShown&&!S.queue.length)showFinal();else if(S.mat[S.ep]&&!S.queue.length&&S.endShown[S.ep])showEnd(S.ep);}

/* ---------------- EVENTOS ---------------- */
document.addEventListener('click',e=>{const t=e.target;
  const k=t.closest('.k');if(k&&S&&!t.closest('#overlay .modal ul')){e.stopPropagation();const kw=k.dataset.k,lb=k.textContent.trim();if(lb[0]==='@'){const pid=handlePage(lb);if(pid){if(!S.kw.includes(kw))addKw(kw);closeOverlay();closeSheet();go(pid);return;}}addKw(kw);return;}
  if(t.closest('#notif')){const c=$('#notif').dataset.c;$('#notif').classList.remove('show');if(c&&S)openChat(c);return;}
  if(t.id==='sheet'){closeSheet();return;}
  const tx=t.closest('[data-tx]');if(tx&&S){const k=tx.dataset.tx;if(k.startsWith('n:'))toast(k.slice(2));else if(S.ev.includes(k))toast('Você já printou essas transferências');else{addEv(k);save();render();}return;}
  const fd=t.closest('[data-fdm]');if(fd&&S){forumDM(+fd.dataset.fdm);return;}
  const a=t.closest('[data-home],[data-open],[data-chat],[data-p],[data-ev],[data-opt],[data-clip],[data-sendev],[data-pickev],[data-pick],[data-wait],[data-add],[data-search],[data-tab],[data-print],[data-bback],[data-bhome],[data-src],[data-decide],[data-confirm],[data-close],[data-restart],[data-restartep],[data-new],[data-continue],[data-epintro],[data-startep],[data-lxform],[data-arch],[data-waitat],[data-forumdm],[data-dossie],[data-howto],[data-showend],[data-showfinal],[data-epilogo]');
  if(!a)return;const d=a.dataset;
  if(d.new!==undefined){newGame();return;}if(d.continue!==undefined){cont();return;}if(!S)return;
  if(d.home!==undefined){view={app:'home'};render();}
  else if(d.open){view={app:d.open};render();}
  else if(d.chat){openChat(d.chat);}
  else if(d.p){go(d.p);}
  else if(d.ev){viewEv(d.ev);}
  else if(d.opt!==undefined){choose(+d.opt);}
  else if(d.clip){evPicker('send');}
  else if(d.sendev){sendEv(d.sendev);}
  else if(d.pickev!==undefined){S.draft[+d.idx]=d.pickev||null;closeSheet();save();render();}
  else if(d.pick!==undefined){evPicker('pick',+d.pick);}
  else if(d.wait){waitTill(d.wait);}
  else if(d.add){addContact(d.add);}
  else if(d.search){S.br.stack=[];S.br.cur=null;go('q:'+d.search);}
  else if(d.tab){view.tab=d.tab;render();}
  else if(d.print){doPrint();}
  else if(d.bback){bback();}
  else if(d.bhome){if(S.br.cur!==null)S.br.stack.push(S.br.cur);S.br.cur=null;S.br.src=false;save();render();}
  else if(d.src){toggleSrc();}
  else if(d.lxform){toast('Você não vai colocar seus dados aí, né? 😅');}
  else if(d.decide){decide(d.decide);}
  else if(d.confirm){finalize(d.confirm);}
  else if(d.epintro){epIntro(+d.epintro);}
  else if(d.startep){startEp(+d.startep);}
  else if(d.arch){toggleArch();}
  else if(d.waitat){waitAt(d.waitat);}
  else if(d.dossie){buildDossie();}
  else if(d.howto){howto();}
  else if(d.showend){showEnd(S.ep);}
  else if(d.showfinal){showFinal();}
  else if(d.epilogo){showEpilogo();}
  else if(d.forumdm){if(has('forum_dm')||has('thiago_contato')){toast('Você já mandou mensagem');return;}openSheet('Mensagem privada para tvieira',`<button class="sitem" data-fdm="1">"Aqui é o jornalista do Vale Alto Agora. Você não está sozinho nessa."</button><button class="sitem" data-fdm="2">"Sei que você é a fonte e que montou o sistema. Fala comigo ou eu publico."</button>`);}
  else if(d.close){closeOverlay();}
  else if(d.restartep){const n=+d.restartep;if(confirm(`Recomeçar o Episódio ${n}? As escolhas dos episódios anteriores continuam valendo.`))restartEp(n);}
  else if(d.restart){if(confirm('Recomeçar do Episódio 1? Todo o progresso será perdido.')){try{localStorage.removeItem(LS);[2,3,4,5,6].forEach(n=>localStorage.removeItem(snapKey(n)));}catch(x){}closeOverlay();newGame();}}
});
intro();

</script>
