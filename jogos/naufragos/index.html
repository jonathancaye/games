<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="../../favicon.svg">
<title>Náufragos</title>
<meta name="theme-color" content="#0e1615">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma tela sem rolagem — topo, placar, tabuleiro (flex), controles. Visual do hub Mesa de Jogos (escuro, teal/laranja). */
:root{
  --bg:#0e1615; --bg-2:#131f1d; --surface:#17231f; --surface-2:#1c2a26; --line:#273935; --fg:#eaf2ef; --muted:#93a8a3;
  --teal:#2bc2b3; --orange:#ff9348; --red:#f0525f; --gold:#f2c14e;
  --teal-soft:rgba(43,194,179,.14); --orange-soft:rgba(255,147,72,.16); --red-soft:rgba(240,82,95,.16);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-body);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{
  padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:radial-gradient(60% 40% at 0% 0%,rgba(43,194,179,.10),transparent 70%),radial-gradient(50% 40% at 100% 100%,rgba(255,147,72,.09),transparent 70%),var(--bg)}
.app{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none}

/* topo */
.top{flex:none;display:flex;align-items:center;gap:8px;height:40px}
.back,.chip-btn{color:var(--fg);text-decoration:none;font-size:13px;font-weight:600;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer}
.brand{flex:1;text-align:center;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand span{color:var(--orange)}

/* placar */
.hud{flex:none;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:9px 12px}
.lvl{min-width:0}
.lvl small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.lvl b{display:block;font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-size:16px;font-weight:700}
.stat b em{font-style:normal;color:var(--muted);font-weight:600;font-size:13px}
.clockbar{width:74px;height:5px;border-radius:9px;background:var(--bg-2);overflow:hidden}
.clockbar i{display:block;height:100%;background:var(--teal);border-radius:9px;transition:width .2s,background .2s}
.clockbar.low i{background:var(--orange)}
.logs{display:flex;gap:3px}
.logs i{width:15px;height:9px;border-radius:5px;background:var(--bg-2);border:1px solid var(--line)}
.logs i.on{background:#a8703c;border-color:#d9a86a}
.coco{width:11px;height:11px;border-radius:50%;border:1px dashed var(--muted);display:inline-block;vertical-align:-1px;margin-left:6px}
.coco.on{background:#7a4a26;border:1px solid #c79466}

.hint{flex:none;margin:0;font-size:13.5px;line-height:1.35;color:var(--muted);text-align:center;min-height:2.7em;display:flex;align-items:center;justify-content:center;padding:0 6px;text-wrap:balance}
.hint b{color:var(--fg)}
.hint.aim{color:var(--orange);font-weight:600}
.par{font-size:11px;color:var(--muted);font-weight:600}

/* tripulação (seleção de personagem) */
.crew{flex:none;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.tidechip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);color:#8fd3e0;font-variant-numeric:tabular-nums}
.tidechip.hi{color:#7fb1ff;background:rgba(80,130,220,.14);border-color:rgba(127,177,255,.4)}
.tidechip i{width:9px;height:9px;border-radius:50%;background:currentColor}
.crew .seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.crew button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 13px var(--f-body);padding:4px 12px 4px 5px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.crew button svg{width:26px;height:26px;border-radius:50%;background:var(--surface-2)}
.crew button[aria-pressed="true"]{background:var(--teal);color:#06201d}
.crew button[aria-pressed="true"].b{background:var(--orange)}
.crew button[aria-pressed="true"].k{background:var(--gold)}
.crew button[aria-pressed="true"] svg{background:rgba(255,255,255,.35)}

/* tabuleiro */
.stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
#board{width:100%;height:100%;display:block;touch-action:none}
.tok{transition:transform .16s cubic-bezier(.3,1.2,.5,1)}
.selring{animation:ring 1.3s ease-in-out infinite;transform-origin:5px 8.9px;transform-box:view-box}
@keyframes ring{50%{opacity:.35}}
.bubble{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.6px)}}
.stone{transition:transform .32s cubic-bezier(.3,.7,.4,1)}
.ripple{animation:rip .7s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(2.6);opacity:0}}
.aimdot{animation:ring 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tok,.stone{transition:none}.selring,.bubble,.aimdot{animation:none}}
.caught{animation:pulse .5s ease-in-out 3}
@keyframes pulse{50%{opacity:.25}}

/* controles */
.ctrl{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding-bottom:2px}
.side{display:flex;flex-direction:column;gap:8px}
.side.l{align-items:flex-start}.side.r{align-items:flex-end}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font:700 14px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.wait{background:var(--orange-soft);border-color:rgba(255,147,72,.45);color:var(--orange)}
.side .btn:not(.ghost){flex-direction:column;gap:3px;width:84px;padding:8px 6px;font-size:12.5px}
.side .btn:not(.ghost) svg.i{width:20px;height:20px}
.btn.rock{background:var(--orange);border-color:var(--orange);color:#2a1406}
.btn.axe{background:var(--gold);border-color:var(--gold);color:#2a1e04}
.btn.axe[aria-pressed="true"]{background:transparent;color:var(--gold);border-style:dashed}
.btn.rock[aria-pressed="true"]{background:transparent;color:var(--orange);border-style:dashed}
.side.many .btn:not(.ghost){min-height:36px;padding:5px 6px;font-size:11.5px;gap:1px}
.side.many .btn:not(.ghost) svg.i{width:16px;height:16px}
.side.many{gap:5px}
.lv.locked{border-style:dashed}
.lv.skull{border-color:#6b3a4a;background:linear-gradient(160deg,#1d1420,#131f1d)}
.lv.skull .n{color:#e4485d}
.reveal svg,.ending svg{width:100%;height:auto;display:block;border-radius:14px}
.mapline{stroke-dasharray:4 3;animation:draw 2.4s ease-out forwards}
@keyframes draw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
.mapx{opacity:0;animation:pop .4s 2.2s forwards}
@keyframes pop{to{opacity:1}}
.sail{animation:sail 6s ease-in-out forwards}
@keyframes sail{from{transform:translateX(0)}to{transform:translateX(150px)}}
.bob{animation:bob2 1.6s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(1.5px)}}
@media (prefers-reduced-motion:reduce){.mapline,.mapx,.sail,.bob{animation:none;opacity:1;stroke-dashoffset:0}}
.mestre{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:linear-gradient(135deg,#f2c14e,#d99a1f);color:#2a1e04;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px}
.secret{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.04em;opacity:.8}
.lv .lk{font-size:12px;color:var(--muted);font-weight:600}
.btn.ghost{background:transparent;color:var(--muted);font-weight:600;font-size:13px;min-height:36px;padding:7px 12px}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,46px);gap:4px}
.pad button{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;cursor:pointer;display:grid;place-items:center;font-size:20px;color:var(--fg)}
.pad button:active{background:var(--teal);color:#06201d}
.pad .u{grid-area:1/2}.pad .l{grid-area:2/1}.pad .r{grid-area:2/3}.pad .d{grid-area:3/2}
.pad .hub{grid-area:2/2;border-radius:50%;background:transparent;border:1px dashed var(--line);pointer-events:none}

/* telas sobrepostas */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(6,12,11,.72);backdrop-filter:blur(4px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:min(100%,440px);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.panel h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.025em;line-height:1;text-wrap:balance}
.panel p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.eyebrow.bad{color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;justify-content:center}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#06201d}
.stars{display:flex;flex-direction:column;gap:8px}
.star{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;color:var(--muted)}
.star svg{width:22px;height:22px;flex:none}
.star.on{color:var(--fg)}
.star .sf{fill:var(--bg-2);stroke:var(--line)}
.star.on .sf{fill:var(--gold);stroke:#b98a1f}

.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg-2);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:64px}
.lv:not(:disabled):hover{border-color:var(--teal)}
.lv:disabled{cursor:default;opacity:.45}
.lv .n{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.lv:disabled .n{color:var(--muted)}
.lv b{font-size:14.5px;font-weight:700}
.lv .ss{display:flex;gap:2px;margin-top:2px}
.lv .ss i{width:10px;height:10px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:var(--line)}
.lv .ss i.on{background:var(--gold)}
/* tela inicial */
.ov.home{background:radial-gradient(70% 45% at 0% 0%,rgba(43,194,179,.16),transparent 70%),radial-gradient(60% 45% at 100% 100%,rgba(255,147,72,.14),transparent 70%),var(--bg);backdrop-filter:none}
.home-wrap{width:min(100%,420px);max-height:100%;display:flex;flex-direction:column;align-items:stretch;gap:16px;text-align:center}
.home-art{width:100%;max-height:34vh;height:auto;display:block}
.home-title{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(44px,13vw,64px);letter-spacing:-.04em;line-height:.9}
.home-title span{color:var(--orange)}
.home-tag{margin:0;color:var(--muted);font-size:15px;line-height:1.45;text-wrap:balance}
.home-stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.home-stats span{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-variant-numeric:tabular-nums}
.home-stats b{color:var(--gold)}
.home-btns{display:flex;flex-direction:column;gap:8px}
.home-btns .btn{justify-content:center;min-height:50px;font-size:15.5px}
.home-hub{align-self:center;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:8px 16px;margin-top:4px}
.home-hub:hover{color:var(--fg);border-color:var(--teal)}
@media (max-height:620px){.home-art{max-height:24vh}.home-wrap{gap:11px}}

@media (max-height:700px){.pad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,40px)}.hint{font-size:12.5px;min-height:2.5em}.hud{padding:7px 10px}}
@media (max-height:600px){.hint{display:none}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <button class="chip-btn" id="btnHome" type="button">Início</button>
    <div class="brand">Náufra<span>gos</span></div>
    <button class="chip-btn" id="btnLevels" type="button">Fases</button>
  </header>

  <section class="hud" aria-live="polite">
    <div class="lvl"><small id="lvlNum">Fase 1</small><b id="lvlName">A praia</b></div>
    <div class="stat"><small><span id="woodLbl">Madeira</span> <span class="coco" id="cocoDot" title="Coco bônus"></span></small><div class="logs" id="logs"></div></div>
    <div class="stat"><small>Tique</small><b id="tick">0 <em>/ 28</em></b><div class="clockbar" id="clockbar"><i id="clockfill"></i></div><span class="par" id="parLbl">par 23</span></div>
  </section>

  <div class="crew" id="crew" hidden><div class="seg" id="crewSeg"></div><span class="tidechip" id="tideChip" hidden><i></i><span id="tideTxt"></span></span><span class="tidechip" id="chestChip" hidden style="color:#f2c14e"><i></i><span id="chestTxt"></span></span></div>
  <p class="hint" id="hint"></p>

  <div class="stage"><svg id="board" role="img" aria-label="Tabuleiro da ilha"></svg></div>

  <div class="ctrl">
    <div class="side l">
      <button class="btn" id="btnUndo" type="button" title="Desfazer (Z)"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Desfazer</button>
      <button class="btn ghost" id="btnReset" type="button" title="Reiniciar (R)">Reiniciar</button>
    </div>
    <div class="pad" aria-label="Direcional">
      <button class="u" data-d="U" type="button" aria-label="Cima">▲</button>
      <button class="l" data-d="L" type="button" aria-label="Esquerda">◀</button>
      <span class="hub"></span>
      <button class="r" data-d="R" type="button" aria-label="Direita">▶</button>
      <button class="d" data-d="D" type="button" aria-label="Baixo">▼</button>
    </div>
    <div class="side r">
      <button class="btn wait" id="btnWait" type="button" title="Esperar (espaço)"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg>Esperar</button>
      <button class="btn rock" id="btnRock" type="button" title="Jogar pedra (P)" hidden><svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M5 17.5 7 10l5-3.5 5.5 2 2 8.5-6 2.5z"/></svg><span id="rockLbl">Pedra ×1</span></button>
      <button class="btn axe" id="btnAxe" type="button" title="Machado (X)" hidden><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20 15 10"/><path d="M13 4c3 0 6 2 7 6l-4 1-4-4z" fill="currentColor"/></svg><span id="axeLbl">Machado</span></button>
      <button class="btn axe" id="btnTrap" type="button" title="Armadilha (Q)" hidden><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h18"/><path d="M5 15l2-6 2 6 2-6 2 6 2-6 2 6 2-6 1 6"/></svg><span id="trapLbl">Armadilha</span></button>
    </div>
  </div>
</div>

<!-- tela inicial -->
<div class="ov home" id="ovHome" hidden>
  <div class="home-wrap">
    <svg class="home-art" viewBox="0 0 240 130" aria-hidden="true">
      <defs><radialGradient id="hsea" cx="50%" cy="60%" r="65%"><stop offset="0" stop-color="#1f6b70"/><stop offset="1" stop-color="#0e1615" stop-opacity="0"/></radialGradient></defs>
      <ellipse cx="120" cy="78" rx="118" ry="50" fill="url(#hsea)"/>
      <g stroke="#3a8f93" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".7"><path d="M22 70q5-3 10 0t10 0"/><path d="M196 58q5-3 10 0t10 0"/><path d="M186 104q5-3 10 0t10 0"/><path d="M30 104q5-3 10 0t10 0"/></g>
      <ellipse cx="112" cy="84" rx="58" ry="17" fill="#cfae74"/>
      <ellipse cx="112" cy="82" rx="58" ry="15" fill="#dcc08a"/>
      <ellipse cx="92" cy="80" rx="20" ry="6" fill="#3f7d3c"/>
      <path d="M120 80q-2-26 8-46" stroke="#7a5432" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g fill="#2f7a44"><path d="M128 34q-20-6-30 6q14-8 30-6z"/><path d="M128 34q18-10 32-2q-16-2-32 2z"/><path d="M128 34q-6-16-20-18q12 6 20 18z"/><path d="M128 34q8-18 24-18q-14 6-24 18z"/><path d="M128 34q2 14 14 22q-8-12-14-22z"/></g>
      <circle cx="126" cy="38" r="2.6" fill="#7a4a26"/><circle cx="131" cy="37" r="2.6" fill="#7a4a26"/>
      <g class="bob"><rect x="150" y="90" width="34" height="9" rx="2" fill="#a8703c"/><path d="M155 90v9M161 90v9M167 90v9M173 90v9M179 90v9" stroke="#7a5432" stroke-width="1"/><path d="M167 90V68" stroke="#7a5432" stroke-width="1.8"/><path d="M167 69l13 10h-13z" fill="#eaf2ef"/></g>
      <g transform="translate(200 30)"><path d="M0 8h22l-3 6H3z" fill="#3a2a22"/><path d="M10 8V-6" stroke="#3a2a22" stroke-width="1.4"/><path d="M10-5l8 5-8 3z" fill="#1c1c1c"/><circle cx="14" cy="-1.5" r="1" fill="#eaf2ef"/></g>
    </svg>
    <div>
      <h1 class="home-title">Náufra<span>gos</span></h1>
    </div>
    <p class="home-tag">Uma ilha tomada por piratas. Junte madeira, construa a jangada e fuja sem ser visto. Cada passo é um tique, e a cada tique os guardas andam.</p>
    <div class="home-stats" id="homeStats"></div>
    <div class="home-btns">
      <button class="btn pri" id="btnPlay" type="button">Começar</button>
      <button class="btn" id="btnHomeLevels" type="button">Escolher fase</button>
    </div>
    <a class="home-hub" href="../../">← Voltar à Mesa de Jogos</a>
  </div>
</div>

<!-- seleção de fases -->
<div class="ov" id="ovLevels" hidden>
  <div class="panel">
    <div><div class="eyebrow">Escolha a fase</div><h2>Fases</h2></div>
    <div class="levels" id="levelGrid"></div>
    <p class="secret" id="perfectCount"></p>
  </div>
</div>

<!-- resultado -->
<div class="ov" id="ovResult" hidden>
  <div class="panel" id="resultPanel"></div>
</div>

<script>
/*ENGINE-START*/
const DIRS={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
const RANGE=3;        // alcance da visão
const THROW=3;        // alcance do arremesso (casas, em passos)
const HEAR=4;         // guardas a até 4 casas ouvem a pedra
const DISTRACT=3;     // tiques olhando para o barulho
const DOG=2;          // faro do cachorro (casas, em passos; atravessa mato e árvores)
const FP=3;           // tiques que uma pegada fica fresca na areia
const TRAP=4;         // tiques que o guarda fica preso na armadilha
const NIGHT=1;        // à noite, sem tocha, o guarda só enxerga 1 casa
const TORCH=2;        // uma tocha acesa ilumina até 2 casas em volta
const CHARS={
  M:{name:"Marujo"},
  B:{name:"Batedora",throws:true,slips:true},
  K:{name:"Carpinteiro",chops:true,traps:true},
};
/* tiles: ~ mar · . areia · , mato alto · T árvore · O rocha · R jangada (N = navio) · f fresta · = água rasa (maré)
   : areia molhada · Y tocha · Q papagaio · H baú do capitão */

function parseLevel(def){
  const rows=def.map, H=rows.length, W=rows[0].length;
  const tiles=[], items=[], chars=[], trees=[], torches=[], parrots=[];let ship=false;
  for(let y=0;y<H;y++){
    const r=[];
    for(let x=0;x<W;x++){
      let c=rows[y][x];
      if(c==="w"){items.push({x,y,k:"wood"});c=".";}
      else if(c==="W"){items.push({x,y,k:"wood"});c=",";}
      else if(c==="c"){items.push({x,y,k:"coco"});c=".";}
      else if(c==="C"){items.push({x,y,k:"coco"});c=",";}
      else if(c==="H"){items.push({x,y,k:"chest"});c=".";}
      else if(c==="N"){ship=true;c="R";}
      else if(CHARS[c]){chars.push({x,y,id:c,f:"D"});c=".";}
      if(c==="Y")torches.push({x,y});
      if(c==="Q")parrots.push({x,y});
      if(c==="T")trees.push({x,y});
      r.push(c);
    }
    tiles.push(r);
  }
  const lv={...def,W,H,tiles,items,trees,torches,parrots,ship,chars0:chars,guards:def.guards||[],stones0:def.stones||0,traps0:def.traps||0};
  lv.treeIdx={};trees.forEach((t,i)=>lv.treeIdx[t.x+","+t.y]=i);
  lv.woodMask=items.reduce((m,it,i)=>it.k==="wood"?m|(1<<i):m,0);
  lv.cocoMask=items.reduce((m,it,i)=>it.k==="coco"?m|(1<<i):m,0);
  lv.need=def.need!=null?def.need:popc(lv.woodMask);
  lv.wet=tiles.some(r=>r.includes(":"));
  lv.chestIdx=items.findIndex(it=>it.k==="chest");
  return lv;
}
function popc(n){let c=0;while(n){c+=n&1;n>>>=1;}return c;}
/* tile considerando árvores cortadas (viram toco "s") */
function tileS(lv,s,x,y){
  if(x<0||y<0||x>=lv.W||y>=lv.H)return "~";
  const t=lv.tiles[y][x];
  if(t==="T"&&s.cut&&(s.cut&(1<<lv.treeIdx[x+","+y])))return "s";
  return t;
}
function tileAt(lv,x,y){return (x<0||y<0||x>=lv.W||y>=lv.H)?"~":lv.tiles[y][x];}
const blocks=t=>t==="T"||t==="O";
/* maré: lv.tide={low,high,off}; alta = água rasa intransponível */
function tideHigh(lv,t){if(!lv.tide)return false;const {low,high,off=0}=lv.tide;return ((t+off)%(low+high))>=low;}
function canWalk(lv,s,id,x,y,t){
  const tl=tileS(lv,s,x,y);
  if(tl==="."||tl===","||tl==="R"||tl==="s"||tl===":")return true; // Y tocha e Q poleiro não são passáveis
  if(tl==="f")return !!CHARS[id].slips;
  if(tl==="=")return !tideHigh(lv,t);
  return false;
}
const face=g=>g.dz>0?g.lf:g.f;
const dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
function woodCount(lv,s){return popc(s.got&lv.woodMask)+popc(s.cut||0);}

function initState(lv){
  return {t:0,chars:lv.chars0.map(c=>({...c})),got:0,st:lv.stones0,cut:0,tp:lv.traps0,trs:[],pr:[],off:0,mm:0,pq:0,
    gs:lv.guards.map(g=>({x:g.x,y:g.y,f:g.f,ph:0,dz:0,lf:g.f,hold:0,k:g.kind==="dog"?"dog":"man"}))};
}
function guardNext(lv,i,g){if(g.dz>0)return "?";if(g.hold>0)return "!";const mv=lv.guards[i].moves||".";return mv[g.ph%mv.length];}

function lit(lv,s,x,y){return lv.torches.some((tc,i)=>!(s.off&(1<<i))&&Math.abs(tc.x-x)+Math.abs(tc.y-y)<=TORCH);}
const hasChest=(lv,s)=>lv.chestIdx>=0&&!!(s.got&(1<<lv.chestIdx));
/* casas vigiadas pelo papagaio: as 8 em volta do poleiro */
function parrotArea(lv,x,y){return lv.parrots.some(p=>Math.max(Math.abs(p.x-x),Math.abs(p.y-y))===1);}
function visionCells(lv,s,g){
  const out=[];
  if(g.k==="dog"){
    for(let y=g.y-DOG;y<=g.y+DOG;y++)for(let x=g.x-DOG;x<=g.x+DOG;x++){
      const d=Math.abs(x-g.x)+Math.abs(y-g.y);
      if(d<1||d>DOG||x<0||y<0||x>=lv.W||y>=lv.H||lv.tiles[y][x]==="~")continue;
      out.push({x,y});
    }
    return out;
  }const[dx,dy]=DIRS[face(g)];
  for(let k=1;k<=RANGE;k++){
    const x=g.x+dx*k,y=g.y+dy*k;
    if(x<0||y<0||x>=lv.W||y>=lv.H)break;
    if(blocks(tileS(lv,s,x,y)))break;
    if(lv.night&&k>NIGHT&&!lit(lv,s,x,y))continue; // escuro: não vê, mas a visão segue até uma casa iluminada
    out.push({x,y});
  }
  return out;
}
function seenBy(lv,s,gs,chars){
  for(let i=0;i<gs.length;i++){
    const dog=gs[i].k==="dog";
    for(const c of visionCells(lv,s,gs[i])){
      for(const ch of chars)if(ch.x===c.x&&ch.y===c.y&&(dog||lv.tiles[c.y][c.x]!==","))return {guard:i,x:c.x,y:c.y,dog};
      if(!dog&&s.pr&&s.pr.length&&s.pr.some(q=>q.startsWith(c.x+","+c.y+",")))return {guard:i,x:c.x,y:c.y,print:true};
    }
  }
  return null;
}
function throwTargets(lv,s,ci){
  const ch=s.chars[ci];if(!CHARS[ch.id].throws||s.st<=0)return [];
  const out=[];
  for(let y=0;y<lv.H;y++)for(let x=0;x<lv.W;x++){
    const d=Math.abs(x-ch.x)+Math.abs(y-ch.y);
    if(d<1||d>THROW)continue;
    const t=tileS(lv,s,x,y);
    if(t==="Y"){const i=lv.torches.findIndex(tc=>tc.x===x&&tc.y===y);if(!(s.off&(1<<i)))out.push({x,y,torch:true});continue;}
    if(t==="~"||blocks(t)||t==="Q")continue;
    if(s.gs.some(g=>g.x===x&&g.y===y))continue;
    out.push({x,y});
  }
  return out;
}
function chopTargets(lv,s,ci){
  const ch=s.chars[ci];if(!CHARS[ch.id].chops)return [];
  const out=[];
  for(const d in DIRS){const x=ch.x+DIRS[d][0],y=ch.y+DIRS[d][1];if(tileS(lv,s,x,y)==="T")out.push({x,y,d});}
  return out;
}
function trapTargets(lv,s,ci){
  const ch=s.chars[ci];if(!CHARS[ch.id].traps||s.tp<=0)return [];
  const out=[];
  for(const d in DIRS){const x=ch.x+DIRS[d][0],y=ch.y+DIRS[d][1];const t=tileS(lv,s,x,y);
    if(!(t==="."||t===","||t==="s"||t==="R"||t===":"))continue;
    if(s.gs.some(g=>g.x===x&&g.y===y)||s.chars.some(c=>c.x===x&&c.y===y)||s.trs.includes(x+","+y))continue;
    out.push({x,y,d});}
  return out;
}
const lookToward=(g,p)=>{const dx=p.x-g.x,dy=p.y-g.y;return Math.abs(dx)>=Math.abs(dy)?(dx>0?"R":"L"):(dy>0?"D":"U");};

/* aplica uma ação {c, d:"U|D|L|R|W|P|X", x,y (P e X)}.
   retorna null se inválida, ou {state, result, info, noise, heard, chop}
   result: "ok" | "win" | "seen" | "bump" | "tide" | "time" */
function step(lv,s,a){
  const chars=s.chars.map(c=>({...c}));
  let got=s.got, st=s.st, cut=s.cut, tp=s.tp, trs=s.trs, off=s.off||0, mm=0, noise=null, chop=null;
  let pr=(lv.prints||lv.wet)?s.pr.map(q=>{const[a,b,l]=q.split(",");return a+","+b+","+(l-1);}).filter(q=>!q.endsWith(",0")):s.pr;
  const ch=chars[a.c];const t=s.t+1;
  if(a.d==="P"){
    if(!throwTargets(lv,s,a.c).some(p=>p.x===a.x&&p.y===a.y))return null;
    st--;noise={x:a.x,y:a.y};ch.f=lookToward(ch,noise);
    const ti=lv.torches.findIndex(tc=>tc.x===a.x&&tc.y===a.y);if(ti>=0)off|=1<<ti;
  }else if(a.d==="X"){
    const tg=chopTargets(lv,s,a.c).find(p=>p.x===a.x&&p.y===a.y);if(!tg)return null;
    cut|=1<<lv.treeIdx[a.x+","+a.y];ch.f=tg.d;chop={x:a.x,y:a.y};
  }else if(a.d==="A"){
    const tg=trapTargets(lv,s,a.c).find(p=>p.x===a.x&&p.y===a.y);if(!tg)return null;
    tp--;trs=[...trs,a.x+","+a.y].sort();ch.f=tg.d;
  }else if(a.d!=="W"){
    const[dx,dy]=DIRS[a.d];const nx=ch.x+dx,ny=ch.y+dy;
    ch.f=a.d;
    if(ch.id==="M"&&hasChest(lv,s)&&s.mm)return null; // com o baú, o Marujo descansa um tique entre os passos
    if(!canWalk(lv,s,ch.id,nx,ny,t))return null;
    if(chars.some((o,j)=>j!==a.c&&o.x===nx&&o.y===ny))return null;
    if(s.gs.some(g=>g.x===nx&&g.y===ny))return null;
    ch.x=nx;ch.y=ny;
    if((lv.prints&&lv.tiles[ny][nx]===".")||lv.tiles[ny][nx]===":"){const k=nx+","+ny+",";pr=[...pr.filter(q=>!q.startsWith(k)),k+FP].sort();}
    lv.items.forEach((it,i)=>{if(!(got&(1<<i))&&it.x===nx&&it.y===ny&&(it.k!=="chest"||ch.id==="M"))got|=1<<i;});
    if(ch.id==="M"&&lv.chestIdx>=0&&(got&(1<<lv.chestIdx)))mm=1;
  }
  const pq=lv.parrots.length?chars.reduce((m,c,i)=>parrotArea(lv,c.x,c.y)?m|(1<<i):m,0):0;
  const mid={t,chars,got,st,cut,tp,trs,pr,off,mm,pq,gs:s.gs};
  let seen=seenBy(lv,mid,s.gs,chars);
  if(seen)return {state:mid,result:"seen",info:seen,noise,chop};
  if(woodCount(lv,mid)>=lv.need&&(lv.chestIdx<0||hasChest(lv,mid))&&chars.every(c=>lv.tiles[c.y][c.x]==="R"))return {state:mid,result:"win",noise,chop};
  const heard=[],caught=[];
  const gs=s.gs.map((g,i)=>{
    g={...g};
    if(noise&&g.k!=="dog"&&dist(g,noise)<=HEAR){g.dz=DISTRACT;g.lf=lookToward(g,noise);heard.push(i);if(g.hold>0)g.hold--;return g;}
    if(g.dz>0){g.dz--;if(g.hold>0)g.hold--;return g;}
    if(g.hold>0){g.hold--;return g;}
    const mv=lv.guards[i].moves||".";const c=mv[g.ph%mv.length];g.ph=(g.ph+1)%mv.length;
    if(c===".")return g;
    const up=c.toUpperCase();
    if(c===up){const[dx,dy]=DIRS[up];g.x+=dx;g.y+=dy;
      const k=g.x+","+g.y;if(trs.includes(k)){trs=trs.filter(q=>q!==k);g.hold=TRAP;caught.push(i);}}
    g.f=up;g.lf=up;
    return g;
  });
  const ns={t,chars,got,st,cut,tp,trs,pr,off,mm,pq,gs};
  for(let i=0;i<gs.length;i++)for(const c of chars)if(gs[i].x===c.x&&gs[i].y===c.y)
    return {state:ns,result:"bump",info:{guard:i,x:c.x,y:c.y},noise,heard,chop,caught};
  seen=seenBy(lv,ns,gs,chars);
  if(seen)return {state:ns,result:"seen",info:seen,noise,heard,chop,caught};
  if(pq&(s.pq||0)){const i=[...Array(chars.length).keys()].find(i=>pq&(s.pq||0)&(1<<i));
    return {state:ns,result:"parrot",info:{x:chars[i].x,y:chars[i].y},noise,heard,chop};}
  if(lv.tide&&tideHigh(lv,t)){const wet=chars.find(c=>lv.tiles[c.y][c.x]==="=");
    if(wet)return {state:ns,result:"tide",info:{x:wet.x,y:wet.y},noise,heard,chop};}
  if(t>=lv.limit)return {state:ns,result:"time",noise,heard,chop};
  return {state:ns,result:"ok",noise,heard,chop,caught};
}

/* BFS: menor nº de tiques para fugir (opcionalmente exigindo o coco) */
function solve(lv,needCoco,maxStates=6e6){
  // o estado dos guardas já guarda a fase da rota, então o tique só importa pela maré e pelo limite:
  // o mesmo estado alcançado mais cedo domina o alcançado mais tarde.
  const cyc=lv.tide?lv.tide.low+lv.tide.high:0;
  const key=s=>(cyc?s.t%cyc:0)+"|"+s.got+"|"+s.st+"|"+s.cut+"|"+s.tp+"|"+s.trs.join(";")+"|"+s.pr.join(";")+"|"+s.off+s.mm+"|"+s.pq+"|"+s.chars.map(c=>c.x+","+c.y).join(";")+"|"+s.gs.map(g=>g.x+","+g.y+","+g.f+","+g.ph+","+g.dz+","+g.lf+","+g.hold).join(";");
  const s0=initState(lv);
  const seen=new Set([key(s0)]);
  let frontier=[{s:s0,p:null,lab:""}];
  const trace=n=>{const out=[];while(n&&n.p){out.push(n.lab);n=n.p;}return out.reverse();};
  while(frontier.length){
    const next=[];
    for(const node of frontier){
      const s=node.s;
      const acts=[];
      s.chars.forEach((ch,c)=>{
        for(const d of ["U","D","L","R"])acts.push({c,d});
        for(const p of throwTargets(lv,s,c))acts.push({c,d:"P",x:p.x,y:p.y});
        for(const p of chopTargets(lv,s,c))acts.push({c,d:"X",x:p.x,y:p.y});
        for(const p of trapTargets(lv,s,c))acts.push({c,d:"A",x:p.x,y:p.y});
      });
      acts.push({c:0,d:"W"});
      for(const a of acts){
        const r=step(lv,s,a);if(!r)continue;
        const lab=(s.chars.length>1?s.chars[a.c].id:"")+("PXA".includes(a.d)?`${a.d}${a.x},${a.y}`:a.d);
        if(r.result==="win"){
          if(needCoco&&(r.state.got&lv.cocoMask)!==lv.cocoMask)continue;
          return {ticks:r.state.t,path:[...trace(node),lab],states:seen.size};
        }
        if(r.result!=="ok")continue;
        const k=key(r.state);if(seen.has(k))continue;seen.add(k);
        if(seen.size>maxStates)return {ticks:-1,path:["LIMITE"],states:seen.size};
        next.push({s:r.state,p:node,lab});
      }
    }
    frontier=next;
  }
  return null;
}

function drawTile(g,x,y,t){
  const X=x*S,Y=y*S;

    if(hash(x,y)>.55)el("path",{d:`M${X+2} ${Y+4+hash(x,y,1)*3} q2 -1.4 4 0 t4 0`,stroke:"#2a6d73","stroke-width":.6,fill:"none","stroke-linecap":"round",opacity:.7},g);

    for(let k=0;k<3;k++)el("circle",{cx:X+1.5+hash(x,y,k)*7,cy:Y+1.5+hash(x,y,k+7)*7,r:.35,fill:"#b8955a"},g);
  }
  if(grassy){
    for(let k=0;k<5;k++){const bx=X+1.2+hash(x,y,k)*7.6,by=Y+3+hash(x,y,k+9)*6;
      el("path",{d:`M${bx} ${by} l-.9 -2.6 M${bx} ${by} l.2 -3.2 M${bx} ${by} l1 -2.4`,stroke:"#5fa257","stroke-width":.55,"stroke-linecap":"round",fill:"none"},g);}
  }
  if(t==="T"){
    el("rect",{x:X,y:Y,width:S,height:S,fill:"#c4a36a"},g);
  }
  if(t===":"){ // areia molhada: guarda pegadas
    el("rect",{x:X,y:Y,width:S,height:S,fill:"#a98b58"},g);
    for(let k=0;k<4;k++)el("circle",{cx:X+1.5+hash(x,y,k)*7,cy:Y+1.5+hash(x,y,k+5)*7,r:.4,fill:"#8f7448"},g);
    el("path",{d:`M${X+1} ${Y+8.6} q2 -.8 4 0 t4 0`,stroke:"#c7ad7c","stroke-width":.4,fill:"none",opacity:.7},g);
  }
  if(t==="="){ // água rasa: base; o estado da maré é desenhado por cima
    el("rect",{x:X,y:Y,width:S,height:S,fill:"#b89c66"},g);

    el("rect",{x:X,y:Y,width:S,height:S,fill:"#cfae74"},g);

    el("path",{d:`M${X+2.6} ${Y+3.6} L${X+5} ${Y+2} L${X+7.6} ${Y+3.2} L${X+5.4} ${Y+4.4} Z`,fill:"#9aa4a0"},g);
  }
  if(t==="f"){ // fresta entre duas rochas
    el("rect",{x:X,y:Y,width:S,height:S,fill:"#cfae74"},g);
    el("path",{d:`M${X} ${Y+1} L${X+3} ${Y+.6} L${X+3.6} ${Y+5} L${X+3} ${Y+9.4} L${X} ${Y+9}Z`,fill:"#7d8784"},g);
    el("path",{d:`M${X+10} ${Y+1} L${X+7} ${Y+.6} L${X+6.4} ${Y+5} L${X+7} ${Y+9.4} L${X+10} ${Y+9}Z`,fill:"#7d8784"},g);
    el("path",{d:`M${X} ${Y+1} L${X+3} ${Y+.6} L${X+3.6} ${Y+5} L${X} ${Y+4}Z M${X+10} ${Y+1} L${X+7} ${Y+.6} L${X+6.4} ${Y+5} L${X+10} ${Y+4}Z`,fill:"#9aa4a0"},g);
  }

    for(let k=0;k<3;k++)el("rect",{x:X,y:Y+2.2+k*2.2,width:S,height:.35,fill:"#4a2f18"},g);
    if(tileAt(L,x-1,y)!=="R")el("path",{d:`M${X} ${Y+1.5} L${X-2.5} ${Y+5} L${X} ${Y+8.5}Z`,fill:"#6b4626"},g);
    if(tileAt(L,x+1,y)!=="R")el("path",{d:`M${X+10} ${Y+1.5} L${X+12} ${Y+2} L${X+10} ${Y+8.5}Z`,fill:"#5a3a1f"},g);
    if(tileAt(L,x-1,y)==="R"&&tileAt(L,x+1,y)==="R"){
      el("rect",{x:X+4.6,y:Y-6,width:.8,height:11,fill:"#3d2614"},g);

  }
  if(t==="Q"){ // poleiro do papagaio
    el("rect",{x:X,y:Y,width:S,height:S,fill:"#c4a36a"},g);
    el("rect",{x:X+4.6,y:Y+4,width:.8,height:4.6,fill:"#5c3a1e"},g);

    el("circle",{cx:X+5.2,cy:Y+1.1,r:1.1,fill:"#e4485d"},g);
    el("path",{d:`M${X+6.1} ${Y+1} l1 .5 l-1 .4z`,fill:"#f2c14e"},g);
    el("circle",{cx:X+5.5,cy:Y+.9,r:.22,fill:"#111"},g);

  }
}

function drawShore(g){ // espuma: contorno claro entre terra e água
  for(let y=0;y<L.H;y++)for(let x=0;x<L.W;x++){
    if(L.tiles[y][x]==="~")continue;
    const X=x*S,Y=y*S;
    const seg=(x1,y1,x2,y2)=>el("line",{x1,y1,x2,y2,stroke:"#e9f4ef","stroke-width":.7,"stroke-linecap":"round",opacity:.55},g);

function loadLevel(i){

  $("lvlNum").textContent=`Fase ${i+1}`;$("lvlName").textContent=LEVELS[i].name;

  buildBoard();renderDynamic();

}
function act(d,x,y){
  if(over||!L)return;
  if(aiming&&!"PXA".includes(d)){aiming=false;renderDynamic();return;}
  const from=state.chars[sel];
  const r=step(L,state,{c:sel,d,x,y});
  if(!r){if(DIRS[d]){state.chars[sel].f=d;renderDynamic();nudge(d);}return;}
  hist.push(state);aiming=false;
  gFx.innerHTML="";
  state=r.state;
  if(r.noise)throwFx(from,r.noise,r.heard||[]);
  if(r.chop)chopFx(r.chop);
  (r.caught||[]).forEach(i=>{const g=state.gs[i];el("circle",{cx:g.x*S+5,cy:g.y*S+6,r:2.4,fill:"none",stroke:"#c9ced1","stroke-width":.5,class:"ripple"},gFx);});
  renderDynamic();
  if(r.result==="ok")return;
  if(r.result==="win"){finishWin();return;}
  over=r.result;
  if(r.info){const m=el("rect",{x:r.info.x*S+.3,y:r.info.y*S+.3,width:S-.6,height:S-.6,rx:1.2,fill:"none",stroke:"#f0525f","stroke-width":1,class:"caught"},gArrows);}
  const kind=r.result==="seen"&&r.info&&r.info.dog?"dog":r.result==="seen"&&r.info&&r.info.print?"print":r.result;
  setTimeout(()=>showLoss(kind),r.info?650:150);
}
function nudge(d){
  const t=tokEls[sel];if(!t)return;const[dx,dy]=DIRS[d],c=state.chars[sel];
  t.style.transform=`translate(${c.x*S+dx*1.2}px,${c.y*S+dy*1.2}px)`;
  setTimeout(()=>{t.style.transform=`translate(${c.x*S}px,${c.y*S}px)`;},110);
}
function undo(){if(!hist.length)return;state=hist.pop();over=null;aiming=false;gFx.innerHTML="";hideOv();renderDynamic();}
function throwFx(a,p,heard){
  const st=el("g",{class:"stone"},gFx);
  el("path",{d:"M-1 .7 L-.6 -.6 L.4 -.9 L1 .1 L.5 .9Z",fill:"#9aa4a0",stroke:"#5e6865","stroke-width":.25},st);
  st.style.transform=`translate(${a.x*S+5}px,${a.y*S+5}px)`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{st.style.transform=`translate(${p.x*S+5}px,${p.y*S+6}px)`;}));
  setTimeout(()=>{el("circle",{cx:p.x*S+5,cy:p.y*S+6,r:1.6,fill:"none",stroke:"#ff9348","stroke-width":.5,class:"ripple"},gFx);
    heard.forEach(i=>{const g=state.gs[i];if(g)el("circle",{cx:g.x*S+5,cy:g.y*S+5,r:2.6,fill:"none",stroke:"#fff4e6","stroke-width":.4,class:"ripple"},gFx);});},300);
}
function chopFx(p){
  for(let k=0;k<6;k++){const a=k*Math.PI/3+.3;
    const c=el("rect",{x:p.x*S+4.6,y:p.y*S+4.6,width:.9,height:.6,rx:.2,fill:k%2?"#d9b07a":"#a8703c",class:"stone"},gFx);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transform=`translate(${Math.cos(a)*3.5}px,${Math.sin(a)*3.5}px)`;c.style.opacity="0";c.style.transition="transform .45s ease-out,opacity .45s ease-in";}));}

function select(i){if(!L||i===sel||i<0||i>=state.chars.length)return;sel=i;aiming=false;renderDynamic();}

function starSvg(){return `<svg viewBox="0 0 24 24"><path class="sf" stroke-width="1.4" stroke-linejoin="round" d="M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.8l-5.8 3.3 1.4-6.4-4.9-4.4 6.5-.7z"/></svg>`;}
function finishWin(){
  over="win";
  const lv=LEVELS[li];
  const coco=(state.got&L.cocoMask)===L.cocoMask&&L.cocoMask!==0;
  const s=[true,coco,coco&&state.t<=lv.par];
  const wasSecret=secretOpen();
  const prev=progress[li]||[false,false,false];
  progress[li]=prev.map((v,k)=>v||s[k]);saveProgress();
  if(li===SECRET_IDX){showEnding(s);return;}
  if(!wasSecret&&secretOpen()){showWinThenReveal(lv,s);return;}
  const last=li>=LEVELS.length-1||(li===FINAL_IDX&&!secretOpen());
  $("resultPanel").innerHTML=`
    <div><div class="eyebrow">Fase ${li+1} · ${lv.name}</div><h2>${li===FINAL_IDX?"Vocês escaparam da ilha!":"A jangada zarpou!"}</h2></div>
    <p>Fuga em ${state.t} tiques. A fuga perfeita pega o coco em até ${lv.par}.</p>
    <div class="stars">
      <div class="star on">${starSvg()}Fugiu da ilha</div>
      <div class="star ${s[1]?"on":""}">${starSvg()}Pegou o coco</div>
      <div class="star ${s[2]?"on":""}">${starSvg()}Fuga perfeita: coco em até ${lv.par} tiques</div>
    </div>
    <div class="row">
      <button class="btn" type="button" data-a="retry">Jogar de novo</button>
      ${last||(li+1===FINAL_IDX&&!finalOpen())?`<button class="btn pri" type="button" data-a="levels">Ver fases</button>`:`<button class="btn pri" type="button" data-a="next">Próxima fase →</button>`}
    </div>
    ${li+1===FINAL_IDX&&!finalOpen()?`<p>Pegue o coco em todas as fases para liberar ${FINAL}. Você tem ${cocosBefore()} de ${FINAL_IDX}.</p>`:""}
    ${last?`<p>Os três estão a salvo. Ainda há segredos para quem fizer todas as fugas perfeitas.</p>`:""}`;
  setTimeout(()=>showOv("ovResult"),380);
}
function showWinThenReveal(lv,s){
  $("resultPanel").innerHTML=`
    <div><div class="eyebrow">Fase ${li+1} · ${lv.name} · fuga perfeita</div><h2>O coco tinha um mapa!</h2></div>
    <p>Dentro da casca, um pedaço de pergaminho dobrado. Doze fugas perfeitas revelaram a última ilha.</p>
    <div class="reveal"><svg viewBox="0 0 200 120" aria-label="Mapa do tesouro">
      <rect x="4" y="4" width="192" height="112" rx="8" fill="#e8d6a8" stroke="#a5814a" stroke-width="2"/>
      <path d="M30 80 Q40 40 80 46 Q120 30 150 52 Q176 70 160 92 Q120 106 80 98 Q40 104 30 80Z" fill="#cfae74" stroke="#8a6a3c" stroke-width="1.5"/>
      <path d="M60 60 q10 -8 20 0 M120 50 q8 -6 16 0" stroke="#3a7136" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path class="mapline" d="M44 84 Q70 70 92 78 T138 66" stroke="#b8322a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <g class="mapx"><path d="M132 60 l12 12 M144 60 l-12 12" stroke="#b8322a" stroke-width="3" stroke-linecap="round"/>
      <text x="100" y="24" text-anchor="middle" font-size="12" font-weight="800" fill="#5c3a1e" font-family="Bricolage Grotesque,Figtree,serif">Ilha da Caveira</text></g>
    </svg></div>
    <div class="row">
      <button class="btn" type="button" data-a="levels">Ver fases</button>
      <button class="btn pri" type="button" data-a="secret">Navegar até lá →</button>
    </div>`;
  setTimeout(()=>showOv("ovResult"),380);
}
function showEnding(s){
  const perfect=s[2];
  if(perfect){try{localStorage.setItem(MESTRE,"1");}catch(e){}}
  $("resultPanel").innerHTML=`
    <div><div class="eyebrow">Ilha da Caveira</div><h2>O navio pirata zarpou!</h2></div>
    <div class="ending"><svg viewBox="0 0 200 110" aria-label="O navio partindo">
      <rect width="200" height="110" fill="#0b2a3a"/>
      <circle cx="160" cy="24" r="10" fill="#f4ecd8"/><circle cx="164" cy="21" r="10" fill="#0b2a3a"/>
      <path d="M0 80 L30 64 L50 72 L60 80Z" fill="#2a3a26"/><text x="30" y="72" font-size="9" fill="#eae2cf">☠</text>
      <g class="sail"><g class="bob">
        <path d="M30 78 L76 78 L68 90 L38 90Z" fill="#6b4626"/>
        <rect x="52" y="44" width="2" height="34" fill="#3d2614"/>
        <path d="M54 46 Q72 58 54 72Z" fill="#eae2cf"/><rect x="54" y="40" width="9" height="5" fill="#1d1414"/>
        <circle cx="42" cy="74" r="3" fill="#2bc2b3"/><circle cx="50" cy="74" r="3" fill="#ff9348"/><circle cx="64" cy="74" r="3" fill="#f2c14e"/>
      </g></g>
      <path d="M0 90 Q25 86 50 90 T100 90 T150 90 T200 90 V110 H0Z" fill="#14506a"/>
      <circle cx="8" cy="76" r="2.4" fill="#f0525f"/><circle cx="16" cy="77" r="2.4" fill="#f0525f"/>
    </svg></div>
    <p>Com o baú do capitão a bordo, os três deixam a ilha no navio dos piratas, que ficam na praia vendo a vela sumir. Fuga em ${state.t} tiques.</p>
    <div class="stars">
      <div class="star on">${starSvg()}Fugiu com o baú</div>
      <div class="star ${s[1]?"on":""}">${starSvg()}Pegou o coco</div>
      <div class="star ${s[2]?"on":""}">${starSvg()}Fuga perfeita: coco em até ${LEVELS[li].par} tiques</div>
    </div>
    ${perfect?`<span class="mestre">★ Mestre da Fuga</span><p>O selo agora aparece no card do Náufragos, no Mesa de Jogos.</p>`:`<p>Faça a fuga perfeita aqui para ganhar o selo de Mestre da Fuga.</p>`}
    <div class="row">
      <button class="btn" type="button" data-a="retry">Jogar de novo</button>
      <button class="btn pri" type="button" data-a="levels">Ver fases</button>
    </div>`;
  setTimeout(()=>showOv("ovResult"),380);
}
function showLoss(kind){
  const T={seen:["Você foi visto!","Um guarda te avistou. Fique fora da área vermelha ou atravesse pelo mato alto."],
           bump:["Trombou com o guarda!","O guarda entrou na sua casa. Observe a seta clara: ela mostra o próximo passo dele."],
           dog:["O cachorro te farejou!","O faro alcança 2 casas em qualquer direção, mesmo no mato e atrás de árvores. Espere ele se afastar."],
           print:["Viram suas pegadas!","O guarda viu uma pegada fresca na areia. Ande pelo mato ou espere 3 tiques antes de ele olhar para lá."],
           parrot:["O papagaio deu o alarme!","Alguém ficou 2 tiques seguidos ao lado do poleiro. Passe pela área verde num tique só e não pare nela."],
           tide:["A maré subiu!","A água rasa encobriu o caminho. Atravesse só enquanto a maré estiver baixa."],
           time:["O navio voltou.","Os piratas chegaram antes da jangada ficar pronta. Procure um caminho mais curto."]}[kind];
  $("resultPanel").innerHTML=`
    <div><div class="eyebrow bad">Fase ${li+1} · ${LEVELS[li].name}</div><h2>${T[0]}</h2></div>
    <p>${T[1]}</p>
    <div class="row">
      <button class="btn pri" type="button" data-a="undo">Desfazer o passo</button>
      <button class="btn" type="button" data-a="retry">Reiniciar</button>
    </div>`;
  showOv("ovResult");
}
function showOv(id){$(id).hidden=false;const b=$(id).querySelector("button");b&&b.focus({preventScroll:true});}
function hideOv(){$("ovResult").hidden=true;$("ovLevels").hidden=true;$("ovHome").hidden=true;}
function openHome(midGame){
  hideOv();aiming=false;
  const played=Object.keys(progress).length>0;
  const stars=Object.values(progress).reduce((n,a)=>n+(a||[]).filter(Boolean).length,0);
  $("homeStats").innerHTML=played?`<span><b>★</b> ${stars} estrelas</span><span>Fugas perfeitas ${perfectCount()}/${TOTAL_LEVELS}</span>`:"";
  $("btnPlay").textContent=(played||midGame)?`Continuar · Fase ${li+1}`:"Começar";
  showOv("ovHome");
}

function openLevels(){
  const grid=$("levelGrid");
  const items=LEVELS.map((lv,i)=>{
    const st=progress[i]||[];
    if(i===SECRET_IDX){if(!secretOpen())return "";return `<button class="lv skull" type="button" data-l="${i}"><span class="n">☠ Secreta</span><b>${lv.name}</b><span class="ss">${[0,1,2].map(k=>`<i class="${st[k]?"on":""}"></i>`).join("")}</span></button>`;}
    if(i===FINAL_IDX&&!finalOpen())return `<button class="lv locked" type="button" disabled><span class="n">Fase ${i+1} · final</span><b>${lv.name}</b><span class="lk">Bloqueada · cocos ${cocosBefore()}/${FINAL_IDX}</span></button>`;
    return `<button class="lv" type="button" data-l="${i}"><span class="n">Fase ${i+1}</span><b>${lv.name}</b><span class="ss">${[0,1,2].map(k=>`<i class="${st[k]?"on":""}"></i>`).join("")}</span></button>`;
  });
  COMING.forEach((n,k)=>items.push(`<button class="lv" type="button" disabled><span class="n">Fase ${LEVELS.length+k+1} · em breve</span><b>${n}</b></button>`));
  $("perfectCount").textContent=`Fugas perfeitas ${perfectCount()}/${TOTAL_LEVELS}`;
  grid.innerHTML=items.join("");
  $("ovLevels").hidden=false;
}

/* ---------- entrada ---------- */
$("resultPanel").addEventListener("click",e=>{
  const a=e.target.closest("button")?.dataset.a;if(!a)return;
  if(a==="undo")undo();else if(a==="retry")reset();else if(a==="next")loadLevel(li+1);else if(a==="levels"){hideOv();openLevels();}else if(a==="secret")loadLevel(SECRET_IDX);
});
$("levelGrid").addEventListener("click",e=>{const b=e.target.closest("button[data-l]");if(b)loadLevel(+b.dataset.l);});
$("ovLevels").addEventListener("click",e=>{if(e.target.id==="ovLevels"&&L)hideOv();});
document.querySelectorAll(".pad button").forEach(b=>b.addEventListener("click",()=>act(b.dataset.d)));
$("btnWait").onclick=()=>act("W");
$("btnRock").onclick=()=>toggleAim("P");
$("btnAxe").onclick=()=>toggleAim("X");
$("btnTrap").onclick=()=>toggleAim("A");
$("crewSeg").addEventListener("click",e=>{const b=e.target.closest("button[data-c]");if(b)select(+b.dataset.c);});
$("btnUndo").onclick=undo;
$("btnReset").onclick=reset;
$("btnLevels").onclick=openLevels;
$("btnHome").onclick=()=>openHome(true);
$("btnPlay").onclick=hideOv;
$("btnHomeLevels").onclick=()=>{hideOv();openLevels();};
document.addEventListener("keydown",e=>{
  const k=e.key;
  if(!$("ovResult").hidden&&over&&over!=="win"&&(k==="z"||k==="Z"||k==="Backspace")){undo();e.preventDefault();return;}
  if(!$("ovResult").hidden||!$("ovLevels").hidden||!$("ovHome").hidden)return;
  const map={ArrowUp:"U",ArrowDown:"D",ArrowLeft:"L",ArrowRight:"R",w:"U",s:"D",a:"L",d:"R",W:"U",S:"D",A:"L",D:"R"};
  if(map[k]){act(map[k]);e.preventDefault();}
  else if(k===" "||k==="."){act("W");e.preventDefault();}
  else if(k==="Tab"){if(state&&state.chars.length>1){select((sel+1)%state.chars.length);e.preventDefault();}}
  else if(k==="1"||k==="2"||k==="3"){select(+k-1);}
  else if(k==="p"||k==="P"){toggleAim("P");}
  else if(k==="x"||k==="X"){toggleAim("X");}
  else if(k==="q"||k==="Q"){toggleAim("A");}
  else if(k==="Escape"&&aiming){aiming=false;renderDynamic();}
  else if(k==="z"||k==="Z"||k==="Backspace"){undo();e.preventDefault();}
  else if(k==="r"||k==="R"){reset();}
});
let pStart=null;
function onPointerDown(e){
  pStart={x:e.clientX,y:e.clientY};
  const up=ev=>{
    window.removeEventListener("pointerup",up);
    if(!pStart)return;
    const dx=ev.clientX-pStart.x,dy=ev.clientY-pStart.y;pStart=null;
    const svg=$("board"),pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;
    const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    const cx=Math.floor(p.x/S),cy=Math.floor(p.y/S);
    if(aiming&&Math.hypot(dx,dy)<=22){
      if(aimTargets().some(q=>q.x===cx&&q.y===cy))act(aiming,cx,cy);else{aiming=false;renderDynamic();}
      return;
    }
    if(Math.hypot(dx,dy)>22){act(Math.abs(dx)>Math.abs(dy)?(dx>0?"R":"L"):(dy>0?"D":"U"));return;}
    // toque: outro personagem seleciona; casa vizinha move
    const other=state.chars.findIndex((o,j)=>j!==sel&&o.x===cx&&o.y===cy);
    if(other>=0){select(other);return;}
    const c=state.chars[sel];
    const ddx=cx-c.x,ddy=cy-c.y;
    if(Math.abs(ddx)+Math.abs(ddy)===1){
      if(chopTargets(L,state,sel).some(q=>q.x===cx&&q.y===cy)){act("X",cx,cy);return;}
      act(ddx===1?"R":ddx===-1?"L":ddy===1?"D":"U");}
    else if(ddx===0&&ddy===0)act("W");
  };
  window.addEventListener("pointerup",up);
}

/* ---------- início ---------- */
function start(data){
  const firstUnplayed=LEVELS.findIndex((_,i)=>!progress[i]&&(i!==FINAL_IDX||finalOpen())&&(i!==SECRET_IDX||secretOpen()));
  loadLevel(data&&Number.isInteger(data.li)?data.li:Math.max(0,firstUnplayed===-1?0:firstUnplayed));
  if(!(data&&Number.isInteger(data.li)))openHome();
}
window.claude?.hot?.snapshot?.(()=>({li}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
