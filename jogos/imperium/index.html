<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140c08">
<title>Imperium</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Conceito: um gabinete romano. Parede de afresco, mapa pintado, papiro para o que chega, cera para o que você ordena. */
:root{
  color-scheme:dark;
  --noite:#140c08;--tinta:#170b04;--pompeia:#7a1c14;--lacre:#8f1f14;
  --ouro:#f0d488;--ouro2:#d4ae5c;--bronze:#a87f2e;--filete:#5a4322;
  --marfim:#f3e7cc;--areia:#e8dabb;--apagado:#cdbd9b;--alerta:#f2a06a;--laranja:#e07b3f;--mar:#1f5560;
  --inscr:"Cinzel","Times New Roman",serif;--texto:"Cardo",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--noite);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{color:var(--marfim);font-family:var(--texto);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{position:relative;height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--pompeia) url(assets/afresco.jpg) center/cover no-repeat}
.ins{font-family:var(--inscr);font-weight:700;letter-spacing:.09em}
.rotulo{font-family:var(--inscr);font-weight:600;font-size:10px;letter-spacing:.1em;color:var(--ouro2)}
.meandro{height:14px;flex:none;background:var(--noite) url(assets/meandro.png) left center/28px 14px repeat-x;border-block:1px solid var(--bronze)}
header.top{flex:none;height:50px;padding:0 max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between}
header.top .marca{font-family:var(--inscr);font-weight:700;font-size:23px;letter-spacing:.12em;color:var(--ouro);text-shadow:0 2px 2px rgba(0,0,0,.65)}
header.top .quando{text-align:right;line-height:1.15}
header.top .quando b{display:block;font-family:var(--inscr);font-size:12px;letter-spacing:.1em}
header.top .quando i{font-size:12.5px;color:#f0dfc0}
.recursos{flex:none;background:var(--noite);padding:7px 12px;display:flex;flex-direction:column;gap:6px}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tres>div{padding:0 8px}.tres>div+div{border-left:1px solid var(--filete)}
.tres .v{font-weight:700;font-size:20px;line-height:1.12}
.tres .s{font-size:11.5px;color:var(--apagado)}
.quente{color:var(--alerta)}.grave{color:#ff8d6e}
.fav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 8px}
.fav .l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--areia)}
.barra{height:4px;background:#3a2a16;margin-top:2px}.barra i{display:block;height:100%;background:#c9a24b}
.barra i.baixo{background:var(--laranja)}
.mapbox{position:relative;flex:none;overflow:hidden;background:var(--mar);border-block:2px solid #c9a24b}
.palco{position:absolute;left:50%;top:50%;width:390px;height:378px;margin:-189px 0 0 -195px;background:url(assets/mapa.jpg) center/100% 100% no-repeat;transform-origin:center}
.rot{position:absolute;transform:translate(-50%,-50%);font-family:var(--inscr);font-weight:700;font-size:8.5px;letter-spacing:.09em;color:#26150a;text-shadow:0 0 3px #efdcae,0 0 3px #efdcae;white-space:nowrap;pointer-events:none}
.mar{position:absolute;transform:translate(-50%,-50%);font-style:italic;font-size:10.5px;letter-spacing:.2em;color:#cfe6dc;white-space:nowrap;pointer-events:none}
.pv{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.pv .n{font-family:var(--inscr);font-weight:700;font-size:9px;letter-spacing:.07em;color:#26150a;text-shadow:0 0 3px #efdcae,0 0 3px #efdcae,0 0 2px #efdcae;white-space:nowrap}
.leg{width:22px;height:22px;border-radius:50%;border:1.5px solid #e6c678;background:#2a120c;color:var(--marfim);font-family:var(--inscr);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.7)}
.pv.tenso .leg{border-color:#ffb36b}.pv.revolta .leg{background:var(--lacre);border-color:#fff4dc;animation:pulso 1.2s infinite}
.pv.fixa{pointer-events:none}
@keyframes pulso{50%{box-shadow:0 0 0 5px rgba(255,160,90,.35)}}
.alerta{position:absolute;transform:translate(-50%,-50%);background:var(--lacre);border:1px solid #f6e3a8;padding:1px 6px;font-size:11px;font-weight:700;color:#fff4dc;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none}
.roma{position:absolute;left:179px;top:158px;transform:translate(-50%,-50%);width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.roma i{width:15px;height:15px;border-radius:50%;background:#5a1a4a;border:2px solid #f6e3a8;box-shadow:0 0 0 1.5px #2a120c,0 2px 4px rgba(0,0,0,.7)}
svg.rotas{position:absolute;inset:0;pointer-events:none}
.despachos{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:7px 12px 6px}
.carta{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:5px 10px;text-align:left;color:var(--tinta);background:#e4cf9f url(assets/papiro-claro.webp) center/640px auto;box-shadow:0 2px 5px rgba(0,0,0,.55)}
.carta img{width:32px;height:32px;flex:none}
.carta span{flex:1;min-width:0}
.carta small{display:block;font-family:var(--inscr);font-weight:700;font-size:10px;letter-spacing:.07em;color:#5a140b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carta b{display:block;font-weight:400;font-size:14.5px;line-height:1.18}
.painel{flex:none;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 10px;background:rgba(20,12,8,.82);border:1px solid var(--filete);font-size:14px;line-height:1.25}
.selos{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.selos div{display:flex;align-items:center}
.selos img{width:38px;height:38px}.selos img+img{margin-left:-3px}
.selos img.novo{animation:carimbo .28s ease-out}
@keyframes carimbo{from{transform:scale(1.5);opacity:.3}}
.btn{min-height:44px;padding:0 14px;background:var(--noite);border:1px solid #e6c678;color:var(--ouro);font-family:var(--inscr);font-weight:700;font-size:12px;letter-spacing:.07em}
.btn:disabled{opacity:.45;cursor:default}
.btn.forte{background:var(--lacre);color:#fff4dc}
.btn.cheio{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
nav{flex:none;height:56px;background:var(--noite);border-top:1px solid var(--bronze);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:#e0d2b4;position:relative}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
nav em{position:absolute;top:5px;left:calc(50% + 7px);min-width:16px;height:16px;border-radius:8px;background:var(--lacre);color:#fff4dc;font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* folhas */
.veu{position:absolute;inset:0;z-index:35;background:rgba(10,5,3,.55);display:flex;flex-direction:column;justify-content:flex-end;animation:surge .16s ease-out}
.veu.cheia{justify-content:flex-start;background:rgba(10,5,3,.86)}
@keyframes surge{from{opacity:0}}
.folha{position:relative;max-height:100%;overflow:auto;background:#1a100a;border-top:2px solid #c9a24b;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:sobe .18s ease-out}
.cheia .folha{height:100%}
@keyframes sobe{from{transform:translateY(24px)}}
.fecha{position:absolute;right:6px;top:6px;width:44px;height:44px;font-size:22px;line-height:1;color:var(--ouro);z-index:2}
.tit{font-family:var(--inscr);font-weight:700;font-size:21px;letter-spacing:.07em;color:var(--ouro);padding-right:40px}
.sub{font-size:14.5px;color:var(--areia);line-height:1.28}
.gov{display:flex;align-items:center;gap:12px}
.gov img{width:82px;height:82px;flex:none}
.cera{background:#2a1a0e url(assets/tabuinha.jpg) center/100% 100% no-repeat;padding:20px 24px;display:flex;flex-direction:column;gap:6px;color:#f0dfb9;text-shadow:0 1px 0 #000;font-size:15px}
.cera h3{font-family:var(--inscr);font-weight:700;font-size:12.5px;letter-spacing:.1em;color:var(--ouro)}
.linha{display:flex;justify-content:space-between;gap:10px}
.linha span:last-child{white-space:nowrap}
.ordem{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;width:100%;padding:6px 10px;background:rgba(0,0,0,.34);border:1px solid #c9a24b;text-align:left;color:#f0dfb9;font-size:14.5px;line-height:1.2}
.ordem small{display:block;font-size:12.5px;color:#d9c9a4}
.ordem:disabled{opacity:.5;cursor:default}
.gr2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#120a05;box-shadow:0 1px 0 #8a6a42}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:26px;margin-top:-12px;background:#d9b45e;border:1px solid #3a2710;border-radius:7px 7px 2px 2px}
input[type=range]::-moz-range-track{height:3px;background:#120a05}
input[type=range]::-moz-range-thumb{width:14px;height:24px;background:#d9b45e;border:1px solid #3a2710;border-radius:7px 7px 2px 2px}
.pilhas{display:flex;flex-wrap:wrap;gap:6px}
.pilha{min-height:44px;padding:0 12px;border:1px solid #c9a24b;color:#f0dfb9;font-size:14px}
.pilha[aria-pressed=true]{background:#c9a24b;color:#1d110a;text-shadow:none;font-weight:700}
.papiro{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;margin:0 auto;width:100%;max-width:400px;padding:26px 28px 24px;color:var(--tinta);background:url(assets/papiro-claro.webp) center/100% 100% no-repeat;overflow:auto}
.papiro .abre{text-align:center;font-family:var(--inscr);font-weight:700;font-size:14px;letter-spacing:.09em;color:#4f1209;line-height:1.3}
.papiro .data{text-align:center;font-size:13.5px;font-style:italic;color:#3f2a14}
.papiro p{font-size:16px;line-height:1.36}
.op{display:block;width:100%;min-height:58px;padding:7px 11px;background:#1d110a;border:1px solid var(--bronze);text-align:left;color:var(--marfim)}
.op b{display:block;font-family:var(--inscr);font-size:12.5px;letter-spacing:.03em;color:var(--ouro)}
.op span{display:block;font-size:13.5px;line-height:1.2;margin-top:2px}
.op:disabled{opacity:.55}
.papiro.ajuda{gap:7px}
.papiro h3{font-family:var(--inscr);font-size:12.5px;letter-spacing:.07em;color:#4f1209;margin-top:2px}
.passos{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:1.32}
.passos li::marker{font-family:var(--inscr);font-weight:700;color:#4f1209}
.tarefas{margin:0;display:flex;flex-direction:column;gap:3px}
.tarefas dt{font-family:var(--inscr);font-weight:700;font-size:12.5px;letter-spacing:.04em;color:#4f1209;margin-top:6px}
.tarefas dt:first-child{margin-top:0}
.tarefas dd{margin:0;font-size:15.5px;line-height:1.3}
.fatos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15.5px;line-height:1.28}
.fatos li{padding-left:15px;position:relative}
.fatos li:before{content:"";position:absolute;left:1px;top:7px;width:7px;height:7px;background:#6b5436;transform:rotate(45deg)}
.fatos li.ok:before{background:#2f6b57}.fatos li.bad:before{background:#a3271a}
.tabela{display:flex;flex-direction:column}
.tabela>div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--filete);font-size:14.5px}
.brasa{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);z-index:40;max-width:320px;padding:8px 14px;background:var(--lacre);border:1px solid #f6e3a8;color:#fff4dc;font-size:14.5px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.6)}
.capa{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(20,12,8,.42)}
.capa h1{font-family:var(--inscr);font-weight:700;font-size:44px;letter-spacing:.11em;color:var(--ouro);text-shadow:0 3px 3px rgba(0,0,0,.7)}
.capa img{width:150px;height:150px}
.voltar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));min-height:44px;display:flex;align-items:center;color:var(--ouro);text-decoration:none;font-size:15px;text-shadow:0 1px 2px #000}
.capa .btn{min-width:230px;min-height:50px;font-size:13px}
@media (max-height:700px){.gov img{width:60px;height:60px}.tabela>div{padding:3px 0}.folha{gap:7px;padding-top:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ========== DADOS ========== */
const EST=['Ver','Aestas','Autumnus','Hiems'],ESTPT=['Primavera','Verão','Outono','Inverno'];
const PV={
 hisp:{nome:'HISPANIA',pt:'Hispânia',rich:29,x:54,y:172,req:{n:'Prata das minas',d:'+45 mil no tesouro',fx:{aer:45}}},
 gall:{nome:'GALLIA',pt:'Gália',rich:26,x:104,y:96,front:'germanos',req:{n:'Ferro e couro',d:'+5 de exército',fx:{exe:5}}},
 afri:{nome:'AFRICA',pt:'África',rich:20,x:206,y:266,grao:1,req:{n:'Azeite',d:'+5 de povo',fx:{pov:5}}},
 aegy:{nome:'AEGYPTVS',pt:'Egito',rich:34,x:324,y:316,grao:1,req:{n:'Linho e papiro',d:'+25 mil no tesouro',fx:{aer:25}}},
 syri:{nome:'SYRIA',pt:'Síria',rich:30,x:360,y:238,front:'partos',req:{n:'Vidro e especiarias',d:'+5 de Senado',fx:{sen:5}}},
};
const IDS=Object.keys(PV);
const ART={hisp:'a',gall:'a',afri:'a',aegy:'o',syri:'a'};
const doP=i=>(ART[i]==='o'?'do ':'da ')+PV[i].pt,aoP=i=>(ART[i]==='o'?'ao ':'à ')+PV[i].pt,noP=i=>(ART[i]==='o'?'no ':'na ')+PV[i].pt;
const VIAG={'hisp-gall':1,'hisp-afri':1,'hisp-aegy':3,'hisp-syri':3,'gall-afri':2,'gall-aegy':3,'gall-syri':3,'afri-aegy':2,'afri-syri':2,'aegy-syri':1};
const viag=(a,b)=>VIAG[a+'-'+b]||VIAG[b+'-'+a]||2;
const ROTA={
 aegy:{costa:{nome:'Costeira',t:2,r:.03,d:'M315 271C296 246 266 232 240 228C222 224 208 214 204 197C196 186 188 172 177 160'},
       mar:{nome:'Alto-mar',t:1,r:.16,d:'M315 271C286 246 246 246 214 228C196 216 190 192 177 160'}},
 afri:{costa:{nome:'Costeira',t:2,r:.02,d:'M162 209C180 222 205 215 204 197C196 186 188 172 177 160'},
       mar:{nome:'Direta',t:1,r:.1,d:'M162 209C168 192 172 176 177 160'}},
};
const GOVN=['Marco Sextílio Varo','Lúcio Cornélio Ático','Públio Vínio Galo','Quinto Hortênsio Naso','Caio Fábio Tusco','Aulo Mânlio Crispo','Tito Lólio Sabino','Gneu Pórcio Severo','Sexto Aurélio Prisco','Décimo Valério Lento','Mânio Acílio Bruto','Sérvio Nônio Rufo','Lúcio Tício Paulo','Caio Ópio Celer'];
const IMPN=['Caio Valério','Tito Valério','Lúcio Valério','Marco Valério','Públio Valério','Quinto Valério','Sexto Valério'];
const AMB={
 pao:{n:'Pão e Circo',d:'Termine o reinado com o povo em 75 ou mais, sem Roma ficar sem pão.',t:s=>`Povo ${r0(s.pov)} de 75`,ok:s=>s.pov>=75&&!s.r.semPao},
 pax:{n:'Pax Romana',d:'Passe 5 anos seguidos sem revolta nem derrota.',t:s=>`${Math.floor(s.paz/4)} de 5 anos de paz`,ok:s=>s.r.pazMax>=20},
 bri:{n:'Conquistar a Britânia',d:'Reúna 10 legiões na Gália e anexe a ilha.',t:s=>s.brit===2?'Britânia anexada':s.brit===1?`Campanha: ${s.britP} de 3 estações`:`${s.prov.gall.leg} de 10 legiões na Gália`,ok:s=>s.brit===2},
 moe:{n:'Moeda Pura',d:'Termine com 600 mil no tesouro, sem nunca reduzir a prata.',t:s=>`Tesouro ${r0(s.aer)} de 600 mil`,ok:s=>s.aer>=600&&!s.r.diluiu},
 obr:{n:'Cidade de Mármore',d:'Conclua 3 grandes obras em Roma.',t:s=>`${s.r.obras} de 3 obras`,ok:s=>s.r.obras>=3},
};
const DEM=[
 {f:'pov',n:'O povo',d:'Termine o ano com 6 meses de pão',ok:s=>s.annona>=6},
 {f:'pov',n:'O povo',d:'Conclua uma obra neste ano',ok:s=>s.y.obra},
 {f:'exe',n:'O exército',d:'Reserve o soldo integral no orçamento',ok:s=>s.budget.soldo>=soldoNec(s)-.5},
 {f:'exe',n:'O exército',d:'Não sofra nenhuma derrota neste ano',ok:s=>!s.y.derrota},
 {f:'sen',n:'O Senado',d:'Termine o ano com 300 mil no tesouro',ok:s=>s.aer>=300},
 {f:'sen',n:'O Senado',d:'Não deixe imposto acima de 15%',ok:s=>IDS.every(i=>s.prov[i].tax<=15)},
];
/* Cartas: cada opção recebe fx(s,l). ig = efeito de não responder. */
const add=(s,o)=>{for(const k in o){if(k==='aer')s.aer+=o.aer;else if(k==='ann')s.annona=Math.max(0,s.annona+o.ann);else s[k]=clamp(s[k]+o[k])}};
const un=(s,id,v)=>{const p=s.prov[id];p.unrest=clamp(p.unrest+v,5)};
const E={
 nilo:{prov:'aegy',cond:s=>s.nile<=13&&s.season===1,tit:'O Nilo subiu menos do que o esperado',txt:s=>`Marcamos ${s.nile} côvados no nilômetro. A próxima colheita será curta e o povo de Alexandria já estoca. Se eu mandar tudo a Óstia, o Egito passa fome antes da cheia. Aguardo tua ordem.`,
  ops:[{t:'Exigir a entrega integral',d:'+3 meses no estoque do Egito. Revolta sobe 18.',fx:s=>{s.prov.aegy.stock+=3;un(s,'aegy',18)}},
       {t:'Comprar grãos da Síria',d:'−40 mil. +3 meses de pão em Roma.',fx:s=>add(s,{aer:-40,ann:3})},
       {t:'Reduzir a cota',d:'Egito calmo (−10). Povo de Roma −3.',fx:s=>{un(s,'aegy',-10);add(s,{pov:-3})}}],
  igt:'o Egito estocou por conta própria.',ig:s=>un(s,'aegy',6)},
 motim:{prov:'gall',urg:s=>s.ratioS<.97,cond:s=>s.ratioS<.97,tit:'As legiões exigem o soldo atrasado',txt:s=>`Os centuriões já não seguram os homens. Falam em não atravessar o Reno enquanto o soldo não vier. Mande prata ou mande ordens claras.`,
  ops:[{t:'Pagar o atrasado',d:'−55 mil. Exército +7.',fx:s=>add(s,{aer:-55,exe:7})},
       {t:'Prometer terras',d:'Exército +3. Senado −6.',fx:s=>add(s,{exe:3,sen:-6})},
       {t:'Punir os cabeças',d:'Exército −7. Senado +4.',fx:s=>add(s,{exe:-7,sen:4})}],
  igt:'o motim no Reno cresceu.',ig:s=>{add(s,{exe:-9});s.prov.gall.threat+=10}},
 pirata:{prov:'hisp',cond:s=>s.pirat===0,tit:'Piratas nas rotas de grãos',txt:s=>`Barcos rápidos saíram das enseadas da Ilíria e já tomaram dois cargueiros. Sem resposta, nenhum capitão vai querer zarpar em alto-mar.`,

 if(revoltas>0)s.paz=0;else s.paz++;s.r.pazMax=Math.max(s.r.pazMax,s.paz);
 if(s.pirat>0)s.pirat--;
 // complô e usurpação
 if(s.sen<32)s.conj+=(32-s.sen)*.8;else s.conj=Math.max(0,s.conj-2);
 ['gall','syri'].forEach(i=>{const p=s.prov[i],g=p.gov;
  if(g.plot===1&&ignorou.has('usurp')){if(s.exe>g.fame+R(-5,15)&&s.exe>50){log('ok',`${g.nome} marchou sobre Roma, mas as legiões o abandonaram.`);add(s,{exe:-10});novoGov(s,i)}else fim(s,'golpe',`${g.nome} marchou com suas legiões e foi aclamado imperador. Sua dinastia terminou.`)}
  else if(!g.plot&&g.fame>=62&&p.leg>=4&&g.loyal<65&&rng()<.35)g.plot=1;
 });
 if(s.conj>=80&&rng()<.5)fim(s,'punhal','Senadores cercaram o imperador na Cúria. Foram 23 punhaladas, e sua dinastia terminou ali.');
 if(s.exe<=8)fim(s,'golpe','As legiões deixaram de obedecer e aclamaram outro imperador. Sua dinastia terminou.');
 if(s.pov<=6)fim(s,'povo','A multidão invadiu o Palatino. Nem a guarda quis defender o imperador.');
 if(s.noBread>=2)fim(s,'pao','Depois de meses sem pão, Roma incendiou os armazéns e derrubou o imperador.');
 if(s.aer<=-220)fim(s,'falencia','O tesouro quebrou. Sem soldo, a guarda abriu as portas do palácio aos conspiradores.');
 if(revoltas>=3)fim(s,'colapso','Três províncias se separaram ao mesmo tempo. O império ruiu sob seu governo.');
 // tempo
 s.t++;s.r.favSum+=(s.sen+s.pov+s.exe)/3;s.r.favN++;
 let viraAno=false;s.season++;if(s.season>3){s.season=0;s.year++;viraAno=true}
 if(s.season===0){s.prov.aegy.stock=Math.min(18,s.prov.aegy.stock+colheita(s.nile));log('info',`Colheita do Egito: ${fmt1(colheita(s.nile))} meses de grãos no estoque.`)}
 if(s.season===1){const c=R(4,5.5);s.prov.afri.stock=Math.min(10,s.prov.afri.stock+c);s.nile=nilo();log('info',`Colheita da África: ${fmt1(c)} meses. O nilômetro marca ${s.nile} côvados.`)}
 if(viraAno&&!s.over){
  if(s.prov.aegy.stock<2){un(s,'aegy',18);log('bad','O Egito ficou sem reserva de grãos. Revolta sobe.')}
  if(s.prov.afri.stock<1){un(s,'afri',10);log('bad','A África ficou sem reserva de grãos. Revolta sobe.')}
  s.demands.forEach(i=>{const d=DEM[i];const nom=d.n;if(d.ok(s)){add(s,{[d.f]:8});s.r.dem++;log('ok',`${nom} está satisfeito: "${d.d}". +8.`)}else{add(s,{[d.f]:-6});log('bad',`${nom} cobra: "${d.d}". −6.`)}});
  pedidos(s);s.budgetDue=true;
  if(s.year-s.start>=s.vida){s.fase='sucessao';s.vered=veredito(s)}
 }
 s.seals=3;if(s.fase==='jogo')cartas(s);
 s.lastRep=L;return L;
}
const nilo=()=>{const x=rng();return x<.12?12:x<.3?13:x<.55?14:x<.8?15:x<.95?16:17};

const fmt1=v=>(Math.round(v*10)/10).toString().replace('.',',');
function veredito(s){
 const fav=s.r.favSum/Math.max(1,s.r.favN),amb=s.amb&&AMB[s.amb].ok(s);
 let t,d;
 if(amb&&fav>=48){t='Pater Patriae';d='Pai da Pátria. Cumpriu o que jurou e deixou Roma em ordem.'}
 else if(s.amb==='bri'&&amb||s.brit===2){t='O Conquistador';d='Ampliou as fronteiras, a um preço que os cronistas ainda discutem.'}
 else if(s.sen<28){t='O Tirano';d='Governou pelo medo. O Senado comemorou sua morte.'}
 else if(fav<36){t='Damnatio Memoriae';d='Seu nome foi raspado dos monumentos.'}
 else if(amb){t='O Fiel';d='Cumpriu a palavra, mas deixou feridas abertas.'}
 else if(s.aer>=400){t='O Prudente';d='Não fez história, mas deixou os cofres cheios.'}
 else{t='O Sobrevivente';d='Morreu na própria cama, o que já é uma vitória em Roma.'}
 const pts=Math.round((amb?40:0)+fav*.5+s.r.dem*1.5+(s.brit===2?8:0)-(t==='Damnatio Memoriae'?15:0));
 return{t,d,amb,pts,nome:s.emp.nome};
}
function herdeiros(s){return s.herd||(s.herd=[{t:'Soldado',d:'Exército +12, Senado −4',fx:{exe:12,sen:-4}},{t:'Orador',d:'Senado +12, povo +2',fx:{sen:12,pov:2}},{t:'Generoso',d:'Povo +12, −60 mil',fx:{pov:12,aer:-60}}].sort(()=>rng()-.5).slice(0,2))}
function suceder(i){const s=S,h=herdeiros(s)[i],v=s.vered;s.hist.push(v);s.score+=v.pts;
 if(s.n>=5){s.fase='fim';s.over={vitoria:true,txt:'O quinto imperador morreu no trono. Sua dinastia entrou para a história.'};return}
 add(s,h.fx);s.n++;s.emp={nome:IMPN[s.n-1],idade:Ri(30,42)};s.start=s.year;s.vida=Ri(9,11);s.r={obras:0,semPao:false,diluiu:false,pazMax:0,dem:0,favSum:0,favN:0};s.paz=0;s.amb=null;s.ambOps=sorteiaAmb();s.herd=null;s.vered=null;s.fase='ambicao';cartas(s)}
const estrelas=s=>{const m=s.score/Math.max(1,s.hist.length);return m>=62?'Gloriosa':m>=48?'Lembrada':m>=34?'Discutida':'Esquecida'};

 <div><span>Soldo no orçamento</span><b>${S.budget.soldo} de ${soldoNec(S)} mil</b></div><div><span>Pão no orçamento</span><b>${S.budget.pao} de ${paoNec(S)} mil</b></div><div><span>Obras</span><b>${S.budget.obras} mil · ${r0(S.obrasP/135*100)}% da próxima</b></div>
 ${S.divida?`<div><span>Empréstimo</span><b>20 mil por ${S.divida} estações</b></div>`:''}
 <div><span>Prata do denário</span><b class="${S.pur<100?'quente':''}">${S.pur}% · inflação ${fmt1(S.infl)}%</b></div></div>
 <div class="cera"><h3>ORDEM DO TESOURO</h3><button class="ordem" data-a="diluir"><span>Reduzir a prata do denário<small>+90 mil agora. A inflação chega nos anos seguintes</small></span></button></div></div></div>`}
function fOrcamento(){const f=U.f,rp=rendaPrev(S)*4,tot=f.so+f.pa+f.ob;const sobra=rp-tot;
 return `<div class="veu"><div class="folha"><div class="tit">ORÇAMENTO DO ANO</div><div class="sub">Tesouro de ${r0(S.aer)} mil e cerca de ${r0(rp)} mil em impostos previstos. O que não for reservado fica no tesouro.</div>
 <div class="cera"><div class="linha"><span>Soldo das legiões</span><span id="v_so">${f.so} de ${soldoNec(S)}</span></div><input id="so" type="range" min="200" max="${soldoNec(S)+60}" step="10" value="${f.so}" aria-label="Soldo" data-i="so">
 <div class="linha"><span>Pão de Roma</span><span id="v_pa">${f.pa} de ${paoNec(S)}</span></div><input id="pa" type="range" min="30" max="${paoNec(S)+40}" step="5" value="${f.pa}" aria-label="Pão" data-i="pa">
 <div class="linha"><span>Obras públicas</span><span id="v_ob">${f.ob}</span></div><input id="ob" type="range" min="0" max="200" step="10" value="${f.ob}" aria-label="Obras" data-i="ob">
 <div class="linha"><span>Saldo previsto no ano</span><span id="v_sb" class="${sobra<0?'quente':''}">${sobra>=0?'+':'−'}${Math.abs(r0(sobra))} mil</span></div></div>
 <button class="btn forte cheio" data-a="orcar">APROVAR ORÇAMENTO</button></div></div>`}
function fLegioes(){const[...lin]=IDS.map(i=>{const p=S.prov[i];return `<div><span>${PV[i].pt}${PV[i].front?` · ${ameacaTxt(p)}`:''}</span><b>${p.leg}</b></div>`});
 const tr=S.moves.map(m=>`<div><span>${m.de?PV[m.de].pt+' para ':'Recrutas para '}${PV[m.para].pt}</span><b>${m.n} · ${m.left} est.</b></div>`).join('');
 return `<div class="veu"><div class="folha">${fecha}<div class="tit">LEGIÕES</div><div class="tabela">${lin.join('')}<div><span>Ilírico · Danúbio (fixas)</span><b>${S.danubio}</b></div>${tr}</div>
 <div class="cera"><h3>RECRUTAR · 60 MIL E 1 SELO</h3><div class="pilhas">${IDS.map(i=>`<button class="pilha" data-a="recrutar" data-v="${i}">${PV[i].pt}</button>`).join('')}</div>
 ${S.brit===0?`<button class="ordem" data-a="britania" ${S.prov.gall.leg<10?'disabled':''}><span>Invadir a Britânia<small>−120 mil. Exige 10 legiões na Gália por 3 estações</small></span></button>`:''}</div></div></div>`}
function fSenado(){const a=S.amb?AMB[S.amb]:null;
 return `<div class="veu"><div class="folha">${fecha}<div class="tit">ROMA</div>
 <div class="gov" style="gap:10px"><img src="${camEmp}" alt="" style="width:64px;height:64px"><div class="sub"><b>${S.emp.nome}</b>, ${S.n}º imperador de 5<br>${S.year-S.start} anos de reinado</div></div>
 ${a?`<div><div class="rotulo">AMBIÇÃO JURADA</div><div class="ins" style="font-size:14px;color:var(--ouro);margin-top:2px">${a.n}</div><div class="sub">${esc(a.d)} <b>${esc(a.t(S))}.</b></div></div>`:''}
 <div><div class="rotulo">PEDIDOS DESTE ANO</div><div class="tabela">${S.demands.map(i=>`<div><span>${esc(DEM[i].n)}: ${esc(DEM[i].d)}</span><b>${DEM[i].ok(S)?'Em dia':'Pendente'}</b></div>`).join('')}</div></div>
 ${S.hist.length?`<div><div class="rotulo">CRÔNICA DA DINASTIA</div><div class="tabela">${S.hist.map(h=>`<div><span>${h.nome}</span><b>${h.t}</b></div>`).join('')}</div></div>`:''}
 <div class="cera"><h3>ORDENS DE ROMA</h3><button class="ordem" data-a="jogos"><span>Promover jogos no Circo<small>−40 mil. Povo +7. Gasta 1 selo</small></span></button></div>
 <div class="gr2"><button class="btn" data-a="ajuda">COMO JOGAR</button><button class="btn" data-a="reinicio">RECOMEÇAR</button></div></div></div>`}
function fRelatorio(){return `<div class="veu cheia"><div class="folha" style="background:transparent;border:0;padding:8px"><article class="papiro"><div class="abre">ACTA DIVRNA</div><div class="data">${ESTPT[S.season]} do ano ${rom(S.year+753)}</div>
 <ul class="fatos">${S.lastRep.map(x=>`<li class="${x.k}">${esc(x.t)}</li>`).join('')}</ul></article><button class="btn forte cheio" style="margin-top:8px" data-a="seguir">CONTINUAR</button></div></div>`}
const AJUDA=[
 {t:'O OBJETIVO',h:`<p><b>Você é César.</b> Vença fazendo <b>5 imperadores seguidos</b> morrerem no trono.</p>
 <p>Cada imperador reina cerca de 10 anos e jura uma ambição. Cumprir a ambição melhora a nota da dinastia, mas o que garante a vitória é continuar vivo.</p>
 <h3>Você perde se</h3>
 <ul class="fatos"><li>Roma ficar sem pão por 2 estações seguidas.</li><li>O tesouro passar de 220 mil negativos.</li><li>O povo ou o exército chegar perto de zero.</li><li>O Senado ficar muito baixo e um complô avançar.</li><li>3 províncias estiverem em revolta ao mesmo tempo.</li><li>Um general marchar sobre Roma sem ser contido.</li></ul>`},
 {t:'COMO JOGAR UMA ESTAÇÃO',h:`<p>O ano tem 4 estações. Repita estes passos em cada uma:</p>
 <ol class="passos"><li><b>Na primavera, aprove o orçamento.</b> Divida o dinheiro do ano entre soldo, pão e obras.</li>
 <li><b>Confira o topo da tela.</b> Veja quantos meses de pão restam, o tesouro e os favores.</li>
 <li><b>Gaste até 3 selos.</b> Cada resposta a uma carta ou ordem em uma província custa 1 selo.</li>
 <li><b>Toque em Encerrar estação.</b> Leia o relatório do que aconteceu e siga para a próxima.</li></ol>
 <p>Carta sem resposta tem consequência ao fim da estação. Selo que sobra não passa para a seguinte.</p>`},
 {t:'COMO FAZER CADA TAREFA',h:`<dl class="tarefas"><dt>Alimentar Roma</dt><dd>Roma consome 3 meses de pão por estação. Toque no Egito ou na África, depois em Enviar frota. Evite navegar no inverno.</dd>
 <dt>Defender as fronteiras</dt><dd>Toque em uma província, depois em Mover legiões. A marcha leva de 1 a 3 estações, então reaja assim que surgir Ataque iminente.</dd>
 <dt>Fazer caixa</dt><dd>Toque em uma província para subir o imposto ou requisitar mercadorias. As duas ordens aumentam a revolta.</dd>
 <dt>Vigiar os governadores</dt><dd>Se a frota chegar mais leve ou as contas não fecharem, toque na província e envie um auditor.</dd></dl>`},
];
function fAjuda(){const p=(U.f&&U.f.p)||0,a=AJUDA[p],ult=p===AJUDA.length-1;
 return `<div class="veu cheia"><div class="folha" style="background:transparent;border:0;padding:8px"><button class="fecha" style="color:#4f1209;right:14px;top:14px" data-a="fechar" aria-label="Fechar instruções">×</button><article class="papiro ajuda"><div class="data">Instruções ao novo César · ${p+1} de ${AJUDA.length}</div><h2 class="abre">${a.t}</h2>${a.h}</article>
 <div class="gr2" style="margin-top:8px">${p===0?'<button class="btn" data-a="fechar">FECHAR</button>':`<button class="btn" data-a="ajp" data-v="${p-1}">VOLTAR</button>`}<button class="btn forte" data-a="${ult?'fechar':'ajp'}" data-v="${p+1}">${ult?'ENTENDI':'PRÓXIMO'}</button></div></div></div>`}
function fAmbicao(){return `<div class="veu cheia"><div class="folha"><div class="gov"><img src="${camEmp}" alt=""><div><div class="tit" style="padding:0">${S.emp.nome.toUpperCase()}</div><div class="sub">${S.n}º imperador da dinastia. Diante do Senado, jure sua ambição.</div></div></div>
 <div style="display:flex;flex-direction:column;gap:8px">${S.ambOps.map(k=>`<button class="op" data-a="jurar" data-v="${k}" style="min-height:76px"><b>${AMB[k].n}</b><span style="font-size:14.5px">${esc(AMB[k].d)}</span></button>`).join('')}</div></div></div>`}
function fSucessao(){const v=S.vered;return `<div class="veu cheia"><div class="folha"><div class="gov"><img src="${camEmp}" alt=""><div><div class="sub">Morreu ${v.nome}, no trono.</div><div class="tit" style="padding:0">${v.t.toUpperCase()}</div></div></div>
 <div class="sub">${esc(v.d)} ${v.amb?'Ambição cumprida.':'A ambição jurada ficou pelo caminho.'} Nota do reinado: ${v.pts}.</div>
 <div class="rotulo">ESCOLHA O HERDEIRO</div><div style="display:flex;flex-direction:column;gap:8px">${herdeiros(S).map((h,i)=>`<button class="op" data-a="herd" data-v="${i}"><b>${h.t}</b><span>${h.d}</span></button>`).join('')}</div></div></div>`}
function fFim(){const o=S.over,c=S.hist;return `<div class="veu cheia"><div class="folha"><div class="tit" style="padding:0">${o.vitoria?'DINASTIA COMPLETA':'FIM DA DINASTIA'}</div><div class="sub">${esc(o.txt)}</div>
 <div class="tabela">${c.map(h=>`<div><span>${h.nome}</span><b>${h.t}</b></div>`).join('')}${o.vitoria?'':`<div><span>${S.emp.nome}</span><b>Deposto</b></div>`}</div>
 <div class="ins" style="font-size:15px;color:var(--ouro)">${o.vitoria?`A HISTÓRIA A CHAMA: ${estrelas(S).toUpperCase()}`:`${c.length} DE 5 IMPERADORES`}</div>
 <button class="btn forte cheio" data-a="novo">NOVA DINASTIA</button></div></div>`}
function capa(){const tem=carregar();return `<div class="capa"><a class="voltar" href="../../">← Mesa de Jogos</a><img src="assets/camafeu4.webp" alt=""><h1>IMPERIVM</h1><p class="sub" style="max-width:300px;color:var(--marfim);font-size:16px">Roma é sua. Faça cinco imperadores morrerem no trono.</p><button class="btn forte" data-a="novo">NOVA DINASTIA</button>${tem&&!tem.over?`<button class="btn" data-a="cont">CONTINUAR</button>`:''}<button class="btn" data-a="ajudaC">COMO JOGAR</button></div>`}
function folha(){
 if(!S)return'';
 if(S.fase==='fim')return fFim();if(S.fase==='sucessao')return fSucessao();
 if(U.f&&U.f.t==='rel')return fRelatorio();
 if(U.f&&U.f.t==='ajuda')return fAjuda();
 if(S.fase==='ambicao')return fAmbicao();
 if(S.budgetDue){if(!U.f||U.f.t!=='orc')U.f={t:'orc',so:S.budget.soldo,pa:S.budget.pao,ob:S.budget.obras};return fOrcamento()}
 if(!U.f)return'';
 const t=U.f.t;return({prov:()=>fProv(U.f.id),frota:fFrota,mover:fMover,cartas:fCartas,carta:()=>fCarta(U.f.i),tesouro:fTesouro,legioes:fLegioes,senado:fSenado,ajuda:fAjuda}[t]||(()=>''))();
}
function morph(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
 if(a.nodeType===3||a.nodeType===8){if(a.data!==b.data)a.data=b.data;return}
 if(a.nodeType!==1)return;
 for(const n of [...a.attributes])if(!b.hasAttribute(n.name))a.removeAttribute(n.name);
 for(const n of [...b.attributes])if(a.getAttribute(n.name)!==n.value)a.setAttribute(n.name,n.value);
 if(a.nodeName==='INPUT'&&a.value!==b.getAttribute('value'))a.value=b.getAttribute('value');
 morphFilhos(a,b);
}
function morphFilhos(a,b){
 const x=[...a.childNodes],y=[...b.childNodes];
 y.forEach((n,i)=>{if(x[i])morph(x[i],n);else a.appendChild(n.cloneNode(true))});
 x.slice(y.length).forEach(n=>n.remove());
}
function pintar(html){const t=document.createElement('div');t.innerHTML=html;morphFilhos(app,t)}
function render(){
 if(!app)return;
 if(U.capa){pintar((U.f&&U.f.t==='ajuda'?capa()+fAjuda():capa())+brasa());return}
 pintar(topo()+recursos()+mapa()+despachos()+nav()+folha()+brasa());
 ajustar();
}
const brasa=()=>U.toast?`<div class="brasa" role="status">${esc(U.toast)}</div>`:'';
function ajustar(){const mb=document.getElementById('mb'),pl=document.getElementById('pl');if(!mb)return;
 const w=app.clientWidth,H=app.clientHeight,fixo=50+14+92+56+4;const minD=118;
 const h=Math.min(w*378/390,H-fixo-minD);mb.style.height=Math.max(170,h)+'px';
 const hh=mb.clientHeight,s=Math.min(w/390,hh/378);pl.style.transform=`scale(${s})`;
 const d=H-fixo-mb.clientHeight;if(Math.abs((window.__altDesp||0)-d)>1){const era=window.__altDesp;window.__altDesp=d;if((era>=190)!==(d>=190)){render();return}}
 document.querySelectorAll('.navio').forEach(n=>{const p=document.getElementById(n.dataset.r);if(!p)return;const pt=p.getPointAtLength(p.getTotalLength()*Math.max(0,Math.min(1,+n.dataset.p)));n.setAttribute('transform',`translate(${pt.x} ${pt.y})`)});
}
if(app){
 app.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;const h=H[a];if(h)h(v)});
 app.addEventListener('input',ev=>{const k=ev.target.dataset.i;if(!k||!U.f)return;const n=+ev.target.value;const set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
  if(k==='tax'){U.f.tax=n;set('tv',n+'%');const bt=document.getElementById('btax');if(bt){bt.hidden=n===S.prov[U.f.id].tax;bt.textContent=`Selar imposto de ${n}%`}}
  if(k==='cargo'){U.f.cargo=n;set('cv',n+' meses')}
  if(k==='n'){U.f.n=n;set('nv',n)}
  if(['so','pa','ob'].includes(k)){U.f[k]=n;set('v_so',U.f.so+' de '+soldoNec(S));set('v_pa',U.f.pa+' de '+paoNec(S));set('v_ob',U.f.ob);const sb=rendaPrev(S)*4-U.f.so-U.f.pa-U.f.ob;const e=document.getElementById('v_sb');if(e){e.textContent=(sb>=0?'+':'−')+Math.abs(r0(sb))+' mil';e.className=sb<0?'quente':''}}
 });
 addEventListener('resize',()=>{if(!U.capa)ajustar()});
}
const H={
 novo(){apagar();newGame();U={f:{t:'ajuda',p:0},capa:false,toast:null};salvar();render()},
 cont(){S=carregar();U={f:null,capa:false,toast:null};render()},
 ajudaC(){U.f={t:'ajuda',p:0};render()},ajuda(){U.f={t:'ajuda',p:0};render()},
 ajp(v){U.f={t:'ajuda',p:+v};render()},
 reinicio(){U.capa=true;U.f=null;render()},
 fechar(){U.f=null;render()},
 nav(v){U.f=v==='mapa'?null:{t:v};render()},
 abrir(v){U.f={t:'prov',id:v};render()},
 selarTax(v){const t=U.f.tax;feito(A.tax(v,t),`Imposto ${doP(v)} fixado em ${t}%.`,{t:'prov',id:v})},
 frota(v){const p=S.prov[v];U.f={t:'frota',id:v,cargo:Math.min(5,Math.max(1,Math.floor(p.stock))),rota:'costa',esc:false};render()},
 rota(v){U.f.rota=v;render()},escolta(){U.f.esc=!U.f.esc;render()},
 zarpar(){const f=U.f;feito(A.fleet(f.id,Math.min(f.cargo,Math.floor(S.prov[f.id].stock)),f.rota,f.esc),'A frota zarpou.')},
 req(v){feito(A.req(v),'Requisição enviada. Chega na próxima estação.',{t:'prov',id:v})},
 audit(v){feito(A.audit(v),r=>r.rec?`Auditor recuperou ${r.rec} mil.`:'Nada de grave foi encontrado.',{t:'prov',id:v})},
 trocar(v){feito(A.trocar(v),'Novo governador nomeado.',{t:'prov',id:v})},
 reprimir(v){feito(A.reprimir(v),'Revolta esmagada.',{t:'prov',id:v})},
 mover(v){U.f={t:'mover',de:v,para:null,n:1};render()},
 dest(v){U.f.para=v;render()},
 marchar(){const f=U.f;feito(A.mover(f.de,f.para,f.n),'As legiões marcharam.')},
 recrutar(v){feito(A.recrutar(v),`Nova legião a caminho ${doP(v)}.`,{t:'legioes'})},
 britania(){feito(A.britania(),'As legiões embarcam para a Britânia.')},
 diluir(){feito(A.diluir(),'Nova cunhagem em circulação.',{t:'tesouro'})},
 jogos(){feito(A.jogos(),'O Circo Máximo ruge seu nome.',{t:'senado'})},
 carta(v){U.f={t:'carta',i:+v};render()},
 resp(v){const[i,o]=v.split(':').map(Number);const res=A.responder(i,o);if(res===true){U.f=S.letters.length?{t:'cartas'}:null;salvar();render()}else toast(erro(res))},
 orcar(){const f=U.f;A.orcar(f.so,f.pa,f.ob);U.f=null;salvar();render()},
 jurar(v){A.ambicao(v);U.f=null;salvar();render()},
 herd(v){suceder(+v);U.f=null;salvar();render()},
 fim(){resolver();U.f={t:'rel'};salvar();render()},
 seguir(){U.f=null;render()},
};
if(typeof window!=='undefined'){window.IMP={get S(){return S},render,U:()=>U,A,newGame,resolver,suceder,E,AMB,DEM,soldoNec,paoNec,rendaPrev,setRng:f=>{rng=f}};}
if(app&&!(typeof window!=='undefined'&&window.__NOUI)){const go=()=>render();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);go()}
</script>
