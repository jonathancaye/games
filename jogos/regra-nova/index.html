<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c120c">
<title>Regra Nova</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --mesa:#1c120c;--madeira:#3d2617;--madeira2:#5b3a22;--feltro:#1d6a4b;--feltro2:#15533a;
  --via:#f7e588;--via2:#efd766;--tinta:#2f2378;--carimbo:#c4182c;--giz:#f6f4e8;
  --nos:#2bc2b3;--eles:#ff9348;--apagado:#c9b8a4;
  --slab:"Alfa Slab One",Rockwell,Georgia,serif;--maquina:"Courier Prime","Courier New",Courier,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mesa);color:var(--giz);font-family:var(--maquina);font-size:16px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--nos);outline-offset:2px}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--mesa)}
.tela{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom))}

/* ---------- papel ---------- */
.mesa-fundo{background:radial-gradient(120% 90% at 50% 30%,var(--feltro),var(--feltro2) 70%,#0f3f2c)}
.via{position:relative;background:var(--via);color:var(--tinta);padding:14px 14px;box-shadow:0 1px 0 #fff6 inset,0 14px 30px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(47,35,120,.08) 27px 28px)}
.via h2{font:400 21px/1.1 var(--slab);margin:0}
.timbre{font-size:13px;line-height:1.3;margin:0 0 10px;border-bottom:2px solid var(--tinta);padding-bottom:8px}
.btn{display:block;width:100%;min-height:50px;padding:12px 14px;background:var(--carimbo);color:#fff;font:400 18px/1.1 var(--slab);box-shadow:0 4px 0 #7c0d1b;border-radius:3px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7c0d1b}
.btn[disabled]{background:#8f8468;box-shadow:0 4px 0 #5f5845;cursor:default;opacity:.75}
.btn.sec{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor;font:700 16px var(--maquina)}
.btn.sec:active{transform:none;box-shadow:inset 0 0 0 2px currentColor}
.carimbo{position:absolute;font:400 22px/1 var(--slab);color:var(--carimbo);border:4px solid var(--carimbo);padding:7px 11px 6px;border-radius:5px;transform:rotate(-10deg);opacity:.88;mix-blend-mode:multiply;pointer-events:none;white-space:nowrap}
.carimbo.bate{animation:bate .2s cubic-bezier(.2,.9,.3,1) both}
@keyframes bate{from{transform:rotate(-10deg) scale(2.6);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:.88}}
.treme{animation:treme .22s linear}
@keyframes treme{25%{transform:translate(1px,2px)}60%{transform:translate(-2px,-1px)}}

/* ---------- abertura ---------- */
#t-abertura{justify-content:center;gap:16px}
.capa{transform:rotate(-1.4deg);padding:22px 18px 56px}
.capa .timbre{font-size:14px}
.capa h1{font:400 clamp(58px,19vw,86px)/.92 var(--slab);margin:12px 0 8px;letter-spacing:-.01em}
.capa p{margin:8px 0 0;font-size:16px;line-height:1.35}
.capa .carimbo{right:14px;bottom:12px;font-size:15px}
.botao{position:absolute;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff7,transparent 42%),var(--c);box-shadow:inset 0 0 0 6px #0002,inset 0 0 0 8px #fff5,0 8px 12px #0007}
.acoes{display:flex;flex-direction:column;gap:12px}
.rodape{text-align:center;font-size:13px;color:#dcebdf}
.rodape a{color:inherit}
.rodape p{margin:6px 0 0;opacity:.85}

/* ---------- súmula / resultado / fim ---------- */
.folha{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px}
.duelo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.duelo div{flex:1;font:400 18px/1.1 var(--slab)}
.duelo div:last-child{text-align:right}
.duelo b{font:700 14px var(--maquina)}
.artigos{margin:10px 0 0;padding:0;list-style:none;font-size:15px;line-height:1.28}
.artigos li{padding:7px 0;border-top:1px dashed rgba(47,35,120,.4)}
.artigos strong{display:block}
.nota{font-size:15px;line-height:1.35;margin:10px 0 0}
.fichas{display:inline-flex;gap:5px;vertical-align:-2px}
.fichas i{width:14px;height:14px;border-radius:50%;background:var(--carimbo)}
.fichas i.gasta{background:none;box-shadow:inset 0 0 0 2px var(--carimbo);opacity:.55}
.placar-final{font:400 66px/1 var(--slab);text-align:center;margin:14px 0 4px}

/* ---------- circular ---------- */
.circ-nota{margin:0 0 8px}
.opcao{display:grid;grid-template-columns:30px 1fr;gap:4px;width:100%;text-align:left;padding:8px 0;border-top:1px dashed rgba(47,35,120,.45);color:var(--tinta)}
.opcao .x{width:22px;height:22px;margin-top:1px;border:2px solid var(--tinta);display:grid;place-items:center;font:700 22px/1 var(--maquina);color:var(--carimbo)}
.opcao strong{display:block;font:400 16px/1.15 var(--slab)}
.opcao span.e{display:block;font-size:15px;line-height:1.25;margin-top:3px}
.opcao em{display:block;font-size:14px;line-height:1.22;margin-top:3px;opacity:.82}
.opcao .ti{font-size:13px;font-weight:700}

/* ---------- partida ---------- */
#t-partida{padding:0;background:var(--mesa)}
.placar{display:grid;grid-template-columns:34px 1fr auto 1fr;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:var(--madeira);box-shadow:inset 0 -2px 0 #0005}
.placar .sair{height:34px;font-size:20px;color:var(--apagado)}
.time{font:700 14px/1.05 var(--maquina);overflow:hidden;display:flex;align-items:center;gap:6px;min-width:0}
.time span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time.b{justify-content:flex-end;text-align:right}
.time i{flex:none;width:12px;height:12px;border-radius:50%}
.time.vez{color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.nums{display:flex;align-items:center;gap:4px}
.nums b{min-width:36px;height:42px;display:grid;place-items:center;font:400 28px/1 var(--slab);background:#120b07;color:var(--giz);border-radius:3px;box-shadow:inset 0 -21px 0 #fff1,inset 0 0 0 1px #0008}
.nums u{text-decoration:none;font-size:12px;width:30px;text-align:center;line-height:1;color:var(--apagado)}
#palco{flex:1;min-height:0;display:grid;place-items:center;position:relative;overflow:hidden}
#campo{display:block;touch-action:none}
.dica{min-height:26px;padding:3px 10px;text-align:center;font-size:14.5px;font-weight:700;line-height:1.2;color:var(--giz);display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 10px calc(8px + env(safe-area-inset-bottom));scrollbar-width:none;min-height:40px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:28px;padding:0 9px;background:var(--via);color:var(--tinta);font:700 13px var(--maquina);border-radius:2px;white-space:nowrap}
.chips button.vazio{background:none;color:var(--apagado);box-shadow:inset 0 0 0 1px #fff3}
.faixa{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:4;text-align:center;padding:14px 12px;pointer-events:none;background:rgba(18,11,7,.88);animation:faixa .22s ease-out both}
.faixa b{display:block;font:400 clamp(36px,12vw,52px)/1 var(--slab)}
.faixa span{display:block;margin-top:6px;font-size:15px;font-weight:700}
.faixa.doc b{font-size:26px}
@keyframes faixa{from{clip-path:inset(50% 0)}to{clip-path:inset(0 0)}}

/* ---------- gaveta ---------- */
#gaveta{position:absolute;inset:0;z-index:10;background:rgba(10,6,4,.72);display:flex;flex-direction:column;justify-content:flex-end;padding:40px 12px calc(12px + env(safe-area-inset-bottom))}
#gaveta .via{max-height:100%;display:flex;flex-direction:column;min-height:0}
#gaveta .artigos,#gaveta .lista{overflow-y:auto;min-height:0}
#gaveta .btn{margin-top:12px}
input.nome{width:100%;font:700 18px var(--maquina);color:var(--tinta);background:#fff8;border:0;border-bottom:2px solid var(--tinta);padding:9px 6px;margin-top:6px;-webkit-user-select:text;user-select:text;border-radius:0}
.inv{padding:8px 0;border-top:1px dashed rgba(47,35,120,.4);font-size:15px;line-height:1.25}
.inv strong{display:block}
@media (max-height:680px){.circ-nota{display:none}}
@media (prefers-reduced-motion:reduce){.carimbo.bate,.treme,.faixa{animation:none}}
</style>
</head>
<body>
<div id="app">
  <section class="tela mesa-fundo" id="t-abertura"></section>
  <section class="tela mesa-fundo" id="t-doc" hidden></section>
  <section class="tela" id="t-partida" hidden>
    <div class="placar">
      <button class="sair" id="sair" aria-label="Sair da partida">‹</button>
      <div class="time" id="n0"><i style="background:var(--nos)"></i><span></span></div>
      <div class="nums"><b id="p0">0</b><u id="plies"></u><b id="p1">0</b></div>
      <div class="time b" id="n1"><span></span><i style="background:var(--eles)"></i></div>
    </div>
    <div id="palco"><canvas id="campo"></canvas></div>
    <div class="dica" id="dica" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
  </section>
  <div id="gaveta" hidden></div>
</div>

<script>
"use strict";
/* ============================== REGRAS ============================== */
const RULES=[
{id:"laterais",nome:"Fim das laterais",ti:"Campo",adj:"sem laterais",efeito:"O que sai por um lado do campo volta pelo outro.",motivo:"A Federação vendeu as laterais para pagar a conta de luz.",set:c=>c.wrap=true},
{id:"buraco",nome:"Buraco regulamentar",ti:"Campo",adj:"esburacado",efeito:"Bola lenta cai no buraco central e volta para a metade de quem tocou nela. Peça lenta volta ao início.",motivo:"A obra do gramado atrasou, então o buraco virou oficial.",set:c=>c.hole=true},
{id:"reduzido",nome:"Campo reduzido",ti:"Campo",adj:"apertado",efeito:"As laterais avançam e o campo fica mais estreito.",motivo:"O terreno ao lado foi loteado.",set:c=>c.inset=38},
{id:"mola",nome:"Tabelas de mola",ti:"Campo",adj:"de mola",efeito:"As paredes devolvem tudo mais rápido do que receberam.",motivo:"Patrocínio de uma fábrica de colchões.",set:c=>c.wallE=1.18},
{id:"varzea",nome:"Gol de várzea",ti:"Campo",adj:"de várzea",efeito:"Os dois gols ficam bem mais largos.",motivo:"As traves foram medidas em passos. Os passos eram do presidente.",set:c=>c.goalW=190},
{id:"chumbo",nome:"Bola de chumbo",ti:"Bola",adj:"de chumbo",efeito:"A bola fica mais que o dobro de pesada.",motivo:"Cortesia de um fornecedor amigo.",set:c=>c.ballM=1.15},
{id:"pilates",nome:"Bola de pilates",ti:"Bola",adj:"gigante",efeito:"A bola dobra de tamanho.",motivo:"Foi comprada por engano e a loja não aceita troca.",set:c=>c.ballR=18},
{id:"indecisa",nome:"Bola indecisa",ti:"Bola",adj:"indeciso",efeito:"A cada toque de uma peça, a bola desvia um pouco para um lado qualquer.",motivo:"A calibragem foi terceirizada.",contra:1,set:c=>c.deflect=true},
{id:"sabao",nome:"Campo ensaboado",ti:"Campo",adj:"ensaboado",efeito:"Tudo desliza muito mais e demora para parar.",motivo:"Confundiram o produto de limpeza.",set:c=>{c.dec=17;c.k=.4}},
{id:"tabela",nome:"Gol de tabela",ti:"Placar",adj:"de tabela",efeito:"Gol que bate na parede antes de entrar vale 1 a mais.",motivo:"Para valorizar a parede, tão esquecida.",set:c=>c.tabela=true},
{id:"placa",nome:"Gol de placa",ti:"Placar",adj:"de longe",efeito:"Gol com o último toque dado na sua própria metade vale 1 a mais.",motivo:"A placa foi encomendada antes do gol.",set:c=>c.longe=true},
{id:"contra",nome:"Gol contra honesto",ti:"Placar",adj:"traidor",efeito:"Quem faz gol contra fica com o ponto.",motivo:"Assim ninguém precisa discutir a intenção.",set:c=>c.contra=true},
{id:"virada",nome:"Virada burocrática",ti:"Placar",adj:"invertido",efeito:"Antes das duas últimas jogadas, o placar se inverte.",motivo:"Erro de digitação que a Federação se recusa a corrigir.",contra:1,set:c=>c.virada=true},
{id:"inflacao",nome:"Inflação do placar",ti:"Placar",adj:"inflacionado",efeito:"Para vencer antes do tempo, é preciso um gol a mais.",motivo:"O gol perdeu poder de compra.",set:c=>c.meta=4},
{id:"faltas",nome:"Três faltas",ti:"Peças",adj:"violento",efeito:"Peça atingida com força três vezes por rivais é expulsa até o fim da partida.",motivo:"O árbitro comprou um caderninho novo.",contra:1,set:c=>c.faltas=true},
{id:"goleiro",nome:"Goleiro-linha",ti:"Peças",adj:"sem goleiro",efeito:"Goleiros viram peças comuns: você joga com eles e eles só saem do lugar se tocados.",motivo:"O sindicato dos goleiros entrou em greve.",set:c=>c.gkLinha=true},
{id:"rodizio",nome:"Rodízio obrigatório",ti:"Peças",adj:"rotativo",efeito:"A mesma peça não pode jogar duas vezes seguidas.",motivo:"Exigência do plano de carreira.",contra:1,set:c=>c.rodizio=true},
{id:"eletrizadas",nome:"Peças eletrizadas",ti:"Peças",adj:"eletrizado",efeito:"Peças que se chocam saem disparadas.",motivo:"O uniforme novo é de poliéster.",set:c=>c.elet=true},
{id:"imposto",nome:"Imposto sobre o gol",ti:"Peças",adj:"tributado",efeito:"Cada gol custa a quem marcou uma peça de linha até o fim da partida.",motivo:"Nada é de graça neste país.",contra:1,set:c=>c.imposto=true},
{id:"troca",nome:"Troca de lados",ti:"Bizarro",adj:"trocado",efeito:"Na metade da partida, a mesa gira e os times trocam de campo.",motivo:"Para ninguém se acostumar.",set:c=>c.troca=true},
{id:"vento",nome:"Vento de várzea",ti:"Bizarro",adj:"ventilado",efeito:"A cada jogada sopra um vento diferente. A seta no campo mostra a direção.",motivo:"Derrubaram o muro do estádio.",set:c=>c.vento=true}
];
const R=Object.fromEntries(RULES.map(r=>[r.id,r]));
const RIVAIS=[
["Unidos da Segunda-Feira","Unidos"],["Atlético Quase Lá","Quase Lá"],["Sociedade Perna de Pau","Perna de Pau"],
["Grêmio do Escanteio","Escanteio"],["Bola Murcha F.C.","Bola Murcha"],["E.C. Tira-Teima","Tira-Teima"],
["Associação dos Cunhados","Cunhados"],["Real Várzea","Real Várzea"],["Tempestade do Interior","Tempestade"],["Federação F.C.","Federação"]
];
const NOS=["Esporte Clube Ninguém","Ninguém"],RODADAS=10;

function baseCfg(ids){
  const c={wrap:false,hole:false,inset:0,wallE:.8,goalW:128,ballM:.5,ballR:9,deflect:false,dec:30,k:.72,tabela:false,longe:false,contra:false,virada:false,faltas:false,gkLinha:false,troca:false,rodizio:false,elet:false,vento:false,imposto:false,meta:3,wx:0,wy:0};
  ids.forEach(i=>R[i]&&R[i].set(c));return c;
}

/* ============================== FÍSICA ============================== */
const FW=360,FH=560,MX=6,MY=22,CW=372,CH=604,CX=FW/2,CY=FH/2,HOLE=27,VMAX=880,VMIN=150;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);

function criaSim(cfg,gkV){
  const s={cfg,gkV,sides:[1,-1],b:[],goal:0,last:null,wallHit:false,t:0};
  s.b.push({id:0,t:-1,x:CX,y:CY,vx:0,vy:0,r:cfg.ballR,m:cfg.ballM,hx:CX,hy:CY});
  const pos=[[90,FH-125],[270,FH-125],[128,FH-215],[232,FH-215]];
  [0,1].forEach(t=>{
    const fl=(x,y)=>t===0?[x,y]:[FW-x,FH-y];
    const add=(x,y,gk,n)=>{const[hx0,hy]=fl(x,y),hx=clamp(hx0,cfg.inset+20,FW-cfg.inset-20);
      s.b.push({id:s.b.length,t,gk,n,x:hx,y:hy,hx,hy,vx:0,vy:0,r:gk?15:14,m:gk?1.3:1,hits:0,out:false});};
    add(CX,FH-27,true,1);
    pos.forEach((p,i)=>add(p[0],p[1],false,i+2));
  });
  return s;
}
function reposiciona(s,kick){
  s.b.forEach(b=>{b.x=b.hx;b.y=b.hy;b.vx=b.vy=0;});
  const ball=s.b[0];
  if(s.cfg.hole)ball.y=CY+66*s.sides[kick];
  s.goal=0;s.last=null;s.wallHit=false;s.t=0;
}
function giraMesa(s){
  s.sides=[s.sides[1],s.sides[0]];
  s.b.forEach(b=>{b.x=FW-b.x;b.y=FH-b.y;b.hx=FW-b.hx;b.hy=FH-b.hy;b.vx=b.vy=0;});
}
function clona(s){return{...s,sides:s.sides.slice(),b:s.b.map(o=>({...o})),last:s.last&&{...s.last}};}
const linhaViva=(s,t)=>s.b.filter(b=>b.t===t&&!b.gk&&!b.out).length;
function parado(s){
  for(const b of s.b){if(b.out||(b.gk&&!s.cfg.gkLinha))continue;if(b.vx||b.vy)return false;}
  return true;
}
function passo(s,dt,fx){
  const c=s.cfg,B=s.b,ball=B[0],L=c.inset,RG=FW-c.inset,gw=c.goalW/2;
  s.t+=dt;
  for(const b of B){
    if(b.out)continue;
    if(b.gk&&!c.gkLinha){
      /* o goleiro só reage quando a bola vem na direção dele e já está perto */
      const lim=Math.max(gw-24,10),d=clamp(ball.x,CX-lim,CX+lim)-b.x,sp=s.gkV[b.t];
      const vem=(ball.vy*(b.y-ball.y)>0)&&Math.abs(b.y-ball.y)<140;
      b.vx=vem?clamp(d*9,-sp,sp):0;b.vy=0;b.x+=b.vx*dt;continue;
    }
    const v=Math.hypot(b.vx,b.vy);
    if(v>0){
      const nv=v-(c.dec+c.k*v+(s.t>6?(s.t-6)*70:0))*dt;
      if(nv<5){b.vx=b.vy=0;}
      else{const f=nv/v;b.vx*=f;b.vy*=f;
        if(c.vento&&nv>24){const w=b.id===0?1:.4;b.vx+=c.wx*w*dt;b.vy+=c.wy*w*dt;}}
      b.x+=b.vx*dt;b.y+=b.vy*dt;
    }
    if(c.wrap){if(b.x<L)b.x+=RG-L;else if(b.x>RG)b.x-=RG-L;}
    else if(b.x<L+b.r||b.x>RG-b.r){
      const esq=b.x<L+b.r;b.x=esq?L+b.r:RG-b.r;
      const nv=Math.min(Math.abs(b.vx)*c.wallE,1150);b.vx=esq?nv:-nv;
      if(b.id===0)s.wallHit=true;
      if(fx&&Math.abs(b.vx)>40)fx.som("parede",Math.abs(b.vx));
    }
    const noGol=b.id===0&&Math.abs(b.x-CX)<gw;
    if(noGol){
      if(b.y<0){s.goal=-1;return;}
      if(b.y>FH){s.goal=1;return;}
    }else if(b.y<b.r||b.y>FH-b.r){
      const cima=b.y<b.r;b.y=cima?b.r:FH-b.r;
      const nv=Math.min(Math.abs(b.vy)*c.wallE,1150);b.vy=cima?nv:-nv;
      if(b.id===0)s.wallHit=true;
      if(fx&&Math.abs(b.vy)>40)fx.som("parede",Math.abs(b.vy));
    }
    if(c.hole&&!b.gk&&(b.vx||b.vy)&&Math.hypot(b.x-CX,b.y-CY)<HOLE-b.r*.3&&Math.hypot(b.vx,b.vy)<430){
      b.vx=b.vy=0;
      if(b.id===0){const t=s.last?s.last.t:0;b.x=CX;b.y=CY+100*s.sides[t];}else{b.x=b.hx;b.y=b.hy;}
      if(fx)fx.som("buraco");
    }
  }
  /* traves */
  for(const py of[0,FH])for(const px of[CX-gw,CX+gw]){
    const dx=ball.x-px,dy=ball.y-py,d=Math.hypot(dx,dy),mn=ball.r+4;
    if(d<mn&&d>0){const nx=dx/d,ny=dy/d,vn=ball.vx*nx+ball.vy*ny;ball.x=px+nx*mn;ball.y=py+ny*mn;
      if(vn<0){ball.vx-=1.8*vn*nx;ball.vy-=1.8*vn*ny;if(fx)fx.som("trave");}}
  }
  /* colisões */
  for(let i=0;i<B.length;i++){const a=B[i];if(a.out)continue;
    for(let j=i+1;j<B.length;j++){const b=B[j];if(b.out)continue;
      const dx=b.x-a.x,dy=b.y-a.y,mn=a.r+b.r;
      if(Math.abs(dx)>mn||Math.abs(dy)>mn)continue;
      const d=Math.hypot(dx,dy)||.01;if(d>=mn)continue;
      const fixoA=a.gk&&!c.gkLinha,fixoB=b.gk&&!c.gkLinha;if(fixoA&&fixoB)continue;
      const ma=fixoA?1e4:a.m,mb=fixoB?1e4:b.m,nx=dx/d,ny=dy/d,ov=mn-d,tot=ma+mb;
      a.x-=nx*ov*mb/tot;a.y-=ny*ov*mb/tot;b.x+=nx*ov*ma/tot;b.y+=ny*ov*ma/tot;
      const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(rel>=0)continue;
      const pecas=a.id!==0;
      const e=pecas&&c.elet?1.42:(pecas?.82:.92);
      const k=-(1+e)*rel/(1/ma+1/mb);
      a.vx-=k/ma*nx;a.vy-=k/ma*ny;b.vx+=k/mb*nx;b.vy+=k/mb*ny;
      if(pecas&&c.elet){for(const o of[a,b]){const v=Math.hypot(o.vx,o.vy);if(v>1000){o.vx*=1000/v;o.vy*=1000/v;}}}
      if(a.id===0){
        s.last={t:b.t,x:b.x,y:b.y};s.wallHit=false;
        if(c.deflect){const ang=rnd(.2,.62)*(Math.random()<.5?-1:1),cs=Math.cos(ang),sn=Math.sin(ang),vx=a.vx;a.vx=vx*cs-a.vy*sn;a.vy=vx*sn+a.vy*cs;}
        if(fx)fx.som("bola",-rel);
      }else{
        if(fx)fx.som("peca",-rel);
        if(c.faltas&&a.t!==b.t&&-rel>170){
          const sa=Math.hypot(a.vx,a.vy),sb=Math.hypot(b.vx,b.vy),vit=sa<sb?a:b;
          if(!vit.gk){vit.hits++;
            if(vit.hits>=3&&linhaViva(s,vit.t)>1){vit.out=true;vit.vx=vit.vy=0;if(fx)fx.expulso(vit);}
            else if(fx)fx.som("cartao");}
        }
      }
    }
  }
}
/* quem leva o gol e quanto vale */
function credito(s){
  const dono=s.sides[0]===s.goal?0:1,last=s.last;
  let ben=1-dono,val=1,mot=[];
  if(s.cfg.contra&&last&&last.t===dono){ben=dono;mot.push("Gol contra honesto");}
  else if(last&&last.t===dono)mot.push("Gol contra");
  if(last&&last.t===ben){
    if(s.cfg.tabela&&s.wallHit){val++;mot.push("Gol de tabela");}
    if(s.cfg.longe&&(last.y-CY)*s.sides[ben]>0){val++;mot.push("Gol de placa");}
  }
  return{ben,val,mot};
}

/* ============================== ADVERSÁRIO ==============================
   A máquina testa jogadas na própria física, com as regras ativas. Por isso
   ela enxerga qualquer combinação de regras sem código específico. */
function jogaveis(g,t){
  const s=g.sim,lista=s.b.filter(b=>b.t===t&&!b.out&&(!b.gk||s.cfg.gkLinha));
  if(s.cfg.rodizio&&g.ultima[t]!=null){const f=lista.filter(b=>b.id!==g.ultima[t]);if(f.length)return f;}
  return lista;
}
function escolheJogada(g,lv,t=1){
  const s=g.sim,c=s.cfg,ball=s.b[0],meu=s.sides[t],alvoY=meu>0?0:FH,meuY=meu>0?FH:0,gw=c.goalW/2,LE=c.inset,RD=FW-c.inset;
  const alvos=[[CX,alvoY],[CX-gw*.62,alvoY],[CX+gw*.62,alvoY]];
  if(c.tabela||c.wallE>1||lv>.4){alvos.push([2*LE-CX,alvoY],[2*RD-CX,alvoY]);}
  if(c.contra)alvos.push([CX,meuY]);
  const cand=[];
  for(const p of jogaveis(g,t)){
    for(const a of alvos){
      const dx=a[0]-ball.x,dy=a[1]-ball.y,dd=Math.hypot(dx,dy)||1;
      const gx=ball.x-dx/dd*(p.r+ball.r*.92),gy=ball.y-dy/dd*(p.r+ball.r*.92);
      const ang=Math.atan2(gy-p.y,gx-p.x);
      for(const f of[.5,.75,1])cand.push({p:p.id,ang,f});
    }
    for(let i=0;i<2;i++)cand.push({p:p.id,ang:rnd(-Math.PI,Math.PI),f:rnd(.5,1)});
  }
  for(let i=cand.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[cand[i],cand[j]]=[cand[j],cand[i]];}
  const lim=Math.round(26+lv*80);
  let melhor=null,nota=-1e9;
  for(const k of cand.slice(0,lim)){
    const v=clona(s),b=v.b[k.p],sp=VMIN+k.f*(VMAX-VMIN);
    b.vx=Math.cos(k.ang)*sp;b.vy=Math.sin(k.ang)*sp;
    for(let i=0;i<280;i++){passo(v,1/120,null);if(v.goal||parado(v))break;}
    let n;
    if(v.goal){const r=credito(v);n=r.ben===t?1000*r.val:-1600*r.val;}
    else{const q=v.b[0],atk=FH-Math.abs(q.y-alvoY);n=atk/FH*100-Math.abs(q.x-CX)*.04;
      if(Math.abs(q.y-meuY)<150)n-=40;
      n-=(s.b.filter(o=>o.t===t&&!o.out).length-v.b.filter(o=>o.t===t&&!o.out).length)*60;
      n+=rnd(0,6);}
    if(n>nota){nota=n;melhor=k;}
  }
  if(!melhor)return null;
  const erro=(1-lv)*.11+.006;
  return{p:melhor.p,ang:melhor.ang+rnd(-erro,erro),f:clamp(melhor.f*rnd(.92,1.06),.3,1)};
}

let AC=null,mudo=false;
function ouve(){if(!AC&&(window.AudioContext||window.webkitAudioContext)){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();}
function ton(f,d,tipo,vol,qdo=0,f2){if(!AC||mudo)return;const t=AC.currentTime+qdo,o=AC.createOscillator(),g=AC.createGain();o.type=tipo;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function ruido(d,vol,freq,qdo=0){if(!AC||mudo)return;const n=AC.sampleRate*d|0,buf=AC.createBuffer(1,n,AC.sampleRate),x=buf.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const t=AC.currentTime+qdo,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=buf;f.type="bandpass";f.frequency.value=freq;g.gain.setValueAtTime(.0008,t);g.gain.exponentialRampToValueAtTime(vol,t+d*.25);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f).connect(g).connect(AC.destination);s.start(t);}
const apito=(n=1)=>{for(let i=0;i<n;i++){ton(2750,.2,"square",.05,i*.3);ton(2950,.2,"square",.04,i*.3);}};

const FX={

    if(k==="bola")ton(1500,.05,"triangle",q*.8,0,800);
    else if(k==="peca")ton(620,.06,"triangle",q,0,330);
    else if(k==="parede")ton(190,.07,"sine",q,0,110);
    else if(k==="trave")ton(1250,.22,"triangle",.3);
    else if(k==="buraco")ton(420,.3,"sine",.3,0,70);
    else if(k==="cartao")ton(1800,.09,"square",.04);},
  expulso(b){apito(2);if(G)faixa("Expulso!",`Peça ${b.n} ${b.t===0?"do "+NOS[1]:"do rival"} foi para o chuveiro.`,"var(--carimbo)",1100);}

const cv=$("campo"),ctx=cv.getContext("2d");
let esc2=1,dpr=1,fundo=null;
function medir(){
  const p=$("palco"),aw=p.clientWidth,ah=p.clientHeight;if(!aw||!ah)return;
  esc2=Math.min(aw/CW,ah/CH);dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.style.width=CW*esc2+"px";cv.style.height=CH*esc2+"px";
  cv.width=Math.round(CW*esc2*dpr);cv.height=Math.round(CH*esc2*dpr);
  if(G)fundo=pintaFundo(G.sim.cfg);
}
window.addEventListener("resize",medir);

function pintaFundo(c){
  const o=document.createElement("canvas");o.width=cv.width;o.height=cv.height;
  const x=o.getContext("2d"),k=esc2*dpr;x.scale(k,k);
  x.fillStyle="#3d2617";x.fillRect(0,0,CW,CH);
  x.fillStyle="#5b3a22";for(let i=0;i<9;i++)x.fillRect(0,i*70+8,CW,1);
  x.translate(MX,MY);
  const gw=c.goalW/2;
  /* redes */
  for(const[gy,h]of[[-16,16],[FH,16]]){x.fillStyle="#efe9d6";x.fillRect(CX-gw,gy,gw*2,h);
    x.strokeStyle="#0003";x.lineWidth=1;x.beginPath();for(let i=CX-gw;i<=CX+gw;i+=7){x.moveTo(i,gy);x.lineTo(i,gy+h);}x.moveTo(CX-gw,gy+8);x.lineTo(CX+gw,gy+8);x.stroke();}
  const g=x.createRadialGradient(CX,CY,60,CX,CY,420);g.addColorStop(0,"#21784f");g.addColorStop(1,"#165a3c");
  x.fillStyle=g;x.fillRect(0,0,FW,FH);
  x.fillStyle="rgba(255,255,255,.035)";for(let i=0;i<7;i++)if(i%2===0)x.fillRect(0,i*FH/7,FW,FH/7);
  const L=c.inset,RD=FW-L,W=RD-L;
  x.strokeStyle="#f6f4e8";x.lineWidth=2;
  x.strokeRect(L+1,1,W-2,FH-2);
  x.beginPath();x.moveTo(L,CY);x.lineTo(RD,CY);x.stroke();
  x.beginPath();x.arc(CX,CY,Math.min(52,W/3),0,7);x.stroke();
  const ax=Math.min(c.goalW+74,W-10);x.strokeRect(CX-ax/2,1,ax,74);x.strokeRect(CX-ax/2,FH-75,ax,74);
  x.fillStyle="#f6f4e8";x.beginPath();x.arc(CX,CY,3,0,7);x.fill();
  if(L){x.fillStyle="#3d2617";x.fillRect(0,0,L,FH);x.fillRect(RD,0,L,FH);
    x.strokeStyle="#ffffff30";x.lineWidth=1.5;x.beginPath();for(let i=-40;i<FH;i+=16){x.moveTo(0,i+L);x.lineTo(L,i);x.moveTo(RD,i+L);x.lineTo(FW,i);}x.stroke();}
  if(c.wrap){x.strokeStyle="#2bc2b3";x.lineWidth=4;x.setLineDash([10,9]);x.beginPath();x.moveTo(L+1,0);x.lineTo(L+1,FH);x.moveTo(RD-1,0);x.lineTo(RD-1,FH);x.stroke();x.setLineDash([]);}
  else if(c.wallE>1){x.strokeStyle="#ff9348";x.lineWidth=4;x.setLineDash([3,6]);x.strokeRect(L+1,1,W-2,FH-2);x.setLineDash([]);}
  if(c.dec<20){x.fillStyle="#ffffff14";for(let i=0;i<46;i++){x.beginPath();x.arc(30+((i*137)%300),18+((i*89)%530),5+i%9,0,7);x.fill();}}
  if(c.hole){x.fillStyle="#0a0705";x.beginPath();x.arc(CX,CY,HOLE,0,7);x.fill();x.strokeStyle="#6b4a2c";x.lineWidth=4;x.stroke();}
  x.fillStyle="#f6f4e8";for(const py of[0,FH])for(const px of[CX-gw,CX+gw]){x.beginPath();x.arc(px,py,4,0,7);x.fill();}
  return o;
}

function partida(){
  const n=S.rodada,cfg=baseCfg(S.regras),gkC=40+n*7,lv=clamp((n-1)/8,0,1);
  const g={sim:criaSim(cfg,[92,gkC]),placar:[0,n===RODADAS?1:0],vez:0,plies:20,total:20,fase:"mira",ultima:[null,null],
    mira:null,lv,riv:RIVAIS[n-1],rast:[],pap:[],giro:0,tr:false,vr:false,ouro:false};
  G=g;mostra("t-partida");
  $("n0").querySelector("span").textContent=NOS[1];$("n1").querySelector("span").textContent=g.riv[1];
  $("chips").innerHTML=S.regras.length?S.regras.map(id=>`<button data-r="1">${esc(R[id].nome)}</button>`).join(""):`<button class="vazio" data-r="1">Regulamento vazio</button>`;
  $("chips").querySelectorAll("button").forEach(b=>b.onclick=regulamento);
  medir();reposiciona(g.sim,0);hud();proximo(g,true);
}
function regulamento(){gaveta(`<h2>Regulamento em vigor</h2>${S.regras.length?`<ul class="artigos">${artigos(S.regras)}</ul>`:`<p class="nota">Por enquanto, nenhuma regra extra.</p>`}<button class="btn sec" data-fecha style="margin-top:12px">Voltar ao jogo</button>`);}
function hud(){const g=G;if(!g)return;$("p0").textContent=g.placar[0];$("p1").textContent=g.placar[1];
  $("plies").textContent=g.ouro?"ouro":g.plies;
  $("n0").classList.toggle("vez",g.vez===0);$("n1").classList.toggle("vez",g.vez===1);}
function dica(t){$("dica").textContent=t;}
let faixaT=0;
function faixa(t,sub,cor,ms=1300,doc){
  const old=$("palco").querySelector(".faixa");if(old)old.remove();
  const d=document.createElement("div");d.className="faixa"+(doc?" doc":"");
  d.innerHTML=`<b style="color:${cor}">${esc(t)}</b>${sub?`<span>${esc(sub)}</span>`:""}`;
  $("palco").appendChild(d);clearTimeout(faixaT);faixaT=setTimeout(()=>d.remove(),ms);
}
function depois(g,ms,f){setTimeout(()=>{if(G===g)f();},ms);}

function proximo(g,inicio){
  const s=g.sim,c=s.cfg;g.mira=null;
  if(g.placarFim)return;
  if(g.plies<=0){
    if(S.rodada===RODADAS&&g.placar[0]===g.placar[1]){
      g.ouro=true;g.plies=2;hud();faixa("Gol de ouro","Quem marcar primeiro leva a taça.","var(--via)",1500);
      return depois(g,1500,()=>proximo(g));}
    return encerra(g);
  }
  if(c.troca&&!g.tr&&g.plies<=g.total/2){
    g.tr=true;giraMesa(s);g.giro=1;apito(2);faixa("Troca de lados","A mesa gira. Agora você ataca para o outro lado.","var(--via)",1500,true);
    return depois(g,1550,()=>proximo(g));}
  if(c.virada&&!g.vr&&g.plies<=2&&!g.ouro){
    g.vr=true;g.placar.reverse();hud();batida();faixa("Virada burocrática","O placar foi invertido por erro de digitação.","var(--via)",1600,true);
    return depois(g,1650,()=>proximo(g));}
  if(c.vento){const a=rnd(0,6.283),f=rnd(14,31);c.wx=Math.cos(a)*f;c.wy=Math.sin(a)*f;}
  hud();
  if(g.vez===0){
    g.fase="mira";
    dica("Puxe uma peça para trás e solte");
  }else{
    g.fase="cpu";dica(`Vez do ${g.riv[1]}`);
    depois(g,520+Math.random()*420,()=>{
      const j=escolheJogada(g,g.lv);
      if(!j){return passaVez(g);}
      const b=s.b[j.p],sp=VMIN+j.f*(VMAX-VMIN);atira(g,b,Math.cos(j.ang)*sp,Math.sin(j.ang)*sp);
    });
  }
}
function atira(g,b,vx,vy){
  b.vx=vx;b.vy=vy;g.ultima[b.t]=b.id;g.plies--;g.fase="run";g.rast=[];hud();
  FX.som("peca",Math.hypot(vx,vy));
}
function passaVez(g){g.vez=1-g.vez;proximo(g);}
function aposJogada(g){
  const s=g.sim;
  if(s.goal){
    const r=credito(s);g.placar[r.ben]+=r.val;g.fase="gol";hud();
    const nosso=r.ben===0,cor=nosso?"var(--nos)":"var(--eles)";
    faixa(r.val>1?`Gol! Vale ${r.val}`:"Gol!",r.mot.join(" + ")||(nosso?NOS[1]:g.riv[1]),cor,1500);
    ruido(1.2,.26,1100);apito(1);try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
    for(let i=0;i<46;i++)g.pap.push({x:rnd(CX-90,CX+90),y:s.goal<0?10:FH-10,vx:rnd(-130,130),vy:rnd(70,230)*-s.goal,g:rnd(-.5,.5),r:rnd(0,6),vr:rnd(-7,7),a:1,c:Math.random()<.5?"#f7e588":"#f6f4e8"});
    if(s.cfg.imposto){const l=s.b.filter(b=>b.t===r.ben&&!b.gk&&!b.out);if(l.length>1){l[Math.random()*l.length|0].out=true;}}
    const acabou=Math.max(...g.placar)>=s.cfg.meta||(g.ouro&&g.placar[0]!==g.placar[1]);
    depois(g,1600,()=>{
      if(acabou)return encerra(g);
      const prox=1-r.ben;g.vez=prox;reposiciona(s,prox);g.ultima=[null,null];proximo(g);
    });
  }else passaVez(g);
}
function encerra(g){
  if(g.placarFim)return;g.placarFim=true;g.fase="fim";apito(3);
  const[a,b]=g.placar,res=a>b?"v":a<b?"d":"e";
  faixa("Fim de jogo",`${a} × ${b}`,"var(--giz)",1200);
  depois(g,1250,()=>resultado(res));
}
$("sair").onclick=()=>gaveta(`<h2>Sair da partida?</h2><p class="nota">O placar desta partida será perdido. A temporada continua salva.</p><button class="btn" id="g-sair" style="margin-top:14px">Sair para a abertura</button><button class="btn sec" data-fecha>Continuar jogando</button>`)||($("g-sair").onclick=abertura);

/* ---------- toque ---------- */
function pontoCampo(e){const r=cv.getBoundingClientRect(),k=r.width/CW;return{x:(e.clientX-r.left)/k-MX,y:(e.clientY-r.top)/k-MY};}
cv.addEventListener("pointerdown",e=>{
  const g=G;ouve();if(!g||g.fase!=="mira")return;
  const q=pontoCampo(e);let best=null,bd=48;
  for(const b of jogaveis(g,0)){const d=Math.hypot(b.x-q.x,b.y-q.y);if(d<bd){bd=d;best=b;}}
  if(!best)return;
  g.mira={b:best,x0:q.x,y0:q.y,x:q.x,y:q.y};try{cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();
});
cv.addEventListener("pointermove",e=>{const g=G;if(g&&g.mira){const q=pontoCampo(e);g.mira.x=q.x;g.mira.y=q.y;}});
const puxa=m=>{const dx=m.x0-m.x,dy=m.y0-m.y,d=Math.hypot(dx,dy);return{d,ux:d?dx/d:0,uy:d?dy/d:0,f:clamp((d-12)/118,0,1)};};
function solta(){
  const g=G;if(!g||!g.mira)return;const m=g.mira,p=puxa(m);g.mira=null;
  if(p.d<16||g.fase!=="mira")return;
  if(tutorial){tutorial=false;lsSet(TUT,1);}
  const sp=VMIN+p.f*(VMAX-VMIN);dica("");atira(g,m.b,p.ux*sp,p.uy*sp);
}
cv.addEventListener("pointerup",solta);
cv.addEventListener("pointercancel",()=>{if(G)G.mira=null;});

/* ---------- desenho ---------- */
function disco(b,sel,bloq){
  const{x,y,r}=b,cor=b.t===0?"#2bc2b3":"#ff9348",esc3=b.t===0?"#127a70":"#b9580f";
  ctx.fillStyle="rgba(0,0,0,.32)";ctx.beginPath();ctx.arc(x+2,y+3,r,0,7);ctx.fill();
  const gr=ctx.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r*1.1);gr.addColorStop(0,"#fff");gr.addColorStop(.28,cor);gr.addColorStop(1,esc3);
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,r-3,0,7);ctx.stroke();
  ctx.fillStyle="#0d1a18";ctx.font=`400 ${b.gk?13:12}px "Alfa Slab One",Georgia,serif`;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(b.gk?"G":b.n,x,y+1);
  if(bloq){ctx.fillStyle="rgba(20,14,10,.55)";ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
  if(b.hits){ctx.fillStyle="#f2c230";for(let i=0;i<b.hits;i++)ctx.fillRect(x-r+i*8,y-r-8,6,9);}
  if(sel){ctx.strokeStyle="#fff";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,r+3,0,7);ctx.stroke();}
}
let tAnt=0,acc=0;
function quadro(t){
  requestAnimationFrame(quadro);
  const dt=Math.min((t-tAnt)/1000,.05);tAnt=t;const g=G;
  if(!g||$("t-partida").hidden)return;
  const s=g.sim,c=s.cfg;
  if(g.fase==="run"){
    acc+=dt;
    while(acc>=1/120&&g.fase==="run"){
      acc-=1/120;passo(s,1/120,FX);
      if(s.goal||parado(s)||s.t>14){if(s.t>14)s.b.forEach(b=>{b.vx=b.vy=0;});g.fase="_";aposJogada(g);}
    }
    g.rast.push({x:s.b[0].x,y:s.b[0].y});if(g.rast.length>14)g.rast.shift();
  }else{acc=0;if(g.fase!=="mira"&&g.fase!=="cpu")g.rast.shift();}
  if(g.fase!=="run"&&s.t>0&&g.fase!=="gol"&&g.fase!=="_")s.t=0;
  if(g.giro>0)g.giro=Math.max(0,g.giro-dt/.8);

  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  const k=esc2*dpr;ctx.setTransform(k,0,0,k,0,0);
  if(g.giro>0){const e=g.giro*g.giro*(3-2*g.giro);ctx.translate(CW/2,CH/2);ctx.rotate(Math.PI*e);ctx.translate(-CW/2,-CH/2);}
  if(!fundo||fundo.width!==cv.width)fundo=pintaFundo(c);
  ctx.drawImage(fundo,0,0,CW,CH);
  ctx.translate(MX,MY);
  if(c.vento){
    const m=Math.hypot(c.wx,c.wy)||1,ux=c.wx/m,uy=c.wy/m,len=m*2.2,ax=CX+ux*len/2,ay=CY-96+uy*len/2;
    ctx.strokeStyle="rgba(255,255,255,.75)";ctx.fillStyle="rgba(255,255,255,.75)";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(CX-ux*len/2,CY-96-uy*len/2);ctx.lineTo(ax,ay);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ax+ux*9,ay+uy*9);ctx.lineTo(ax-uy*7,ay+ux*7);ctx.lineTo(ax+uy*7,ay-ux*7);ctx.fill();
  }
  const aptos=g.fase==="mira"?jogaveis(g,0):[],sel=g.mira&&g.mira.b;
  if(g.fase==="mira"&&!sel){const a=.3+.3*Math.sin(t/260);ctx.lineWidth=2;ctx.strokeStyle=`rgba(255,255,255,${a})`;
    for(const b of aptos){ctx.beginPath();ctx.arc(b.x,b.y,b.r+4,0,7);ctx.stroke();}}
  const ball=s.b[0];
  g.rast.forEach((p,i)=>{ctx.fillStyle=`rgba(255,255,255,${i/g.rast.length*.22})`;ctx.beginPath();ctx.arc(p.x,p.y,ball.r*(i/g.rast.length),0,7);ctx.fill();});
  if(g.mira){
    const m=g.mira,p=puxa(m),b=m.b;
    if(p.d>=16){
      const len=44+p.f*150,cor=p.f>.92?"#ff4d3d":"#fff";
      ctx.strokeStyle="rgba(0,0,0,.55)";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-p.ux*Math.min(p.d,130),b.y-p.uy*Math.min(p.d,130));ctx.stroke();
      ctx.setLineDash([9,8]);ctx.strokeStyle=cor;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x+p.ux*b.r,b.y+p.uy*b.r);ctx.lineTo(b.x+p.ux*(b.r+len),b.y+p.uy*(b.r+len));ctx.stroke();ctx.setLineDash([]);
      const ex=b.x+p.ux*(b.r+len),ey=b.y+p.uy*(b.r+len);ctx.fillStyle=cor;ctx.beginPath();ctx.moveTo(ex+p.ux*10,ey+p.uy*10);ctx.lineTo(ex-p.uy*7,ey+p.ux*7);ctx.lineTo(ex+p.uy*7,ey-p.ux*7);ctx.fill();
    }
  }
  for(const b of s.b){if(b.out||b.id===0)continue;
    const blq=g.fase==="mira"&&b.t===0&&(!b.gk||c.gkLinha)&&!aptos.includes(b);
    disco(b,sel===b,blq);}
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.arc(ball.x+1.5,ball.y+2.5,ball.r,0,7);ctx.fill();
  ctx.fillStyle="#fbfaf2";ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
  ctx.strokeStyle="#1a1a1a";ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle="#1a1a1a";ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*.34,0,7);ctx.fill();
  if(tutorial&&g.fase==="mira"&&!g.mira){
    const b=aptos.find(q=>q.n===4)||aptos[0];
    if(b){const f=(t%1700)/1700,e=f<.7?f/.7:1,q=b.y+e*62;ctx.globalAlpha=f<.8?.85:0;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(b.x,q,13,0,7);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.setLineDash([5,6]);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,q);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;}
  }
  for(const p of g.pap){p.vy+=240*dt*(p.vy<0?1:.2);p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.a-=dt*.7;
    if(p.a<=0)continue;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(p.a,0);ctx.fillStyle=p.c;ctx.fillRect(-5,-7,10,14);ctx.restore();}
  g.pap=g.pap.filter(p=>p.a>0);
}
requestAnimationFrame(quadro);

/* ganchos para teste automatizado, ativos só com ?teste na URL */
if(location.search.includes("teste"))window.__rn={get G(){return G},get S(){return S},set S(v){S=v},RULES,baseCfg,criaSim,reposiciona,passo,parado,credito,escolheJogada,clona,partida,aposJogada,atira,resultado,circular,fim,sumula,salva,encerra,RODADAS,giraMesa};
abertura();
</script>
