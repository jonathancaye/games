<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1420">
<title>Gênese</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,800;1,9..144,500&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{--papel:#f5ecd9;--suave:#cbbfae;--magma:#f97316;--mar:#14b8a6;--gelo:#d3edf6;
  --luz:#86d65a;--calor:#f97316;--caca:#b596ff;--cinza:#6f6b6a;
  --fundo:#2b1420;--fundo2:#471d24;--vidro:rgba(255,240,220,.08);--fio:rgba(255,240,220,.16);
  --titulo:"Fraunces",Georgia,serif;--corpo:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app.vida{--fundo:#06303a;--fundo2:#0b4d4e}
#app.degelo{--fundo:#0d3a48;--fundo2:#1f6a62}
#app.especies{--fundo:#1b2a18;--fundo2:#46531f}
#app.recup{--fundo:#2a2138;--fundo2:#6a3d4e}
#app.civ{--fundo:#1f2236;--fundo2:#5a4a34}
#app.recons{--fundo:#2e2530;--fundo2:#85603c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#190b12;font-family:var(--corpo);color:var(--papel);touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--papel);outline-offset:2px}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:radial-gradient(120% 70% at 50% 18%,var(--fundo2),var(--fundo) 72%);display:flex;flex-direction:column}
#frost{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .6s;box-shadow:inset 0 0 70px 26px rgba(205,236,247,.9),inset 0 0 8px 3px #fff}
#frost.seca{box-shadow:inset 0 0 74px 28px rgba(226,170,92,.85)}
#frost.meteoro{box-shadow:inset 0 0 74px 28px rgba(232,74,34,.72)}
#frost.peste{box-shadow:inset 0 0 74px 28px rgba(120,190,110,.72)}
#frost.fome{box-shadow:inset 0 0 74px 28px rgba(214,178,96,.78)}
.tela{position:absolute;inset:0;display:none;flex-direction:column}
.tela.on{display:flex}

/* capa */
#capa{align-items:center;justify-content:center;padding:calc(44px + env(safe-area-inset-top)) 24px calc(16px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(90% 46% at 50% 100%,rgba(249,115,22,.34),transparent 72%),radial-gradient(100% 50% at 50% 26%,rgba(20,184,166,.3),transparent 74%)}
#capa .voltar{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;color:var(--suave);text-decoration:none;font-size:14px;font-weight:600}
.abertura{width:min(330px,88vw);height:auto;max-height:36vh;margin-bottom:2px;overflow:visible}
.abertura .sobe,.abertura .ponta,.abertura .nucleo,.abertura .ramo-a{transform-box:fill-box;transform-origin:center}
.abertura .fa{animation:fa 1.1s cubic-bezier(.6,0,.3,1) .25s both}
.abertura .fb{animation:fb 1.1s cubic-bezier(.6,0,.3,1) .25s both}
.abertura .nucleo{animation:brota .6s cubic-bezier(.2,1.5,.4,1) 1.15s both}
.abertura .ramo-a{stroke-dasharray:1;stroke-dashoffset:1;animation:cresce 1.1s ease-out 1.55s forwards}
.abertura .ponta{animation:brota .5s cubic-bezier(.2,1.5,.4,1) both}
.abertura .p1{animation-delay:2.35s}.abertura .p2{animation-delay:2.5s}.abertura .p3{animation-delay:2.65s}
@keyframes fa{to{transform:translate(95px,-44px) scale(.5);opacity:0}}
@keyframes fb{to{transform:translate(-95px,-44px) scale(.5);opacity:0}}
@keyframes brota{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
@keyframes cresce{to{stroke-dashoffset:0}}
#capa h1{font-family:var(--titulo);font-weight:800;font-size:clamp(62px,20vw,88px);letter-spacing:-.035em;line-height:1;margin:0}
#capa .chamada{max-width:30ch;margin:8px 0 0;font-size:17px;line-height:1.42}
#capa .acoes{display:flex;flex-direction:column;gap:9px;width:min(280px,100%);margin-top:20px}
#capa .dupla{display:flex;gap:9px}
#capa .dupla .btn{padding-left:6px;padding-right:6px;font-size:15px}
#capa .fins{display:block;margin-top:12px;color:var(--suave);font-size:13.5px}
.credito{margin:0;font-family:var(--titulo);font-style:italic;font-size:15px;line-height:1.4;color:var(--papel)}
#capa .credito{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));padding:0 16px}
@media (max-height:700px){#capa{justify-content:flex-start}.abertura{max-height:27vh}#capa h1{font-size:56px}#capa .chamada{font-size:15.5px}#capa .acoes{margin-top:12px}#capa .credito{font-size:13.5px}}
.btn{display:block;width:100%;padding:14px 16px;border-radius:999px;font-weight:800;font-size:16px;background:var(--mar);color:#04262a;text-align:center;text-decoration:none}
.btn.fogo{background:var(--magma);color:#2b1000}
.btn.vazado{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fio);color:var(--papel)}
.btn:disabled{opacity:.45}

/* topo */
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;padding-top:calc(10px + env(safe-area-inset-top))}
.hud .menu{width:36px;height:36px;font-size:22px;border-radius:50%;display:grid;place-items:center}
.hud h2{flex:1;margin:0;font-family:var(--titulo);font-weight:500;font-size:20px;min-width:0;white-space:nowrap}
.res{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:999px;background:var(--vidro);font-weight:800;font-size:15.5px;font-variant-numeric:tabular-nums}
.res.baixo{background:rgba(249,115,22,.3)}
.res .ui{color:#ffd27a;font-size:14px}
.res.vit .ui,.val .ui{color:var(--luz)}
.status{padding:0 14px;min-height:44px}
.status b{font-size:14.5px;font-weight:700}
.status .barra{height:5px;border-radius:9px;background:var(--vidro);margin-top:6px;overflow:hidden}
.status .barra i{display:block;height:100%;background:var(--magma);border-radius:9px;transition:width .35s}
#app.vida .status .barra i{background:var(--gelo)}
.status .sinal{font-size:13.5px;line-height:1.3;color:var(--gelo);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.status.lin{display:flex;align-items:center;justify-content:space-between;gap:10px}
.crise{display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px;width:100%;padding:7px 10px 8px 7px;border-radius:16px;background:rgba(0,0,0,.24);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--fio) 55%,transparent);text-align:left}
.crise>.orbe{flex:none;width:46px;height:46px}
.crise .orbe.desc{--tinta:#55524f;font-family:var(--titulo);font-size:24px;font-weight:800}
.crise .cc{flex:1;min-width:0;display:block}
.crise b{display:block;font-family:var(--titulo);font-weight:800;font-size:17.5px;line-height:1.15;color:var(--papel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tempo{display:flex;gap:4px;margin-top:6px}
.pacote{display:flex;gap:2px;flex:var(--p,4) 1 0;min-width:0}
.pacote i{flex:1;height:13px;min-width:0;border-radius:3px}
.pacote i.g{background:var(--fio)}
.pacote i.v{background:#2dd4bf}
.pacote i.r{box-shadow:inset 0 0 0 1.5px #ffd27a}
.pacote i.r.nao{box-shadow:inset 0 0 0 1px rgba(255,210,122,.35)}
.crise.urg .pacote i.v{background:#ff8a3c;animation:alerta .9s ease-in-out infinite}
.crise.urg>.orbe{animation:alerta .9s ease-in-out infinite}
@keyframes alerta{50%{opacity:.5}}
.selos{flex:0 0 100%;display:flex;justify-content:space-between;gap:4px;padding-left:3px}
.selo{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;line-height:1.1;color:var(--suave);white-space:nowrap}
.selo .ui{font-size:13px;flex:none}
.selo.ok{color:#8fe8c4}
.selo.mal{color:#ffb27a}
.selo.apagado{opacity:.72}
.crise.urg .selo.mal{animation:alerta .9s ease-in-out infinite}
.legenda{margin-top:4px;font-size:12px;color:#ffd27a}
.status .enc{padding:6px 12px;border-radius:999px;background:var(--mar);color:#04262a;font-weight:800;font-size:13.5px;white-space:nowrap}

/* forja */
.forja{position:relative;height:104px;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:16px;flex:none}
.slot{width:66px;height:66px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--fio);display:grid;place-items:center;transition:transform .34s cubic-bezier(.6,0,.4,1),opacity .2s .24s;background:var(--vidro)}
.slot .orbe{width:100%;height:100%}
.crisol{width:94px;height:94px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--fio);background:radial-gradient(circle at 50% 42%,rgba(255,235,200,.12),transparent 70%);position:relative;z-index:1}
.crisol.novo{animation:pop .5s cubic-bezier(.2,1.5,.4,1);box-shadow:inset 0 0 0 2px var(--papel),0 0 40px rgba(255,235,190,.5)}
.crisol.nada{animation:treme .32s}
.crisol .orbe{width:84%;height:84%}
.crisol .x{width:30px;height:30px;color:var(--suave)}
.forja.funde #sa{transform:translateX(86px) scale(.6);opacity:0}
.forja.funde #sb{transform:translateX(-86px) scale(.6);opacity:0}
@keyframes pop{from{transform:scale(.4)}to{transform:none}}
@keyframes treme{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.info{min-height:40px;padding:0 18px;text-align:center;font-size:14px;line-height:1.3;color:var(--papel);display:flex;align-items:center;justify-content:center}
.info b{font-weight:800}

/* pedidos */
.pedidos{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 12px 8px}
.ped{min-height:84px;border-radius:14px;background:var(--vidro);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.ped h5{margin:0;font-size:12px;font-weight:700;line-height:1.15;color:var(--suave)}
.ped p{margin:0;font-size:13.5px;line-height:1.22;flex:1}
.ped .pr{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ped .val{font-weight:800;font-size:13.5px;color:var(--luz);white-space:nowrap}
.ped.def{background:rgba(255,210,122,.15);box-shadow:inset 0 0 0 1.5px #ffd27a}
.ped.def h5{color:#ffd27a}
.ped h5 .ui{font-size:14px;margin-right:3px}
.pedidos.um{grid-template-columns:1fr}
.ped .aguarda{font-size:12.5px;color:var(--suave)}

/* elementos */
.mesa{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 10px 8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px 2px;align-content:start}
.el{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;position:relative;min-width:0}
.orbe{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 36% 28%,color-mix(in srgb,var(--tinta,#a98) 72%,#fff) 0,var(--tinta,#a98) 52%,color-mix(in srgb,var(--tinta,#a98) 62%,#000) 100%);box-shadow:inset 0 0 0 1.5px rgba(255,245,225,.26),0 2px 6px rgba(0,0,0,.3)}
.orbe svg{width:78%;height:78%;display:block;overflow:visible}
.mini{display:inline-grid;vertical-align:-4px;margin:0 1px}
.mini .orbe{width:19px;height:19px;box-shadow:none}
.ui{width:1em;height:1em;display:inline-block;vertical-align:-.13em}
.el span.nm{font-size:12px;line-height:1.1;font-weight:600;text-align:center;max-width:100%}
.el.gasto .orbe{opacity:.42}
.el.gasto span.nm{color:var(--suave)}
.el.sel .orbe{box-shadow:0 0 0 3px var(--papel)}
.el.dica .orbe{animation:dica 1s ease-in-out infinite}
@keyframes dica{50%{box-shadow:0 0 0 5px var(--luz)}}

/* abas */
.abas{display:flex;gap:3px;margin:0 12px;padding:4px;background:var(--vidro);border-radius:999px;margin-bottom:calc(10px + env(safe-area-inset-bottom));flex:none}
.abas button{flex:1;padding:9px 0;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--suave)}
.abas button.on{background:var(--mar);color:#04262a}
.painel{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 14px 12px}

/* evolução */
.up{padding:12px 0;border-bottom:1px solid var(--fio)}
.up:last-child{border:0}
.up .t{display:flex;align-items:center;justify-content:space-between;gap:10px}
.up h3{margin:0;font-family:var(--titulo);font-weight:500;font-size:20px}
.up p{margin:4px 0 0;font-size:14.5px;line-height:1.35;color:var(--suave)}
.up .pg{padding:8px 14px;border-radius:999px;background:var(--mar);color:#04262a;font-weight:800;font-size:14.5px;white-space:nowrap}
.up .pg:disabled{background:var(--vidro);color:var(--suave)}
.up .lns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.up .lns .pg{flex:1}

/* árvore */
.tronco{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 2px;margin-bottom:6px}
.no{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;text-align:center}
.no .orbe{width:40px;height:40px}
.no .nm{font-size:11.5px;font-weight:600;line-height:1.1;max-width:100%}
.no .rc{display:flex;align-items:center;justify-content:center;gap:1px;font-size:10.5px;line-height:1;opacity:.92;margin-top:1px}
.no .rc .mini .orbe{width:15px;height:15px}
.no.oculto .orbe{background:var(--vidro);box-shadow:inset 0 0 0 1px var(--fio);color:var(--suave);font-size:15px;font-weight:800}
.no.morto .orbe{background:#55524f;filter:grayscale(1);opacity:.7}
.no.morto .nm{color:var(--suave);text-decoration:line-through}
.nocel{margin:8px auto 10px;width:90px}
.nocel .orbe{width:54px;height:54px}
.ramos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ramo{display:flex;flex-direction:column;gap:9px;border-top:3px solid var(--cor);padding-top:7px;align-items:center;min-width:0}
.ramo.extinta{--cor:var(--cinza)!important}
.ramo h4{margin:0;font-size:14px;font-weight:800;text-align:center}
.ramo h4 small{display:block;font-size:11.5px;font-weight:600;color:var(--suave);margin-top:1px}
.ramo h4 small.ok{color:#8fe8c4}
.ramo h4 small.mal{color:#ffb27a}
.faixa{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-family:var(--titulo);font-weight:500;font-size:18px;color:var(--suave);white-space:nowrap}
.painel>.faixa:first-child{margin-top:4px}
.faixa::before,.faixa::after{content:"";flex:1;height:1px;background:var(--fio)}
.faixa.agora{color:var(--papel);font-weight:800}
.faixa.agora::before,.faixa.agora::after{height:2px;background:var(--mar)}
.leg{margin:-4px 0 10px;text-align:center;font-size:12.5px;color:var(--suave)}
.leg .ui{color:#ffd27a;font-size:14px}
.nob{position:relative;display:block}
.esc{position:absolute;right:-5px;bottom:-3px;font-size:17px;line-height:0;color:#ffd27a;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}

/* fim */
#fim .painel{padding-top:calc(22px + env(safe-area-inset-top))}
#fim h1{font-family:var(--titulo);font-weight:800;font-size:40px;line-height:1.02;letter-spacing:-.02em;margin:0}
#fim .cron{font-family:var(--titulo);font-size:18.5px;line-height:1.5;margin:14px 0 6px}
#fim .cron p{margin:0 0 9px}
#fim .num{color:var(--suave);font-size:14.5px;margin:8px 0 6px}
#fim .credito{margin-bottom:16px}
#fim .acoes{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));flex:none}

/* enciclopédia */
.enctopo{display:flex;align-items:center;gap:8px;padding:12px 12px 6px;padding-top:calc(12px + env(safe-area-inset-top))}
.enctopo button{font-weight:700;font-size:14.5px;color:var(--suave);padding:6px 8px 6px 2px;white-space:nowrap}
.enctopo h2{margin:0;font-family:var(--titulo);font-weight:800;font-size:25px;letter-spacing:-.01em}
.encnum{padding:0 14px 8px;font-size:14px;font-weight:700}
.encnum .barra{height:5px;border-radius:9px;background:var(--vidro);margin-top:6px;overflow:hidden}
.encnum .barra i{display:block;height:100%;background:var(--mar);border-radius:9px}
.encnum .fos{display:flex;align-items:center;gap:6px;margin-top:7px;font-weight:600;color:var(--suave);font-size:13.5px}
.encnum .fos .mini .orbe{width:21px;height:21px}
.encgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px 2px;margin-bottom:8px}
.lin-t{margin:12px 0 7px;font-size:14px;font-weight:800;color:var(--cor)}
.fimlin{padding:10px 0;border-bottom:1px solid var(--fio)}
.fimlin:last-child{border:0}
.fimlin b{display:block;font-family:var(--titulo);font-weight:500;font-size:18.5px}
.fimlin span{display:block;margin-top:2px;font-size:14px;line-height:1.35;color:var(--suave)}
.fimlin.nao b{color:var(--suave)}
.rec{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px;font-weight:600;font-size:14.5px;margin-bottom:10px!important}
.etq{text-align:center;color:var(--suave);font-size:14px}
.fossil{display:flex;align-items:center;gap:11px;margin:12px 0;padding:10px 12px;border-radius:14px;background:var(--vidro);font-size:14.5px;line-height:1.35}
.fossil .orbe{flex:none;width:44px;height:44px}

/* modal */
#modal{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(10,6,10,.62)}
#modal.on{display:flex}
.caixa{width:100%;max-height:92%;overflow-y:auto;border-radius:20px;padding:20px 18px;background:var(--fundo);box-shadow:0 0 0 1px var(--fio),0 18px 50px rgba(0,0,0,.5)}
.caixa .ic{display:grid;place-items:center}
.caixa .ic .orbe{width:76px;height:76px}
.caixa h3{margin:8px 0 6px;font-family:var(--titulo);font-weight:800;font-size:27px;line-height:1.1;text-align:center}
.caixa p{margin:0 0 10px;font-size:15.5px;line-height:1.42}
.caixa .acoes{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.caixa.gelo{background:#dcf1f8;color:#0b3440}
.caixa.gelo .btn{background:#0b3440;color:#eaf8fc}
.caixa.seca{background:#f1dcae;color:#3f2a10}
.caixa.seca .btn{background:#3f2a10;color:#fbeed0}
.caixa.meteoro{background:#2b1012;color:#ffe9d6}
.caixa.meteoro .btn{background:#f06a2c;color:#2b1000}
.caixa.peste{background:#203026;color:#e4f5dc}
.caixa.peste .btn{background:#8fd27a;color:#10240f}
.caixa.fome{background:#efe1b4;color:#3a2c10}
.caixa.fome .btn{background:#3a2c10;color:#f8eecb}
.vered{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid color-mix(in srgb,currentColor 22%,transparent);font-size:15px;line-height:1.3}
.vered b{flex:none;width:58px}
@media (max-height:700px){.forja{height:84px}.slot{width:54px;height:54px}.crisol{width:76px;height:76px}.ped{min-height:72px}.info{min-height:36px;font-size:13.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.abertura .fa,.abertura .fb{opacity:0}.abertura .ramo-a{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="app">
  <section class="tela on" id="capa"></section>
  <section class="tela" id="jogo"></section>
  <section class="tela" id="fim"></section>
  <section class="tela" id="enc"></section>
  <div id="frost"></div>
  <div id="modal"></div>
</div>
<script>

/* ---------- regras ---------- */
const vivo=id=>S.k[id]!=null&&!S.ext[id];
const emCiv=()=>S.fase==="civ"||S.fase==="recons";
const noFim=()=>S.fase==="especies"||S.fase==="recup"||emCiv();
const travado=id=>(E[id].era===3&&(!noFim()||!(S.abre&&S.abre[E[id].l])))||(E[id].era===4&&(!emCiv()||!(S.abre2&&S.abre2[E[id].l])));
const descobertas=()=>Object.keys(S.k).filter(id=>E[id].r).length+Object.keys(S.ext).length;
function alcancaveis(){return Object.keys(E).filter(id=>{const x=E[id];return x.r&&S.k[id]==null&&!S.ext[id]&&!travado(id)&&x.r.every(vivo)})}
function custoReserva(){return 8+4*S.res}
function ramoVivo(l){return [...RAMO[l],...RAMO2[l],...RAMO3[l]].some(id=>E[id].l===l&&vivo(id))}
function algumTopo(){return ORDEM.some(l=>vivo(LINHAS[l].topo))}
function algumTopo2(){return ORDEM.some(l=>vivo(TOPO2[l]))}
function criseAtual(){return S.fase==="civ"?CRISES3[S.crise3]:CRISES[S.crise2]}
function esgotado(id){
  return !Object.keys(E).some(o=>{const x=E[o];return x.r&&x.r.includes(id)&&S.k[o]==null&&!S.ext[o]&&!travado(o)&&x.r.every(p=>!S.ext[p])});
}
function sortear(l){return l[Math.floor(Math.random()*l.length)]}
function revelada(){return (S.fase==="especies"||S.fase==="civ")&&S.sinal>=1}
function defesasUrgentes(l){return l.filter(id=>E[id].ad&&(S.fase==="vida"||(revelada()&&Object.values(criseAtual().def).includes(id))))}
function encherPedidos(){
  const alc=alcancaveis();
  S.ord=S.ord.filter(o=>S.k[o.id]==null&&alc.includes(o.id)).map(o=>({id:o.id}));
  const urg=defesasUrgentes(alc);
  if(urg.length&&!S.ord.some(o=>E[o.id].ad)){
    if(S.ord.length>=2)S.ord.pop();
    S.ord.unshift({id:sortear(urg)});
  }
  while(S.ord.length<2){
    const cand=alc.filter(id=>!S.ord.some(o=>o.id===id));
    if(!cand.length)break;
    const dif=cand.filter(id=>!E[id].ad&&E[id].l&&!S.ord.some(o=>E[o.id].l===E[id].l));
    S.ord.push({id:sortear(dif.length?dif:cand)});
  }
}
function sinaisDaFase(){
  if(S.fase==="vida")return SINAIS;
  if(S.fase==="especies"||S.fase==="civ"){const c=criseAtual(),e=S.fase==="civ";return [[e?EN6:EN4,e?"Há algo errado no ar. Ainda não dá para saber o que vem.":"O clima está mudando. Ainda não dá para saber o que vem."],[6,c.aviso],[3,c.aviso2]]}
  return [];
}
function gastar(){S.en=Math.max(0,S.en-1);atualizaSinal()}
function atualizaSinal(){sinaisDaFase().forEach((s,i)=>{if(S.en<=s[0]&&i>S.sinal)S.sinal=i})}
function descobrir(id,semBonus){
  const pista=S.ord.some(o=>o.id===id);
  S.k[id]=1;S.erroSeg=0;registrar(id);
  const l=E[id].l;
  if(l&&!S.prim)S.prim=l;
  const b=pista||semBonus?PREM_PISTA:PREM_INT;
  S.vit+=b;
  G.info=`<span><b>${!pista&&!semBonus?"Intuição: ":""}+${b} ${UI.vit}. ${E[id].n}.</b> ${E[id].f}</span>`;
  encherPedidos();
}
function combinar(a,b){
  const k=chave(a,b);let id=RECEITA[k];
  const comDica=G.dica&&chave(...G.dica)===k;
  G.res=null;G.dica=null;
  if(id&&travado(id)){G.res={x:1};G.info="Essa mistura ainda não reage. Por enquanto, o mundo não está pronto para ela.";return}
  if(id&&S.ext[id]){G.res={i:"gelo"};G.info=`${E[id].n} se perdeu para sempre. Esse caminho fechou nesta partida.`;return}
  if(id&&S.k[id]!=null){G.res={id};G.info=`Você já conhece ${E[id].n}. Essa repetição não gasta energia.`;return}
  if(!id&&S.tent[k]){G.res={x:1};G.info="Você já tentou essa mistura. Nada acontece, e a energia fica.";return}
  gastar();
  if(id){descobrir(id,comDica);G.res={id,novo:1};
    if(id==="celula"){salvar();abrirEraVida();return}
  }else{S.tent[k]=1;S.erros++;S.erroSeg=(S.erroSeg||0)+1;G.res={x:1};G.info="Nada se formou. Essa mistura custou 1 de energia."}
  depois();
}
function depois(){
  salvar();
  if(S.en<=0)zero();
  else if(!alcancaveis().length)seguirZero();
}
function zero(){
  if(S.vit>=custoReserva()&&S.res<RES_MAX){
    const msg={materia:"Sem energia, o planeta esfria antes de surgir a vida.",vida:"Sem energia, o gelo chega agora.",degelo:"Sem energia, a era termina aqui.",especies:"Sem energia, a crise chega agora.",recup:"Sem energia, a era termina aqui.",civ:"Sem energia, a crise chega agora.",recons:"Sem energia, esta história termina aqui."}[S.fase];
    modal({ic:"planeta",t:"A energia acabou",h:`<p>${msg}</p>`,b:[
      {t:`Comprar Reserva (+${RES_GANHO}) por ${custoReserva()} ${UI.vit}`,f:()=>{comprarReserva();pintar()}},
      {t:"Seguir sem comprar",c:"vazado",f:seguirZero}]});
  }else seguirZero();
}
function seguirZero(){
  if(S.fase==="materia")finalizar("esteril");
  else if(S.fase==="vida")crise();
  else if(S.fase==="degelo")fimDegelo();
  else if(S.fase==="especies")crise2();
  else if(S.fase==="recup")fimRecup();
  else if(S.fase==="civ")crise3();
  else finalizar();
}
function comprarReserva(){if(S.vit<custoReserva()||S.res>=RES_MAX)return;S.vit-=custoReserva();S.res++;S.en+=RES_GANHO;S.enMax=Math.max(S.enMax,S.en);salvar()}
function comprarDica(){
  if(S.vit<DICA)return;
  const alc=alcancaveis();if(!alc.length)return;
  const ped=alc.find(id=>S.ord.some(o=>o.id===id));
  const id=ped||alc.sort((x,y)=>E[x].nv-E[y].nv)[0];
  S.vit-=DICA;G.dica=E[id].r.slice();G.aba="mesa";G.info=`Sua intuição diz: tente <b>${E[E[id].r[0]].n}</b> com <b>${E[E[id].r[1]].n}</b>.`;salvar();pintar();
}
function comprarRefugio(l){if(S.vit<REFUGIO)return;S.vit-=REFUGIO;S.guarda[l]=1;salvar();pintar()}
function abrirEraVida(){
  S.fase="vida";S.en=EN2;S.enMax=EN2;S.res=0;S.k.sol=1;S.ord=[];encherPedidos();salvar();
  modal({ic:"celula",el:1,t:"A primeira célula",h:`<p>Começa a Era da Vida, e o Sol entra na sua mesa.</p><p>A vida pode seguir três caminhos: a <b>Luz</b>, o <b>Calor</b> das fontes e a <b>Caça</b>.</p><p>Cada combinação agora aproxima o gelo.</p>`,b:[{t:"Continuar",f:pintar}]});
}
function crise(){
  const r={};
  ORDEM.forEach(l=>{
    const mem=RAMO[l].filter(id=>E[id].l===l&&vivo(id));
    if(!mem.length)r[l]="ausente";
    else if(l==="calor")r[l]="abrigada";
    else if(S.k[LINHAS[l].ad]!=null)r[l]="adaptada";
    else if(S.guarda[l])r[l]="refugio";
    else{r[l]="extinta";mem.forEach(id=>{S.ext[id]=1;delete S.k[id]})}
  });
  S.gelo=r;S.fase="degelo";S.en=EN3;S.enMax=EN3;S.res=0;S.guarda={};encherPedidos();salvar();
  const T={ausente:"Ainda não existia.",abrigada:"O calor do fundo manteve tudo vivo.",adaptada:"Dormiu e acordou depois do gelo.",refugio:"Sobreviveu no refúgio.",extinta:"Extinta. Receitas ligadas a ela fecharam."};
  const h=`<p>A Terra virou uma bola de neve, de polo a polo.</p>`+ORDEM.map(l=>`<div class="vered"><b>${LINHAS[l].n}</b><span>${r[l]==="adaptada"?`Salva por ${E[LINHAS[l].ad].n}: dormiu e acordou depois do gelo.`:T[r[l]]}</span></div>`).join("");
  modal({ic:"gelo",cor:"#2f8fb8",t:"A Grande Glaciação",h,cx:"gelo",b:[{t:"Ver o degelo",f:()=>{G.aba="mesa";pintar();if(!alcancaveis().length)fimDegelo()}}]});
}
function fimDegelo(){

    const ls=cand.filter(l=>!S.guarda[l]&&ramoVivo(l));
    const pr=cand.filter(l=>S.guarda[l]).map(l=>LINHAS[l].n);
    h+=`<div class="up"><div class="t"><h3>Refúgio</h3><span class="res vit">${REFUGIO} ${UI.vit}</span></div><p>Salva uma linhagem inteira da próxima crise, mesmo sem defesa.${pr.length?` Protegida: ${pr.join(" e ")}.`:""}</p><div class="lns">${ls.length?ls.map(l=>`<button class="pg" data-ref="${l}" ${S.vit>=REFUGIO?"":"disabled"}>${LINHAS[l].n}</button>`).join(""):`<p>Crie um ser de uma linhagem para poder protegê-la.</p>`}</div></div>`;
  }
  return h;
}
function noArv(id,cls){
  const x=E[id],esc=x.ad?`<span class="esc" title="Defesa">${UI.escudo}</span>`:"";
  if(S.ext[id])return `<div class="no morto ${cls||""}"><span class="nob">${orbe(id)}${esc}</span><span class="nm">${x.n}</span></div>`;
  if(S.k[id]==null)return `<div class="no oculto ${cls||""}"><span class="nob"><span class="orbe">?</span>${esc}</span></div>`;
  return `<div class="no ${cls||""}"><span class="nob">${orbe(id)}${esc}</span><span class="nm">${x.n}</span>${x.r?`<span class="rc">${x.r.map(mini).join("+")}</span>`:""}</div>`;
}
const ST={ausente:["Não surgiu",""],abrigada:["Sobreviveu no calor","ok"],adaptada:["Sobreviveu","ok"],refugio:["Sobreviveu no refúgio","ok"],extinta:["Extinta","mal"],fora:["Ficou para trás",""],escapou:["Escapou","ok"]};
function stVida(l){
  if((S.gelo2&&S.gelo2[l]==="extinta")||(S.gelo3&&S.gelo3[l]==="extinta"))return ST.extinta;
  if(S.gelo){
    const g=S.gelo[l];
    if(g==="ausente"&&RAMO[l].some(id=>E[id].l===l&&S.k[id]!=null))return ["Surgiu depois do gelo","ok"];
    if(g==="adaptada")return [`Salva por ${E[LINHAS[l].ad].n}`,"ok"];
    return ST[g];
  }
  if(!RAMO[l].some(id=>E[id].l===l&&vivo(id)))return ["Ainda não surgiu",""];
  if(l==="calor")return ["Fora de risco","ok"];
  if(S.k[LINHAS[l].ad]!=null)return [`Protegida por ${E[LINHAS[l].ad].n}`,"ok"];
  if(S.guarda[l])return ["Em refúgio","ok"];
  return ["Em risco","mal"];
}
function stEsp(l){
  if(S.gelo3&&S.gelo3[l]==="extinta")return ST.extinta;
  if(S.gelo2){
    if(S.gelo2[l]==="adaptada")return [`Salva por ${E[CRISES[S.crise2].def[l]].n}`,"ok"];
    return ST[S.gelo2[l]];
  }
  if(!S.abre)return ["",""];
  if(!S.abre[l])return ST.fora;
  if(S.guarda[l])return ["Em refúgio","ok"];
  if(S.fase!=="especies")return ST.fora;
  if(!revelada())return ["Crise desconhecida",""];
  const c=CRISES[S.crise2];
  if(l===c.escapa)return ["Fora de risco","ok"];
  if(S.k[c.def[l]]!=null)return [`Protegida por ${E[c.def[l]].n}`,"ok"];
  return ["Em risco","mal"];
}
function stCiv(l){
  if(S.gelo3){
    if(S.gelo3[l]==="adaptada")return [`Salva por ${E[CRISES3[S.crise3].def[l]].n}`,"ok"];
    return ST[S.gelo3[l]];
  }
  if(!S.abre2)return ["",""];
  if(!S.abre2[l])return ST.fora;
  if(S.guarda[l])return ["Em refúgio","ok"];
  if(!revelada())return ["Crise desconhecida",""];
  const c=CRISES3[S.crise3];
  if(l===c.escapa)return ["Fora de risco","ok"];
  if(S.k[c.def[l]]!=null)return [`Protegida por ${E[c.def[l]].n}`,"ok"];
  return ["Em risco","mal"];
}
function arvore(){
  const col=(m,f)=>ORDEM.map(l=>{
    const [t,c]=f(l);
    return `<div class="ramo ${t==="Extinta"?"extinta":""}" style="--cor:${LINHAS[l].cor}"><h4>${LINHAS[l].n}${t?`<small class="${c}">${t}</small>`:""}</h4>${m[l].map(id=>noArv(id)).join("")}</div>`;
  }).join("");
  const faixa=(n,on)=>`<h3 class="faixa${on?" agora":""}">${n}</h3>`;
  const f=S.fase;
  return faixa("Era da Matéria",f==="materia")+`<div class="tronco">${[...BASE1,...MATERIA.filter(i=>i!=="celula")].map(id=>noArv(id)).join("")}</div>${noArv("celula","nocel")}`
    +faixa("Era da Vida",f==="vida"||f==="degelo")+`<p class="leg">${UI.escudo} marca uma defesa contra a crise da era</p><div class="ramos">${col(RAMO,stVida)}</div>`
    +faixa("Era das Espécies",f==="especies"||f==="recup")+`<div class="ramos">${col(RAMO2,stEsp)}</div>`
    +faixa("Era da Civilização",f==="civ"||f==="recons")+`<div class="ramos">${col(RAMO3,stCiv)}</div>`;
}
function pintarFim(){
  const fin=S.fim,F=FINAIS[fin],c=cronica(fin);
  $("#app").className=fin==="esteril"?"":"degelo";$("#frost").style.opacity=0;
  $("#fim").innerHTML=`<div class="painel"><h1>${F.t}</h1><div class="cron">${c.map(p=>`<p>${p}</p>`).join("")}</div><p class="num">${descobertas()} de ${TOTAL} descobertas, ${Object.keys(S.ext).length} extintas, ${finais().length} de ${Object.keys(FINAIS).length} finais encontrados.</p>${(S.fossil||[]).length?`<div class="fossil"><span class="orbe" style="--tinta:#6e5238">${svgI("fossil")}</span><span>${S.fossil.length>1?"Você encontrou fósseis":"Você encontrou um fóssil"}: ${S.fossil.map(l=>LINHAS[l].n).join(", ")}. Cada um vale +${FOS_BONUS} de Vitalidade na próxima partida.</span></div>`:""}${CREDITO}${arvore()}</div><div class="acoes"><button class="btn vazado" data-a="capa">Sair</button><button class="btn" data-a="nova">Jogar de novo</button></div>`;
  tela("fim");
}

/* ---------- toques ---------- */
function tocarEl(id){
  if(G.trava)return;
  G.res=null;G.info="";
  if(!G.a){G.a=id;pintar();return}
  G.b=id;pintar();
  if(G.rapido)return resolver();
  G.trava=true;
  requestAnimationFrame(()=>{const f=$("#forja");if(f)f.classList.add("funde")});
  setTimeout(resolver,360);
}
function resolver(){
  const a=G.a,b=G.b;G.a=G.b=null;G.trava=false;
  combinar(a,b);
  pintar();
  if(navigator.vibrate&&G.res&&G.res.novo)try{navigator.vibrate(18)}catch(e){}
}
function novaPartida(){
  gravarLista(PARTIDAS,(+lerLista(PARTIDAS)||0)+1);
  S=nova();G.aba="mesa";G.a=G.b=null;G.res=null;G.dica=null;G.info="";
  const fs=lerLista(FOS),usa=fs.slice(0,FOS_MAX);
  gravarLista(FOS,fs.slice(usa.length));
  S.vit+=usa.length*FOS_BONUS;
  encherPedidos();salvar();pintar();
  if(usa.length)modal({ic:"fossil",cor:"#6e5238",t:usa.length>1?"Fósseis encontrados":"Fóssil encontrado",h:`<p>Restos de ${usa.map(l=>LINHAS[l].n).join(" e de ")} ajudam este novo planeta: você começa com +${usa.length*FOS_BONUS} de Vitalidade.</p>`,b:[{t:"Começar",f:()=>{}}]});
}
function abrirEnc(volta){G.encVolta=volta;G.encAba="desc";$("#frost").style.opacity=0;pintarEnc()}
function pintarEnc(){
  const v=lerLista(ENC),fin=finais(),nf=Object.keys(FINAIS).length,fos=lerLista(FOS).length;
  const item=id=>v.includes(id)?`<button class="el" data-enc="${id}">${orbe(id)}<span class="nm">${E[id].n}</span></button>`:`<div class="no oculto"><span class="nob"><span class="orbe">?</span></span></div>`;
  const grade=l=>`<div class="encgrid">${l.map(item).join("")}</div>`;
  const faixa=n=>`<h3 class="faixa">${n}</h3>`;
  const linhas=m=>ORDEM.map(l=>`<div class="lin-t" style="--cor:${LINHAS[l].cor}">${LINHAS[l].n}</div>${grade(m[l])}`).join("");
  const num=G.encAba==="desc"?[v.length,TOTAL,"descobertas"]:[fin.length,nf,"finais"];
  const fh=fos?`<div class="fos">${`<span class="mini"><span class="orbe" style="--tinta:#6e5238">${svgI("fossil")}</span></span>`}${fos} ${fos>1?"fósseis guardados":"fóssil guardado"} para a próxima partida</div>`:"";
  const corpo=G.encAba==="desc"
    ?faixa("Era da Matéria")+grade(MATERIA)+faixa("Era da Vida")+linhas(RAMO)+faixa("Era das Espécies")+linhas(RAMO2)+faixa("Era da Civilização")+linhas(RAMO3)
    :Object.keys(FINAIS).map(k=>fin.includes(k)?`<div class="fimlin"><b>${FINAIS[k].t}</b><span>${FINAIS[k].x}</span></div>`:`<div class="fimlin nao"><b>?</b><span>Final ainda não encontrado.</span></div>`).join("");
  $("#enc").innerHTML=`<div class="enctopo"><button data-a="encvolta">← Voltar</button><h2>Enciclopédia</h2></div><div class="encnum">${num[0]} de ${num[1]} ${num[2]}<div class="barra"><i style="width:${num[0]/num[1]*100}%"></i></div>${fh}</div><div class="painel">${corpo}</div><nav class="abas"><button class="${G.encAba==="desc"?"on":""}" data-enca="desc">Descobertas</button><button class="${G.encAba==="fin"?"on":""}" data-enca="fin">Finais</button></nav>`;
  tela("enc");
}
function detalheEnc(id){
  const x=E[id],era=MATERIA.includes(id)?"Era da Matéria":x.era===4?"Era da Civilização":x.era===3?"Era das Espécies":"Era da Vida";
  const tipo={esporo:"Defesa contra a Grande Glaciação",cisto:"Defesa contra a Grande Glaciação",semente:"Defesa contra a Grande Seca",casca:"Defesa contra a Grande Seca",toca:"Defesa contra o Meteoro",concha:"Defesa contra o Meteoro",remedio:"Defesa contra a Grande Peste",propolis:"Defesa contra a Grande Peste",celeiro:"Defesa contra a Grande Fome",viveiro:"Defesa contra a Grande Fome"}[id]||(x.apex?"Topo de linhagem":"");
  const et=[era,x.l?LINHAS[x.l].n:"",tipo].filter(Boolean).join(", ");
  modal({ic:id,el:1,t:x.n,h:`<p class="rec">${mini(x.r[0])} ${E[x.r[0]].n} + ${mini(x.r[1])} ${E[x.r[1]].n}</p><p>${x.f}</p><p class="etq">${et}</p>`,b:[{t:"Fechar",f:()=>{}}]});
}
document.addEventListener("click",ev=>{
  const m=ev.target.closest("[data-m]");
  if(m){const b=$("#modal")._b[+m.dataset.m];fechaModal();b.f();return}
  const t=ev.target.closest("[data-el],[data-aba],[data-a],[data-ref],[data-enc],[data-enca],#sa,#sb");
  if(!t)return;
  if(t.id==="sa"||t.id==="sb"){if(!G.trava&&t.id==="sa"&&G.a){G.a=null;pintar()}return}
  const d=t.dataset;
  if(d.el)return tocarEl(d.el);
  if(d.aba){G.aba=d.aba;return pintar()}
  if(d.enc)return detalheEnc(d.enc);
  if(d.enca){G.encAba=d.enca;return pintarEnc()}
  if(d.ref)return comprarRefugio(d.ref);
  switch(d.a){
    case "nova":return novaPartida();
    case "continuar":S=carregar();G.aba="mesa";if(S)encherPedidos();pintar();if(S&&S.en<=0&&S.fase!=="fim")zero();return;
    case "como":return comoJogar();
    case "enc":return abrirEnc("capa");
    case "encvolta":return G.encVolta==="capa"?pintarCapa():pintar();
    case "capa":S=null;return pintarCapa();
    case "reserva":comprarReserva();return pintar();
    case "dica":return comprarDica();
    case "encerrar":{
      const seg=(S.fase==="degelo"&&algumTopo())||(S.fase==="recup"&&algumTopo2());
      return modal({ic:"planeta",t:"Encerrar a era?",h:`<p>${seg?`O que ainda não foi descoberto aqui fica para trás, e a ${S.fase==="degelo"?"Era das Espécies":"Era da Civilização"} começa.`:"A história termina aqui, com o que estiver vivo agora."}</p>`,b:[{t:seg?"Seguir para a próxima era":"Encerrar",f:seguirZero},{t:"Continuar jogando",c:"vazado",f:()=>{}}]});
    }
    case "menu":return modal({ic:"planeta",t:"Gênese",h:"",b:[{t:"Voltar ao jogo",f:()=>{}},{t:"Como jogar",c:"vazado",f:comoJogar},{t:"Enciclopédia",c:"vazado",f:()=>abrirEnc("jogo")},{t:"Recomeçar partida",c:"vazado",f:novaPartida},{t:"Sair para a capa",c:"vazado",f:()=>{S=null;pintarCapa()}}]});
  }
});
window.__G={get S(){return S},G,E,ICO,RECEITA,chave,combinar,alcancaveis,novaPartida,pintar,FINAIS,CRISES,seguirZero,finalizar};
pintarCapa();
</script>
