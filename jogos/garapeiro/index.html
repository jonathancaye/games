<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f5e3a">
<title>Garapeiro</title>
<style>
:root{--bg:#f6efd9;--card:#fffaf0;--ink:#2b2a22;--muted:#7a735f;--green:#2f7d4a;--green-d:#1f5e3a;--yellow:#f2c230;--orange:#e8772e;--red:#c8483a;--line:#e3d8b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#173f28;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.top,.hud{display:flex;align-items:center;gap:6px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--green-d);color:#fff;font-weight:700;font-size:13px}
.top a{color:#fff;text-decoration:none;font-size:18px;padding:0 4px}
.grow{flex:1}
.chip{background:rgba(255,255,255,.15);padding:5px 9px;border-radius:999px;white-space:nowrap}
.wx{display:flex;gap:12px;align-items:center;margin:10px 12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.wx .big{font-size:40px;line-height:1}
.wx .tx{flex:1;min-width:0}
.wx b{font-size:16px}
.wx small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#e8f4ea;color:var(--green);margin-top:5px}
.tag.hot{background:#fde6d5;color:var(--orange)}
.pills{display:flex;gap:3px;margin:10px 12px 0;background:#e9dfc2;padding:4px;border-radius:999px}
.pills button{flex:1;border:0;background:transparent;padding:8px 0;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);font-family:inherit}
.pills button.on{background:var(--green);color:#fff}
.tog{display:inline-flex;background:#e9dfc2;border-radius:999px;padding:3px;gap:2px;vertical-align:middle}
.tog button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-weight:700;font-size:12.5px;line-height:1;font-family:inherit;color:var(--muted)}
.tog button.on{background:var(--green);color:#fff}
.tog button.off.on{background:#8a8170}
.ajrow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.panel{flex:1;overflow-y:auto;padding:10px 12px 4px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.row .ic{font-size:26px;width:32px;text-align:center}
.row .tx{flex:1;min-width:0}
.row .tx b{font-size:15px}
.row .tx small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.row .tx small.warn{color:var(--red)}
.qty{display:flex;align-items:center;gap:6px}
.btn{border:0;border-radius:10px;font-weight:700;font-size:14px;padding:9px 12px;background:var(--green);color:#fff;font-family:inherit;cursor:pointer}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.ghost{background:#e9dfc2;color:var(--ink)}
.btn.or{background:var(--orange)}
.btn:disabled{opacity:.35}
.btn.done{background:transparent;color:var(--green);padding:7px 4px}
.go{margin:6px 12px calc(12px + env(safe-area-inset-bottom));padding:15px;font-size:17px;border-radius:14px;box-shadow:0 3px 0 #b55a1f}
.sl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px 7px;margin-bottom:8px}
.sl .hd{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.sl .hd span{color:var(--orange)}
.sl small{color:var(--muted);font-size:11.5px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#e3d8b8;margin:9px 0 5px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--orange);border:3px solid #fff}
.info{background:#fff3d6;border:1px dashed #e6c46a;border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.loc{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px 8px;text-align:center}
.loc.on{border-color:var(--green);background:#e8f4ea}
.loc .ic{font-size:28px}
.loc b{display:block;font-size:13px;margin-top:2px}
.loc small{display:block;font-size:11px;color:var(--muted);margin:2px 0 7px;line-height:1.35}
.loc .btn{width:100%}
#cv{flex:1;width:100%;min-height:0;display:block;background:#9fc3dc}
.bot{padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.stk{display:flex;gap:5px;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:9px}
.stk span{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 2px;white-space:nowrap}
.ctrl{display:flex;gap:8px;align-items:center}
.ctrl .pills{flex:1;margin:0}
/* title */
#title{background:linear-gradient(170deg,#2f7d4a,#173f28);color:#fff;align-items:center;justify-content:center;text-align:center}
#title .back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;color:#cfe8d5;text-decoration:none;font-size:13px;font-weight:600}
.logo{font-size:84px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
#title h1{margin:10px 0 4px;font-size:40px;letter-spacing:.5px;color:#ffe08a}
#title p{margin:0 32px 26px;color:#d6ead9;font-size:15px;line-height:1.4}
#title .btn{display:block;width:240px;margin:8px auto;padding:14px;font-size:16px;border-radius:14px}
#title .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.rec{margin-top:14px;font-size:13px;color:#ffe08a}
/* modal */
#modal{position:absolute;inset:0;background:rgba(20,30,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
.mbox{background:var(--bg);border-radius:18px;width:100%;max-height:100%;overflow-y:auto;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mbox h2{margin:0 0 6px;font-size:20px;color:var(--green-d)}
.mbox p{margin:6px 0;font-size:14px;line-height:1.45}
.mbox ul{margin:6px 0;padding-left:18px;font-size:13.5px;line-height:1.5}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv.tot{font-weight:800;font-size:16px;border-bottom:0;padding-top:8px}
.pos{color:var(--green)}.neg{color:var(--red)}
.sec{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px}
.lst{font-size:13.5px;line-height:1.6}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mbtns .btn{flex:1;padding:13px;font-size:15px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2a22;color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:20}
#toast.on{opacity:.95}
</style>
</head>
<body>
<div id="app">

<section id="title" class="screen on">
  <a class="back" href="../../">← Mesa de Jogos</a>
  <div class="logo">🎋</div>
  <h1>Garapeiro</h1>
  <p>Monte sua barraca de caldo de cana e faça o maior caixa em 30 dias.</p>
  <button class="btn or" id="bCont">Continuar</button>
  <button class="btn" id="bNew">Nova temporada</button>
  <button class="btn ghost" id="bHelp">Como jogar</button>
  <div class="rec" id="recTxt"></div>
</section>

<section id="morning" class="screen">
  <div class="top"><a href="#" id="toTitle">☰</a><span class="chip" id="mDay"></span><span class="grow"></span><span class="chip" id="mCash"></span><span class="chip" id="mRep"></span></div>
  <div class="wx" id="mWx"></div>
  <div class="pills" id="tabs"><button data-t="estoque">Estoque</button><button data-t="receita">Receita</button><button data-t="pontos">Pontos</button><button data-t="equip">Equip.</button></div>
  <div class="panel" id="panel"></div>
  <button class="btn or go" id="bOpen">Abrir a barraca ▶</button>
</section>

<section id="day" class="screen">
  <div class="hud"><span class="chip" id="dClock"></span><span class="chip" id="dSold"></span><span class="grow"></span><span class="chip" id="dCash"></span></div>
  <canvas id="cv"></canvas>
  <div class="bot">
    <div class="stk" id="dStk"></div>
    <div class="ctrl">
      <div class="pills" id="spd"><button data-s="1">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
      <button class="btn ghost" id="bSkip">Pular ⏭</button>
    </div>
  </div>
</section>

<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const R=Math.random, ri=(a,b)=>Math.floor(a+R()*(b-a+1)), rf=(a,b)=>a+R()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=v=>'R$ '+(Math.round(v*100)/100).toFixed(2).replace('.',',');
const fmt0=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');
const DIAS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const SEASON=30, START_CASH=40, DAY_MIN=600, MS_PER_MIN=75, SPAN=70;
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

const WEATHER={
  chuva:{n:'Chuva',e:'🌧️',t:[17,22],m:.35,w:.18},
  nublado:{n:'Nublado',e:'⛅',t:[20,26],m:.7,w:.30},
  sol:{n:'Sol',e:'☀️',t:[25,31],m:1,w:.36},
  calor:{n:'Calorão',e:'🔥',t:[31,38],m:1.35,w:.16}
};
const WORDER=['chuva','nublado','sol','calor'];
const ITEMS={
  cana:{n:'Cana',e:'🎋',pack:12,price:9,u:'canas'},
  limao:{n:'Limão',e:'🍋',pack:12,price:4,u:'limões'},
  gelo:{n:'Gelo',e:'🧊',pack:60,price:5,u:'cubos'},
  copos:{n:'Copos',e:'🥤',pack:50,price:4,u:'copos'}
};
const LOCS=[
  {id:'feira',n:'Feira do bairro',e:'⛺',rent:0,base:60,tol:1,unlock:0,wk:1.3,wd:1,d:'Movimento tranquilo'},
  {id:'praca',n:'Praça central',e:'🌳',rent:15,base:110,tol:1.1,unlock:120,wk:1.2,wd:1,d:'Bom movimento todo dia'},
  {id:'praia',n:'Orla da praia',e:'🏖️',rent:40,base:190,tol:1.25,unlock:350,wk:1.5,wd:1,d:'Lota no sol, some na chuva',wx:1.3},
  {id:'estadio',n:'Porta do estádio',e:'🏟️',rent:90,base:300,tol:1.4,unlock:900,wk:1.8,wd:.5,d:'Explode no fim de semana'}
];
const UPS=[
  {id:'moenda1',n:'Moenda elétrica',e:'⚙️',d:'Atende 2× mais rápido: fila bem menor',price:150},
  {id:'moenda2',n:'Moenda industrial',e:'🏭',d:'Atende 4× mais rápido que a manual',price:450,req:'moenda1'},
  {id:'ajudante',n:'Ajudante',e:'🧑‍🍳',d:'Atende junto com você (+70% de ritmo). Salário R$ 25/dia',price:80,wage:25},
  {id:'radio',n:'Rádio de pilha',e:'📻',d:'Previsão do tempo mais certeira',price:40},
  {id:'faixa',n:'Faixa colorida',e:'🎏',d:'+15% de gente parando na barraca',price:60},
  {id:'isopor',n:'Caixa térmica',e:'🧰',d:'Guarda metade do gelo para o dia seguinte',price:70},
  {id:'guardasol',n:'Guarda-sol',e:'⛱️',d:'+10% de gente parando quando faz calor',price:80},
  {id:'geladeira',n:'Geladeira',e:'❄️',d:'Cana dura +2 dias e limão +3',price:200}
];

const SAVE='garapeiro_v1', BEST='garapeiro_best';
let S=null, tab='estoque', D=null, speed=2, raf=0, lastTs=0;

function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE);return s?JSON.parse(s):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE)}catch(e){}}
function getBest(){try{return +localStorage.getItem(BEST)||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem(BEST,String(v))}catch(e){}}

/* ---------- helpers ---------- */
const loc=()=>LOCS.find(l=>l.id===S.loc);
const ajOn=()=>!!S.up.ajudante&&S.ajOn!==false;
const svcMin=()=>(S.up.moenda2?1.5:S.up.moenda1?3:6)/(ajOn()?1.7:1);
const cap=()=>Math.round(DAY_MIN/svcMin());
const wage=()=>ajOn()?25:0;
const dayCost=()=>loc().rent+wage();
const life=it=>it==='cana'?2+(S.up.geladeira?2:0):4+(S.up.geladeira?3:0);
const dow=d=>DIAS[(d-1)%7];
const weekend=d=>((d-1)%7)>=5;
function have(it){const v=S.stock[it];return Array.isArray(v)?v.filter(b=>b.exp>=S.day).reduce((a,b)=>a+b.q,0):v}
function expiring(it){return S.stock[it].filter(b=>b.exp<=S.day).reduce((a,b)=>a+b.q,0)}
function take(it,n){
  if(!Array.isArray(S.stock[it])){S.stock[it]-=n;return}
  const v=S.stock[it].sort((a,b)=>a.exp-b.exp);
  for(const b of v){if(b.exp<S.day)continue;const k=Math.min(b.q,n);b.q-=k;n-=k;if(!n)break}
  S.stock[it]=v.filter(b=>b.q>0);
}
function costPerCup(){const r=S.rec;return r.cana*(ITEMS.cana.price/ITEMS.cana.pack)/10+r.limao*(ITEMS.limao.price/ITEMS.limao.pack)/10+r.gelo*(ITEMS.gelo.price/ITEMS.gelo.pack)+ITEMS.copos.price/ITEMS.copos.pack}
function cupsPossible(){
  const r=S.rec;let lim=[];
  const jC=Math.floor(have('cana')/r.cana), jL=r.limao?Math.floor(have('limao')/r.limao):1e9;
  const byJ=Math.min(jC,jL)*10, byC=have('copos'), byG=r.gelo?Math.floor(have('gelo')/r.gelo):1e9;
  const n=Math.min(byJ,byC,byG);
  if(byJ===n)lim.push(jC<=jL?'cana':'limão'); if(byC===n)lim.push('copos'); if(byG===n)lim.push('gelo');
  return {n,lim:lim.join(', ')};
}
function approachP(temp){return Math.min(.92,(0.28+S.rep/250)*(S.up.faixa?1.15:1)*(S.up.guardasol&&temp>=29?1.1:1))}
function passers(type,temp,L){
  const wk=weekend(S.day)?L.wk:L.wd;
  let wm=WEATHER[type].m; if(L.wx) wm=Math.pow(wm,L.wx);
  return L.base*wm*wk*(0.7+S.rep/200);
}
let toastT=0;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),1800)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}

/* ---------- game state ---------- */
function newGame(){
  S={v:1,day:1,cash:START_CASH,rep:40,loc:'feira',unl:{feira:1},up:{},
     stock:{cana:[],limao:[],gelo:0,copos:0},rec:{cana:6,limao:2,gelo:3,preco:4},
     buys:[],spent:0,fc:null,hist:[]};
  genForecast();save();tab='estoque';renderMorning();show('morning');
  toast('Compre cana, limão, gelo e copos 🛒');
}
function pickW(){let r=R(),a=0;for(const k of WORDER){a+=WEATHER[k].w;if(r<a)return k}return 'sol'}
function genForecast(){const t=pickW(),W=WEATHER[t];S.fc={type:t,temp:ri(W.t[0],W.t[1])}}
function realWeather(){
  let type=S.fc.type,temp=S.fc.temp;
  if(R()<(S.up.radio?.1:.3)){
    let i=WORDER.indexOf(type),j=i+(R()<.5?-1:1);
    if(j<0)j=1; if(j>3)j=2; type=WORDER[j];
    const W=WEATHER[type];temp=ri(W.t[0],W.t[1]);
  }else{const W=WEATHER[type];temp=clamp(temp+ri(-2,2),W.t[0]-1,W.t[1]+1)}
  return {type,temp};
}

/* ---------- morning UI ---------- */
function renderMorning(){
  $('#mDay').textContent=`Dia ${S.day}/${SEASON} · ${dow(S.day)}`;
  $('#mCash').textContent='💰 '+fmt(S.cash);
  $('#mRep').textContent='⭐ '+Math.round(S.rep);
  const W=WEATHER[S.fc.type],L=loc();
  const exp=passers(S.fc.type,S.fc.temp,L)*approachP(S.fc.temp);
  const lvl=exp<25?'baixo':exp<55?'médio':exp<110?'alto':'muito alto';
  $('#mWx').innerHTML=`<div class="big">${W.e}</div><div class="tx"><b>Previsão: ${W.n}, ${S.fc.temp}°C</b>
    <small>${L.e} ${L.n} · aluguel ${L.rent?fmt(L.rent):'grátis'}${wage()?` · ajudante ${fmt(wage())}`:''}</small>${S.up.ajudante?`<div class="ajrow">🧑‍🍳 Ajudante hoje ${ajTog()}</div>`:''}
    <span class="tag ${exp>=55?'hot':''}">Movimento ${lvl}${weekend(S.day)?' · fim de semana':''}</span></div>`;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const P=$('#panel');
  if(tab==='estoque')P.innerHTML=htmlEstoque();
  else if(tab==='receita'){P.innerHTML=htmlReceita();bindSliders()}
  else if(tab==='pontos')P.innerHTML=htmlPontos();
  else P.innerHTML=htmlEquip();
}
function htmlEstoque(){
  let h='';
  for(const it in ITEMS){
    const I=ITEMS[it],n=have(it),bought=S.buys.filter(b=>b.it===it).length;
    let note=`Pacote: ${I.pack} ${I.u} por ${fmt(I.price)}`,warn='';
    if(it==='cana'||it==='limao'){const e=expiring(it);if(e)warn=`${e} ${e>1?'vencem':'vence'} hoje`;}
    if(it==='gelo'&&n)warn=S.up.isopor?'Metade derrete à noite':'Derrete à noite';
    h+=`<div class="row"><div class="ic">${I.e}</div><div class="tx"><b>${I.n}: ${n}</b>
      <small>${note}</small>${warn?`<small class="warn">${warn}</small>`:''}</div>
      <div class="qty"><button class="btn ghost sm" data-a="unbuy" data-i="${it}" ${bought?'':'disabled'}>−</button>
      <button class="btn sm" data-a="buy" data-i="${it}" ${S.cash>=I.price?'':'disabled'}>+${I.pack}</button></div></div>`;
  }
  const c=cupsPossible();
  h+=`<div class="info">Com este estoque dá para <b>${c.n} copos</b>${c.n?` (limita: ${c.lim})`:''}.<br>Gastos de hoje: <b>${fmt(S.spent)}</b></div>`;
  return h;
}
function htmlReceita(){
  const r=S.rec;
  const sl=(k,lab,min,max,step,val,unit,hint)=>`<div class="sl"><div class="hd">${lab}<span id="v_${k}">${unit(val)}</span></div>
    <input type="range" id="r_${k}" min="${min}" max="${max}" step="${step}" value="${val}"><small>${hint}</small></div>`;
  return sl('cana','🎋 Cana por jarra',3,8,1,r.cana,v=>v+' canas','Jarra = 10 copos. Menos de 5 fica aguado.')+
    sl('limao','🍋 Limão por jarra',0,4,1,r.limao,v=>v+(v==1?' limão':' limões'),'Cada cliente gosta de um jeito.')+
    sl('gelo','🧊 Gelo por copo',0,6,1,r.gelo,v=>v+' cubos','No calor o pessoal quer mais gelo.')+
    sl('preco','💲 Preço do copo',1,15,.5,r.preco,v=>fmt(v),'Calor, bom ponto e boa fama deixam cobrar mais.')+
    `<div class="info" id="recInfo"></div>`;
}
function recInfo(){
  const c=costPerCup(),m=S.rec.preco-c,p=cupsPossible();
  $('#recInfo').innerHTML=`Custo por copo: <b>${fmt(c)}</b> · Margem: <b class="${m>=0?'pos':'neg'}">${fmt(m)}</b><br>Estoque dá para <b>${p.n} copos</b>${p.n?` (limita: ${p.lim})`:''}`;
}
function bindSliders(){
  const units={cana:v=>v+' canas',limao:v=>v+(v==1?' limão':' limões'),gelo:v=>v+' cubos',preco:v=>fmt(v)};

/* ---------- day simulation ---------- */
function startDay(){
  const L=loc(),w=realWeather();
  S.cash-=L.rent+wage();
  const N=Math.max(4,Math.round(passers(w.type,w.temp,L)*rf(.9,1.1)));
  const ws=[],vf=Math.min(1,40/N);
  for(let i=0;i<N;i++){
    const run=R()<.07;
    ws.push({t:clamp((R()+R())/2*DAY_MIN,4,DAY_MIN-4),dir:R()<.5?1:-1,lane:R()<.5?0:1,run,stop:!run&&R()<approachP(w.temp),slot:i%4,look:makeLook(),dec:false,dwell:0,pat:rf(5,13)});
    const lw=ws[ws.length-1];lw.vis=R()<(lw.stop?Math.min(1,vf*1.8):vf);
  }
  ws.sort((a,b)=>a.t-b.t);
  D={type:w.type,temp:w.temp,rent:L.rent,wage:wage(),busy:0,rep0:S.rep,ws,idx:0,t:0,sold:0,rev:0,sats:[],happy:0,reasons:{},
     missStock:0,missQueue:0,rejPrice:0,stopped:0,pass:N,jarra:0,jarras:0,hourly:{},out:null,spin:0,ang:0,
     drops:Array.from({length:90},()=>({x:R(),y:R(),s:rf(.6,1)})),
     clouds:Array.from({length:4},()=>({x:R(),y:rf(.06,.24),s:rf(.7,1.15),v:rf(.008,.02)})),
     city:makeCity()};
  show('day');resize();
  document.querySelectorAll('#spd button').forEach(b=>b.classList.toggle('on',+b.dataset.s===speed));
  lastTs=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function makeCup(){
  if(have('copos')<1){D.out='Acabaram os copos!';return null}
  if(D.jarra<=0){
    if(have('cana')<S.rec.cana){D.out='Acabou a cana!';return null}
    if(have('limao')<S.rec.limao){D.out='Acabou o limão!';return null}
    take('cana',S.rec.cana);if(S.rec.limao)take('limao',S.rec.limao);D.jarra=10;D.jarras++;
  }
  take('copos',1);D.jarra--;
  const g=Math.min(S.rec.gelo,S.stock.gelo);S.stock.gelo-=g;
  if(g<S.rec.gelo&&!D.noIce){D.noIce=true}
  return {g};
}
const say=(w,t)=>{w.msg=t;w.at=performance.now()};
const tally=k=>{D.reasons[k]=(D.reasons[k]||0)+1};
function decide(w){
  w.dec=true;const L=loc();
  if(!w.stop)return;
  w.dwell=5;
  D.stopped++;
  if(D.out){D.missStock++;say(w,'Acabou? 😞');return}
  const wait=Math.max(0,D.busy-w.t);
  if(wait>w.pat){D.missQueue++;w.dwell=2;say(w,'Fila grande! 😤');return}
  const tol=(2.5+Math.max(0,D.temp-18)*0.18)*L.tol*(0.85+S.rep/100*0.3)*rf(.75,1.3);
  if(S.rec.preco>tol){D.rejPrice++;say(w,'Muito caro! 💸');return}
  const cup=makeCup();if(!cup){D.missStock++;say(w,'Acabou? 😞');return}
  D.busy=Math.max(D.busy,w.t)+svcMin();D.sold++;D.rev+=S.rec.preco;S.cash+=S.rec.preco;w.buy=true;D.spin=1;w.dwell=14;
  let s=1,why=null,worst=0;const pen=(v,t)=>{s-=v;if(v>worst){worst=v;why=t}};
  const c=S.rec.cana;if(c<5)pen((5-c)*.22,'Tá aguado! 💧');else if(c>=7)s+=.05;
  const pref=clamp(Math.round(rf(-.45,3.45)),0,3),dl=S.rec.limao-pref;
  if(dl>=2)pen(dl*.13,'Muito azedo! 😖');else if(dl<=-2)pen(-dl*.12,'Faltou limão 🍋');else s-=Math.abs(dl)*.05;
  const ideal=clamp(Math.round((D.temp-16)/3),0,6),dg=cup.g-ideal;
  if(dg<=-2)pen(-dg*.12,'Tá quente! 🥵');else if(dg>=3)pen((dg-2)*.11,'Só gelo! 🧊');
  if(S.rec.preco<tol*.6)s+=.05;
  s=clamp(s,0,1);D.sats.push(s);
  if(s>=.8){D.happy++;say(w,R()<.5?'Delícia! 😋':'Geladinho! 👍')}
  else if(why){say(w,why);tally(why)}
  else say(w,'Ok 🙂');
  w.at+=w.dwell*.55*MS_PER_MIN/speed;
}
function processUntil(T){while(D.idx<D.ws.length&&D.ws[D.idx].t<=T){decide(D.ws[D.idx]);D.idx++}}
function loop(ts){
  const dt=Math.min(100,ts-lastTs);lastTs=ts;
  D.t+=dt/MS_PER_MIN*speed;
  processUntil(Math.min(D.t,DAY_MIN));
  draw(ts);hud();
  if(D.t>=DAY_MIN+8){endDay();return}
  raf=requestAnimationFrame(loop);
}
function hud(){
  const m=Math.min(D.t,DAY_MIN),hh=8+Math.floor(m/60),mm=Math.floor(m%60/15)*15;
  $('#dClock').textContent=`🕗 ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  $('#dSold').textContent=`🥤 ${D.sold} vendidos`;
  $('#dCash').textContent='💰 '+fmt(S.cash);
  $('#dStk').innerHTML=`<span>🎋 ${have('cana')}</span><span>🍋 ${have('limao')}</span><span>🧊 ${have('gelo')}</span><span>🥤 ${have('copos')}</span><span>🫗 ${D.jarra}/10</span>`;
}
$('#spd').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;speed=+b.dataset.s;
  document.querySelectorAll('#spd button').forEach(x=>x.classList.toggle('on',x===b))});
$('#bSkip').onclick=()=>{if(!D)return;processUntil(DAY_MIN);endDay()};

function endDay(){
  cancelAnimationFrame(raf);
  if(D.ended)return;D.ended=true;
  const disc=D.jarra;D.jarra=0;
  const spC=expiring('cana'),spL=expiring('limao');
  S.stock.cana=S.stock.cana.filter(b=>b.exp>S.day);S.stock.limao=S.stock.limao.filter(b=>b.exp>S.day);
  const g=S.stock.gelo,keep=S.up.isopor?Math.floor(g/2):0,melt=g-keep;S.stock.gelo=keep;
  const avg=D.sats.length?D.sats.reduce((a,b)=>a+b,0)/D.sats.length:0;
  let dRep=(D.sats.length?(avg-.62)*22*Math.min(1,D.sold/12):0)-Math.min(6,(D.missStock+D.missQueue)*.12)-(D.rejPrice>D.sold&&D.rejPrice>5?2:0);
  S.rep=clamp(S.rep+dRep,0,100);
  const profit=D.rev-S.spent-D.rent-D.wage;
  S.hist.push({day:S.day,profit,sold:D.sold});
  const W=WEATHER[D.type],F=WEATHER[S.fc.type];
  const top=Object.entries(D.reasons).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const loss=[];
  if(disc)loss.push(`🫗 ${disc} copos de garapa jogados fora`);
  if(spC)loss.push(`🎋 ${spC} canas murcharam`);
  if(spL)loss.push(`🍋 ${spL} limões estragaram`);
  if(melt)loss.push(`🧊 ${melt} cubos de gelo derreteram`);
  const miss=[];
  if(D.missStock)miss.push(`🚫 ${D.missStock} sem estoque`);
  if(D.missQueue)miss.push(`⏳ ${D.missQueue} desistiram da fila`+(D.missQueue>=8&&!(S.up.moenda2&&ajOn())?`<br><small style="color:var(--muted)">💡 Moenda mais rápida ou ajudante (aba Equip.) diminuem a fila</small>`:''));
  if(D.rejPrice)miss.push(`💸 ${D.rejPrice} acharam caro`);
  const r0=Math.round(D.rep0),r1=Math.round(S.rep),last=S.day>=SEASON;
  modal(`<h2>Fim do dia ${S.day} · ${dow(S.day)}</h2>
    <p>Previsão ${F.e} ${S.fc.temp}° → Real ${W.e} ${D.temp}°C</p>
    <p>Passaram <b>${D.pass}</b> · Pararam <b>${D.stopped}</b> · Compraram <b>${D.sold}</b></p>
    <div class="sec">Caixa</div>
    <div class="kv"><span>Vendas</span><b class="pos">+ ${fmt(D.rev)}</b></div>
    <div class="kv"><span>Insumos comprados</span><b class="neg">− ${fmt(S.spent)}</b></div>
    <div class="kv"><span>Aluguel</span><b class="neg">− ${fmt(D.rent)}</b></div>
    ${D.wage?`<div class="kv"><span>Ajudante</span><b class="neg">− ${fmt(D.wage)}</b></div>`:''}
    <div class="kv tot"><span>Resultado do dia</span><span class="${profit>=0?'pos':'neg'}">${profit>=0?'+ ':'− '}${fmt(Math.abs(profit))}</span></div>
    ${D.sats.length?`<div class="sec">Clientes</div><div class="lst">Satisfação média: <b>${Math.round(avg*100)}%</b> · ${D.happy} adoraram${top.length?'<br>'+top.map(([k,v])=>`${v}× “${k}”`).join('<br>'):''}</div>`:''}
    ${miss.length?`<div class="sec">Não atendidos</div><div class="lst">${miss.join('<br>')}</div>`:''}
    ${loss.length?`<div class="sec">Perdas</div><div class="lst">${loss.join('<br>')}</div>`:''}
    <div class="sec">Fama</div><div class="lst">⭐ ${r0} → <b>${r1}</b> <span class="${r1>=r0?'pos':'neg'}">(${r1>=r0?'+':''}${r1-r0})</span></div>
    <div class="mbtns"><button class="btn or" id="bNext">${last?'Ver resultado final':'Próximo dia ▶'}</button></div>`);
  $('#bNext').onclick=nextDay;
}
function nextDay(){
  closeModal();D=null;
  if(S.day>=SEASON)return finalScreen();
  S.day++;S.buys=[];S.spent=0;genForecast();save();tab='estoque';renderMorning();show('morning');
}
function finalScreen(){
  const best=getBest(),total=S.cash,isRec=total>best;
  if(isRec)setBest(Math.round(total));
  const bd=S.hist.reduce((a,b)=>b.profit>a.profit?b:a,S.hist[0]);
  const sold=S.hist.reduce((a,b)=>a+b.sold,0);
  const ups=UPS.filter(u=>S.up[u.id]).length;
  clearSave();
  modal(`<h2>🏁 Temporada encerrada!</h2>
    ${isRec?'<p><b>🏆 Novo recorde!</b></p>':''}
    <div class="kv tot"><span>Caixa final</span><span class="pos">${fmt(total)}</span></div>
    <div class="kv"><span>Copos vendidos</span><b>${sold}</b></div>
    <div class="kv"><span>Melhor dia</span><b>Dia ${bd.day}: ${fmt(bd.profit)}</b></div>
    <div class="kv"><span>Fama final</span><b>⭐ ${Math.round(S.rep)}</b></div>
    <div class="kv"><span>Equipamentos</span><b>${ups}/${UPS.length}</b></div>
    <div class="kv"><span>Recorde</span><b>${fmt0(Math.max(best,total))}</b></div>
    <div class="mbtns"><button class="btn ghost" onclick="closeModal();renderTitle();show('title')">Menu</button><button class="btn or" onclick="closeModal();newGame()">Jogar de novo</button></div>`);
}

const cv=$('#cv'),ctx=cv.getContext('2d');let CW=300,CH=300;
function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1),r=cv.getBoundingClientRect();
  CW=r.width;CH=r.height;cv.width=Math.round(CW*dpr);cv.height=Math.round(CH*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',()=>{if(D)resize()});
const lerp=(a,b,t)=>a+(b-a)*t, ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)}, pick=a=>a[Math.floor(R()*a.length)];
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function shade(h,f=.75){const n=parseInt(h.slice(1),16);return `rgb(${(n>>16)*f|0},${((n>>8)&255)*f|0},${(n&255)*f|0})`}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}

const SKIN=['#f6d2b8','#e9b48d','#cf9466','#a8693f','#7a4a2b','#5a3520'];
const SHIRT=['#e8505b','#f2c230','#3a86c8','#2f9e6e','#9b59b6','#ff8c42','#f4f1ea','#1abc9c','#e84393','#34495e','#c0392b','#5dade2'];

function makeLook(){return {skin:pick(SKIN),shirt:pick(SHIRT),pants:pick(PANTS),hair:pick(HAIRC),ht:pick(HAIRT),cap:pick(SHIRT),kid:R()<.12,skirt:R()<.18}}

function makeCity(){

/* person: feet at (x,y), facing dir (1=right) */
function person(x,y,s,dir,ph,lk,o){
  ctx.save();ctx.translate(x,y);if(lk.kid)s*=.74;ctx.scale(s*dir,s);
  ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(0,0,13,3.5,0,0,Math.PI*2);ctx.fill();
  const a=o.walk?Math.sin(ph)*.55:0;
  ctx.lineCap='round';
  const leg=(ang,col)=>{const ex=Math.sin(ang)*23,ey=-25+Math.cos(ang)*23;
    ctx.strokeStyle=col;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.fillStyle='#2b2a22';ctx.beginPath();ctx.ellipse(ex+2.5,ey-1,4.6,2.6,0,0,Math.PI*2);ctx.fill()};
  leg(-a,shade(lk.pants));leg(a,lk.pants);
  if(lk.skirt){ctx.fillStyle=lk.pants;ctx.beginPath();ctx.moveTo(-8,-28);ctx.lineTo(8,-28);ctx.lineTo(11,-15);ctx.lineTo(-11,-15);ctx.closePath();ctx.fill()}
  const arm=(ang,col)=>{ctx.strokeStyle=col;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,-44);ctx.lineTo(Math.sin(ang)*17,-44+Math.cos(ang)*17);ctx.stroke()};
  arm(a*.9,shade(lk.skin,.85));
  ctx.fillStyle=lk.shirt;rr(-8.5,-49,17,25,6);ctx.fill();
  if(lk.apron){ctx.fillStyle='#e8d9b0';rr(-1,-40,10,18,3);ctx.fill()}
  // front arm
  const fa=o.armAng!=null?o.armAng:o.cup?2.1:-a*.9;
  ctx.strokeStyle=lk.shirt;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,-45);ctx.lineTo(Math.sin(fa)*6,-45+Math.cos(fa)*6);ctx.stroke();
  arm(fa,lk.skin);
  if(o.cup){const hx=Math.sin(fa)*17,hy=-44+Math.cos(fa)*17;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(hx-3.5,hy-9);ctx.lineTo(hx+3.5,hy-9);ctx.lineTo(hx+2.6,hy+2);ctx.lineTo(hx-2.6,hy+2);ctx.closePath();ctx.fill();
    ctx.fillStyle='#c7cf5a';ctx.fillRect(hx-3,hy-6,6,3);
    ctx.strokeStyle='#e8505b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(hx,hy-9);ctx.lineTo(hx+3,hy-15);ctx.stroke()}
  // neck & head
  ctx.fillStyle=lk.skin;ctx.fillRect(-2.5,-52,5,4);
  circ(0,-58,9,lk.skin);
  ctx.fillStyle=lk.hair;
  const top=()=>{ctx.beginPath();ctx.arc(0,-58.5,9.6,Math.PI*.95,Math.PI*2.02);ctx.closePath();ctx.fill();ctx.fillRect(-9.6,-59,5,6)};
  if(lk.ht==='short')top();

    placed.push([bx,y,tw]);bubble(e.w.msg,e.x,y,1-Math.max(0,(age-1400)/600))}
  if(D.type==='chuva'){ctx.strokeStyle='rgba(225,238,255,.55)';ctx.lineWidth=1.2;ctx.beginPath();
    for(const d of D.drops){d.y+=.012*d.s*speed;if(d.y>1){d.y=0;d.x=R()}const x=d.x*CW,y=d.y*CH;ctx.moveTo(x,y);ctx.lineTo(x-3,y+11)}ctx.stroke()}
  const ban=(t,c)=>{ctx.font='700 13px system-ui,sans-serif';const tw=ctx.measureText(t).width+24;ctx.fillStyle=c;rr(CW/2-tw/2,10,tw,28,14);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,CW/2,24.5)};
  if(D.out)ban('⚠️ '+D.out,'rgba(200,72,58,.94)');else if(D.t>=DAY_MIN)ban('Fechando a barraca…','rgba(31,94,58,.94)');
}
function bubble(t,x,y,a){
  ctx.globalAlpha=clamp(a,0,1);ctx.font='700 12.5px system-ui,sans-serif';
  const tw=ctx.measureText(t).width+16,bh=24,bx=clamp(x-tw/2,3,CW-tw-3);
  ctx.fillStyle='rgba(0,0,0,.12)';rr(bx+1,y-bh+2,tw,bh,12);ctx.fill();
  ctx.fillStyle='#fff';rr(bx,y-bh,tw,bh,12);ctx.fill();ctx.beginPath();ctx.moveTo(x-5,y-1);ctx.lineTo(x+5,y-1);ctx.lineTo(x,y+6);ctx.fill();
  ctx.fillStyle='#2b2a22';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,bx+tw/2,y-bh/2+.5);
  ctx.globalAlpha=1;
}

/* ---------- title ---------- */
function renderTitle(){
  const s=load();$('#bCont').style.display=s?'block':'none';
  if(s)$('#bCont').textContent=`Continuar · dia ${s.day}`;
  const b=getBest();$('#recTxt').textContent=b?`🏆 Recorde: ${fmt0(b)}`:'';
}
$('#bCont').onclick=()=>{S=load();if(!S)return;tab='estoque';renderMorning();show('morning')};
$('#bNew').onclick=()=>{
  if(load())modal(`<h2>Nova temporada?</h2><p>O jogo salvo será apagado.</p><div class="mbtns"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn or" onclick="closeModal();newGame()">Começar</button></div>`);
  else newGame();
};
$('#bHelp').onclick=()=>modal(`<h2>Como jogar</h2>
  <p>Toda manhã você vê a previsão do tempo, compra insumos, ajusta a receita e o preço. Depois abre a barraca e acompanha os clientes.</p>
  <ul>
  <li><b>Cana</b> murcha em 2 dias, <b>limão</b> em 4 e o <b>gelo</b> derrete à noite.</li>
  <li>A garapa que sobra na jarra no fim do dia vai fora.</li>
  <li>Fique de olho no que os clientes dizem: aguado, azedo, quente, caro…</li>
  <li>Cliente satisfeito aumenta a <b>fama ⭐</b>, que traz mais gente e aceita preço maior.</li>
  <li>Use o lucro para comprar <b>equipamentos</b> e liberar <b>pontos</b> melhores.</li>
  <li>A previsão pode errar! O rádio ajuda.</li>
  </ul>
  <p>Temporada de ${SEASON} dias. Termine com o maior caixa possível.</p>
  <div class="mbtns"><button class="btn or" onclick="closeModal()">Bora!</button></div>`);
renderTitle();
</script>
